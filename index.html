  /* ============================================================
     ★★ 2026-08-23 대개편 — **컴팩트 원칙** (사용자 지시)
       「모든 화면구성을 이렇게 컴팩트하게 하자. 쓸데없이 칸 크게 하지말고.」
       「굳이 경험치를 가로에 꽉차게 해서 한명한명 나열했는데, 이렇게 할거면
        가운데 쯤에 스탯을 기재하던지, 다른 유용한 정보를 꽉 채워 넣라.」
     ⚠️ 그래서 목록 한 줄은 **정보를 꽉 채우고 높이는 낮다.** 가로로 늘어진 게이지는 없앤다.
     ⚠️ 그리고 **거의 모든 것이 팝업**이다 — 화면을 갈아엎지 않고 그 자리에서 끝낸다.
     ============================================================ */

  /* ── 넓은 팝업 — 「어차피 팝업으로 띄울거 가로로 더 넓어도 되는거 아닌가」 */
  #modal .box.pad0{padding:12px;}

  /* ★★ 화면 규격(2026-08-24) — 4단 뼈대 · 시트 · 격자 */
  /* ⚠️ 리뷰 지적(라운드1) — 여기서 overflow:hidden 을 줬었다. `.box`는 옛 openModal 도
     쓰는 **같은 요소**라 안전망(overflow:auto, game.html:261)이 사라지면 무리게이트·
     「없는 동안」처럼 목록+버튼이 긴 화면에서 **행동 버튼이 화면 밖으로 잘려 안 눌린다.**
     세로 스크롤 금지는 §2 규격상 `.k-body` 안쪽 얘기지 `.box` 자체의 안전망을 걷으란 뜻이 아니다.
     → overflow 는 손대지 않는다(261행의 auto 가 계속 산다). display:flex 만 남긴다. */
  #modal .box{display:flex;flex-direction:column;}
  /* ★ 2026-09-07(B-1) — 옛 `.k-title`(19px 제목줄)은 없다. 팝업 머리도 시트와 같은 `.k2-head`(kit.panelHead) 다. */
  .k-back,.k-x{background:none;border:0;color:var(--c-sub);cursor:pointer;padding:0 4px;}
  .k-status{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 0;font-size:var(--fs-sub);color:var(--c-sub);
    border-bottom:1px solid var(--line);}
  .k-body{overflow:hidden;}          /* ⚠️ 세로 스크롤 금지 — 넘치면 grid() 로 나눈다 */
  /* ⚠️ 규격 §2가 금지한 세로 스크롤의 예외. 2026-08-25 사용자 결재: 도감은 훑어보는
     화면이라 쪽 넘김이 목적을 해친다. 스크롤바는 숨기고 밀어서 넘긴다. */
  #modal .box.k-scroll-popup{overflow:hidden;}
  .k-body.k-body-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;}
  .k-body.k-body-scroll::-webkit-scrollbar{display:none;}
  /* ⚠️ 2026-08-30(mph-qa U5) — 스크롤바를 숨겼으니 **더 있다는 신호**가 없으면 잘린 화면으로
     읽힌다(캐릭터창 실측). 바닥을 살짝 바래게 해서 「아래가 더 있다」를 말한다. */
  .k-body.k-body-scroll{-webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);
    mask-image:linear-gradient(#000 calc(100% - 16px),transparent);}
  .k-actions{display:flex;gap:8px;justify-content:flex-end;}
  /* ⚠️ 수정 라운드 1(리뷰 지적 c) — 시트에 진짜 닫는 길(바깥 탭·✕)이 생겼다. 그 전엔 「닫기」가
     행동버튼 자리 하나를 먹어서, 세 번째 선택지가 12px 밑줄 글자로 밀려났다(가장 나쁜 예:
     strainGate 의 「그래도 보낸다」). 이제 각 시트는 진짜 버튼 2개만 갖는다. */
  .k-sh-bg{position:absolute;inset:0;z-index:69;}
  /* 🔴 QA5 C-9(2026-09-07) — 시트 v1 의 아래 여백이 **16px 고정**이라, 탭바 없는 화면(타이틀의
     「저장 관리」→「정말 지웁니까」)에서 시트가 프레임 맨 밑에 붙고 그 행동 버튼(「지운다」·「아니오」)이
     폰 홈 인디케이터 자리에 깔렸다(390×844 실측 · 실브라우저로 재현). v2 의 행동 줄은 처음부터
     `calc(--sp-3 + env(safe-area-inset-bottom))` 였다 — 같은 자로 맞춘다.
     ⚠️ 되돌릴 수 없는 조작(계정 삭제)의 확인 버튼이라 「닿기만 하면 된다」가 아니라 **확실히** 떠야 한다. */
  .k-sheet{position:absolute;left:0;right:0;bottom:0;z-index:70;background:var(--c-panel);
    border-top:1px solid var(--line);border-radius:var(--rad-sheet) var(--rad-sheet) 0 0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:calc(100% - var(--h-top) - 24px);overflow-y:auto;   /* scroll-ok — 넘칠 때만 도는 안전망(버튼이 화면 밖으로 밀리지 않게) */
    box-shadow:0 -8px 26px rgba(0,0,0,.67);animation:shup .16s ease;}
  /* 🔴 2026-09-03(계획 4b Task 4) — 시트 v1 도 **탭바 위**에 앉는다. v2 는 처음부터 그랬는데
     v1 에만 이 줄이 없어서, 탭이 있는 화면에서 시트가 탭바를 덮고 제 행동 버튼(「닫기」)이
     탭 이름(「영주」) 위에 겹쳐 찍혔다(캐릭 상세 스킬 시트 실측 캡처). 같은 자로 맞춘다. */
  #frame.tabs .k-sheet{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  @keyframes shup{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}

  /* ★★ 바닥 시트 v2 · 하단 띠 · 접힘 띠 (2026-09-02 · 스펙 §3-6) */
  /* ★ 2026-09-08 자리 검사 — 위 여백 24 → 8. 본문이 23px 모자라 잘리고 있었는데, **내용을 깎기 전에**
     안 쓰는 여백부터 돌려준다(재화띠는 그대로 보인다). 이 한 줄이 시트 본문에 16px 을 준다. */
  .k-sheet2{padding:0;max-height:calc(100% - var(--h-top) - 8px);display:flex;flex-direction:column;
    border-radius:var(--rad-sheet) var(--rad-sheet) 0 0;transition:transform .16s ease;}
  #frame.tabs .k-sheet2{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  /* `.k2-head`·`.k2-ico`·`.k2-title` 는 아래 「피부 B 공통」 블록에 있다(2026-09-07 — 팝업과 시트가 같은 머리를 쓴다) */
  .k2-tabs{height:var(--h-seg);flex:0 0 var(--h-seg);display:flex;gap:var(--sp-1);padding:0 var(--sp-3);align-items:center;border-bottom:1px solid var(--c-line);}
  .k2-tab{flex:1;text-align:center;font-size:var(--fs-sub);padding:6px 0;border-radius:var(--rad-btn);background:var(--c-press);color:var(--c-sub);border:1px solid var(--c-line);cursor:pointer;}
  .k2-tab.on{background:var(--c-gold-well);color:var(--c-goldtxt);border-color:var(--c-gold);}
  .k2-body{flex:1;min-height:0;overflow:hidden;}
  .k2-actions{flex:0 0 auto;display:flex;gap:var(--sp-2);justify-content:flex-end;}
  /* ★★ 피부 B — 팝업·시트 공통 (스펙 2026-09-07 B-2 · 목업 B_금장액자.png). 토큰만 쓴다.
     팝업(#modal .box)과 바닥 시트(.k-sheet2)가 **같은 클래스 `.k-skin`** 을 입는다 — 피부가 두 벌이 되지 않게.
     ⚠️ 머리 72(`.k2-head`)는 kit.panelHead 가 만든다. 마름모(`.k-corner`)는 머리 밑선 양끝(시트 2 · 팝업은 행동띠 위까지 4). */
  /* ⚠️ position 은 여기서 안 건드린다 — 시트는 absolute(.k-sheet), 팝업 상자만 아래서 relative(마름모 기준) */
  .k-skin,#modal .box.k-skin,.k-sheet.k-skin{background:linear-gradient(180deg,var(--c-panel-hi),var(--c-panel) 30%);color:var(--c-text);
    box-shadow:inset 0 0 0 1px var(--c-gold-dim),inset 0 0 0 4px var(--c-panel),inset 0 0 0 5px var(--c-line),0 -12px 40px rgba(0,0,0,.8);}
  #modal{z-index:60;background:rgba(0,0,0,.55);}   /* z60 유지 — 튜토리얼 마스크 65 아래(test-view:868). 시트 위 확인은 confirmSheet 가 맡는다 */
  #modal .box{position:relative;border:2px solid var(--c-gold);border-radius:var(--rad-card);padding:6px;max-width:440px;}
  /* ★ 2026-09-08 — `xwide` 의 세로 한도를 92%→100% 로 풀었다(실측 +25px).
     8% 를 남겨 두는 것은 **그림 여백이 아니라 잘려 나가는 줄**이었다: 도감 상세 상자가
     293px 로 묶여 본문이 134px 뿐이었고 거기에 312px 이 들어 있었다.
     ⚠️ `#modal` 이 이미 padding 8 을 두고 탭바 높이만큼 올라와 있다 — 100% 여도 화면에 안 붙는다.
     ⚠️ 한도를 푸는 것뿐이라 **내용이 짧은 팝업은 크기가 그대로**다(상자는 내용 크기로 선다). */
  #modal .box.wide{max-width:900px;} #modal .box.xwide{max-width:960px;max-height:100%;}
  /* ★ 2026-09-08 — 행동띠에 얹힌 쪽 단추는 **가로를 아낀다.** 띠에는 행동 단추도 같이 서는데
     쪽 단추가 기본 여백(16)을 쓰면 셋이 안 들어가 **단추 글자가 두 줄로 접힌다**(「자물쇠 걸 / 기」·
     캡처 실측). 접히는 것은 안 넘치니 자리 검사도 조용하다 — 그래서 여기서 줄인다. */
  .k-actions>.k-page .btn,.k2-actions>.k-page .btn{padding-left:10px;padding-right:10px;}
  .k-actions>.k-page,.k2-actions>.k-page{gap:8px;}
  .k-sh-bg{background:rgba(0,0,0,.55);}
  .k-sheet{border-radius:var(--rad-sheet) var(--rad-sheet) 0 0;}
  .k-sheet.k-sheet2{border-top:2px solid var(--c-gold);}
  .k2-head{height:72px;flex:0 0 72px;display:flex;align-items:center;gap:var(--sp-2);margin:6px 6px 0;padding:0 var(--sp-2);
    border-bottom:1px solid var(--c-gold);position:relative;}
  .k2-head::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--c-line);}
  .k2-ico{width:56px;height:56px;border-radius:var(--rad-card);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:radial-gradient(circle at 50% 35%,var(--c-gold-well),var(--c-press) 70%);color:var(--c-goldtxt);border:1px solid var(--c-gold);
    box-shadow:inset 0 0 0 2px var(--c-panel),inset 0 0 0 3px var(--c-gold-dim);}
  .k2-title{flex:1 1 0;min-width:0;}
  .k2-title b{display:block;font-size:var(--fs-title);font-weight:700;color:var(--c-goldtxt);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k2-sub{font-size:var(--fs-sub);color:var(--c-sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k2-head .k-x,.k2-head .k-back{min-width:var(--tap);min-height:var(--tap);background:none;border:0;color:var(--c-sub);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .k-corner{position:absolute;width:10px;height:10px;background:var(--c-gold);transform:rotate(45deg);z-index:2;pointer-events:none;}
  .k-corner.tl{left:10px;top:73px;} .k-corner.tr{right:10px;top:73px;}
  .k-corner.bl{left:10px;bottom:52px;} .k-corner.br{right:10px;bottom:52px;}
  /* 본문 카드 — ⚠️ `.k-card` 는 사람 카드(kit.charCard · 아래 ⑤)가 이미 쓰는 이름이라 여기서는 `.k-panel` 이다 */
  .k-panel{background:var(--c-press);border:1px solid var(--c-gold-dim);border-radius:var(--rad-card);box-shadow:inset 0 1px 0 var(--rim);padding:var(--sp-2);}
  .k-chip2{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:24px;padding:2px 8px;border-radius:var(--rad-chip);
    background:var(--c-gold-well);border:1px solid var(--c-gold);color:var(--c-goldtxt);font-size:var(--fs-note);white-space:nowrap;}
  /* ★ 피부 B 본문 부품 (스펙 2026-09-07 B-3 · 결재 1안) — 정수 설명 공용 본문 `ui/essence.body.js` 가 쓴다. 토큰만.
     `.k-chip2.off` = 아직 안 온 단계(별 줄) · `.k-tile3` = 숫자 타일 64(위 11 이름 · 가운데 17 숫자 · 아래 11 단위) */
  .k-chip2.off{background:var(--c-press);border-color:var(--c-line);color:var(--c-sub);}
  /* `.up` = 성격 유인 + · `.ok` = 끝난 것(연구 완료). 색은 같지만 **뜻이 달라** 이름을 나눠 둔다 —
     하나로 쓰면 다음 사람이 「완료」에 `.up` 을 적고, 그 뒤 유인 색만 바꾸려다 완료까지 바꾼다 */
  .k-chip2.up, .k-chip2.ok{background:var(--c-press);border-color:var(--c-ok);color:var(--c-ok);}
  /* `.down` = 성격 유인 − · `.warn` = 값이 깎이는 이유(대행 ×0.3). 색은 같지만 **뜻이 달라**
     이름을 나눠 둔다(`.up`/`.ok` 와 같은 규율) — 하나로 쓰면 다음 사람이 한쪽을 고치다 둘을 바꾼다 */
  .k-chip2.down, .k-chip2.warn{background:var(--c-press);border-color:var(--c-warn);color:var(--c-warn);}
  /* ⚠️ `.k-tile3`(옛 정수 능력치 타일 64)은 B-6 에서 **정수 설명에서** 빠졌다 — 능력치는 이제
     `.ess-stats` 칩 한 줄이다. 규칙은 2026-09-08(계획 B Task 5)에 **시설 효과 타일**로 되살아났다:
     시설 시트가 「이 시설이 지금 무엇을 얼마나 하고 있나」를 숫자 셋으로 말하는 자리다.
     기본 3열, 타일이 둘뿐인 시설(청소실·대장간)은 `.two`(2열) — **빈 타일을 만들어 채우지 않는다.** */
  .k-tile3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-bottom:4px;}
  .k-tile3.two{grid-template-columns:repeat(2,1fr);}
  .k-tile{height:64px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border-radius:var(--rad-card);background:var(--c-press);border:1px solid var(--c-gold-dim);box-shadow:inset 0 1px 0 var(--rim);}
  .k-tile .t{display:flex;align-items:center;gap:3px;font-size:var(--fs-note);color:var(--c-sub);max-width:96%;overflow:hidden;white-space:nowrap;}
  .k-tile .v{font-size:var(--fs-num);font-weight:800;line-height:1;color:var(--c-goldtxt);font-variant-numeric:tabular-nums;}
  .k-tile .u{font-size:var(--fs-note);color:var(--c-sub);max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .k-tile.warn{border-color:var(--c-warn);} .k-tile.warn .v{color:var(--c-warn);}
  .k-tile.ok .v{color:var(--c-ok);}
  /* ── 연구소 격자 (A-12 화면 · 계획 B Task 8a) — **4갈래(행) × 3단(열)**.
     순서가 갈래 안에서만 있으니(`researchCheck` 의 `order`) **왼쪽이 앞 단**이고, 갈래를 넘나드는
     선은 없다 — 트리 선을 그릴 것이 없어 격자만으로 규칙이 보인다(글로 설명하지 않는다).
     ⚠️ 시트 본문은 `overflow:hidden` 이라 **네 줄이 다 들어와야 한다** — 칸 높이를 키우지 마라. */
  .k-grid34{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:4px;}
  /* 4열 — 전설 탭(A-18-5). 직군 일곱 + 공통 관문 하나 = **여덟 칸이 두 줄에 딱 맞는다**.
     ⚠️ 3열로 두면 세 줄이 되어 마지막 줄이 본문 밖으로 나간다(실측). 칸이 좁아진 만큼
        칸 안에는 **직군 이름 · 재료 이름(「의 정수」를 뗀 것) · 칩 하나**만 넣는다. */
  .k-grid44{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:4px;}
  /* 두 칸을 먹는 칸 — 증표처럼 값 둘을 한 줄에 적어야 하는 자리(한 칸 103px 로는 칩이 잘린다) */
  .k-grid44 .k-node.wide2{grid-column:span 2;}
  .k-node{min-width:0;padding:2px 6px;border-radius:var(--rad-card);background:var(--c-press);
    border:1px solid var(--c-line);display:flex;flex-direction:column;gap:1px;overflow:hidden;}
  .k-node .nm{font-size:var(--fs-note);font-weight:800;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-node .ds{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-node .ft{display:flex;align-items:center;gap:3px;overflow:hidden;}
  /* 칸 안의 칩은 한 치수 작다 — 24 짜리 기본 칩을 네 줄 쌓으면 격자가 시트 밖으로 나간다 */
  .k-node .ft .k-chip2{min-height:15px;padding:0 4px;}
  .k-node .ft .bar{flex:1 1 auto;min-width:24px;}
  .k-node.done{border-color:var(--c-gold);}
  .k-node.run{border-color:var(--c-ok);}
  /* 잠긴 칸은 **지우지 않고 흐린다** — 무엇이 남았는지가 보여야 다음에 뭘 할지 정한다 */
  .k-node.lock{opacity:.6;}
  /* ── 정수 제단 (A-17 화면 · 계획 B Task 8b) — 재료 칸 셋 · 고르는 격자 카드 · 결과 한 장.
     ⚠️ 시트 본문은 `overflow:hidden` 이다 — 담당 카드 + 칸 셋 + 값 줄 + 결과 + 레벨업 + 청소가
        다 들어와야 한다. 결과 그림을 키우려면 **먼저 찍어 봐라**(96 이 지금 예산이다). */
  .k-altar .k-slots{margin-top:var(--sp-2);}
  .k-altar .k-slot{flex:1 1 0;height:64px;gap:2px;}
  .k-altar .k-slot.on{border-color:var(--c-gold);}
  .k-essface{border-radius:var(--rad-card);overflow:hidden;flex:0 0 auto;}
  .k-essface img,.k-essface canvas{width:100%;height:100%;object-fit:cover;display:block;}
  .k-esscard{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;}
  .k-esscard .nm{font-size:var(--fs-note);color:var(--c-text);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-esscard .ds{font-size:var(--fs-note);color:var(--c-sub);}
  /* 결과 — **값을 치른 뒤 남는 한 장**이라 크게 세운다(금테로 「이게 나온 것」을 못 박는다) */
  .k-altarout{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:6px;padding:var(--sp-2);
    border-radius:var(--rad-card);background:var(--c-press);border:1px solid var(--c-gold);}
  .k-altarout .mid{flex:1 1 0;min-width:0;}
  .k-altarout .nm{font-size:var(--fs-sub);font-weight:800;color:var(--c-goldtxt);}
  /* 시설 시트 본문 줄 — 담당 카드(`.k-mgr`)·술·레벨업·청소(`.k-facrow`). 왼쪽 그림 · 가운데 글 · 오른쪽 단추
     🔴 이름이 `.k-line` 이 **아닌** 이유 — 그 이름은 이미 아래 `:914` 가 다른 뜻으로 쓴다(확인창의
        「설명 한 줄」). 같은 특이도면 뒤가 이겨서 그쪽 `padding:3px 0` 이 먹혔고, 시설 시트의
        레벨업·청소 줄이 **좌우 여백 0** 으로 그려졌다(아이콘이 테두리에 물려 잘렸다 · 리뷰 I-1).
        남의 이름에 규칙을 얹지 마라 — 자식 규칙(`img`·`canvas`)까지 그쪽에 새어 나간다. */
  .k-panel.k-mgr,.k-panel.k-facrow{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:6px;min-height:var(--tap);padding:var(--sp-2);}
  .k-mgr .mid,.k-facrow .mid{flex:1 1 0;min-width:0;}
  .k-mgr .nm,.k-facrow .nm{font-size:var(--fs-body);color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-mgr .ds,.k-facrow .ds{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 공사 게이지(A-11 화면) — **제목에 붙이면 밑줄로 읽힌다.** 위아래로 떼어 「막대」로 보이게 한다 */
  .k-facrow .mid .bar{margin:4px 0 3px;}
  /* 공사 중 줄 — 게이지를 **줄 아래쪽에 띄운다**(2026-09-08 자리 검사). 흐름에 두면 줄이 58px 이 되어
     본문이 넘쳤다. 띄우면 44px 한 줄에 제목·남은 시간·게이지·즉시완료가 다 든다. */
  .k-facrow.prog{position:relative;}
  .k-facrow.prog .mid .bar{position:absolute;left:8px;right:8px;bottom:5px;margin:0;}
  .k-mgr .fc{flex:0 0 auto;display:flex;align-items:center;}
  .k-mgr .fc img,.k-mgr .fc canvas{width:40px;height:40px;border-radius:50%;object-fit:cover;}
  .k-mgr .rt{flex:0 0 auto;text-align:right;}
  .k-mgr .rt b{font-size:var(--fs-sub);color:var(--c-goldtxt);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:2px;}
  .k-mgr .rt b.warn{color:var(--c-warn);}
  .k-mgr .rt .u{font-size:var(--fs-note);color:var(--c-sub);}
  /* 마지막 줄은 아래 여백을 안 쓴다 — 그 8px 이 훈련장 시트에서 청소 줄을 행동띠 밖으로 밀어냈다(실측) */
  .k2-body .k-facrow:last-child,.k2-body .k-mgr:last-child{margin-bottom:0;}
  .k-facrow .rt{flex:0 0 auto;font-size:var(--fs-sub);color:var(--c-goldtxt);}
  .k-facrow img,.k-facrow canvas{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 auto;}
  /* 오염 막대 8 — 70 이상은 경고색(그 값이 「지금 닦아라」의 문턱이다 · A-10) */
  .k-dirtbar{height:8px;border-radius:var(--rad-chip);background:var(--c-panel);border:1px solid var(--c-line);overflow:hidden;}
  .k-dirtbar i{display:block;height:100%;background:var(--c-gold);}
  .k-dirtbar.warn i{background:var(--c-warn);}
  /* 훈련장 몸통 — 구획 잔글씨 · 초상 줄(`.k-slots`) · 초상 한 칸 · 세션 게이지
     ⚠️ 전부 `.k-gym` 안으로 **범위를 좁혔다** — `.k-face` 는 이미 `explore3d.js` 의 36px 몬스터
        초상 상자가 쓰는 이름이라, 무범위로 얹으면 그 안 그림이 44px 원이 되어 모서리가 잘린다(리뷰 M-5). */
  /* ⚠️ 높이가 빠듯하다 — 시트 본문은 `overflow:hidden` 이고 이 판은 세로 스크롤을 안 만든다.
     ★ 2026-09-08(수정 4) — **초상을 44 로 되돌렸다.** 32 는 담당 카드 얼굴(40)보다 작아
     「초상·아이콘은 크게」라는 이 판의 관례와 정면으로 부딪힌다. 자리는 「안 오는 사람」 줄에서
     초상을 빼서 냈다(수와 기호만 적는다 · `fac.body.js`) — 그 사람들은 개별로 볼 값이 없다. */
  .k-gym{display:flex;flex-direction:column;gap:var(--sp-1);margin-bottom:var(--sp-1);}
  .k-gym .k-sub{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-gym .k-slots{margin-top:0;gap:var(--sp-1);overflow:hidden;}
  .k-gym .k-face{flex:0 0 auto;width:56px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15;}
  .k-gym .k-face img,.k-gym .k-face canvas{width:44px;height:44px;border-radius:50%;object-fit:cover;}
  .k-gym .k-face .nm{font-size:var(--fs-note);color:var(--c-text);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* ⚠️ 남은 시간(「60분 남음」)은 칸보다 넓다 — 가두지 않으면 옆 초상 밑으로 흘러 두 글자가 붙어 보인다 */
  .k-gym .k-face .tt{font-size:var(--fs-note);color:var(--c-goldtxt);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .k-gym .k-face .k-chip2{min-height:16px;padding:0 4px;font-size:var(--fs-note);}
  .k-gym .k-gauge{width:44px;height:4px;border-radius:var(--rad-chip);background:var(--c-panel);border:1px solid var(--c-line);overflow:hidden;}
  /* 「외 n명」 — 초상 넷을 넘으면 수로만 잇는다(줄이 시트 폭을 밀지 않게) */
  .k-gym .k-more{align-self:center;white-space:nowrap;}
  .k-gym .k-gauge i{display:block;height:100%;background:var(--c-gold);}
  /* 정수 설명 — 그림 96(`.ess-pic`) · 머리 구체 52(`.ess-orb` · 「구체 안 몬스터」 00_미반영 671) · 이름 밑 첫 줄(`.ess-head` 보유·겹침 칩) */
  .ess-pic{width:96px;height:96px;padding:0;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .ess-pic img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .ess-pic.ess-orb{width:52px;height:52px;border-radius:50%;}
  .ess-head{display:flex;align-items:center;gap:var(--sp-1);margin-top:2px;white-space:nowrap;overflow:hidden;}
  /* 자물쇠 표식 — **칩이 아니라 그림 하나**다(2026-09-08). 이 줄은 한 줄 예산이라 칩 상자를
     두르면 꼬리글이 잘린다. `flex:0 0 auto` 로 줄어들지 않게만 잡는다. */
  .ess-lockmark{display:flex;align-items:center;flex:0 0 auto;color:var(--c-goldtxt);}
  /* ★ 스킬 칸 2열 + 스킬 칸 부품 (스펙 2026-09-07 B-5 · 시안 B「56 · 금 2중 테」 · `ui/skilltile.js`).
     액자는 `.k2-ico` 와 같은 결(금 1px 테 + 안쪽 판색 2px·금흐림 1px 이중선) — 그림이 안을 채우므로 이중선은 ::after 로 위에 얹는다.
     아이콘은 128² 그림을 56 으로(폰 2× 에서 112 물리픽셀). 누르는 것 44 이상 — 칸 전체가 눌린다 */
  .k-skill{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;min-height:var(--tap);cursor:pointer;min-width:0;}
  .k-skill.dim{opacity:.55;}
  .k-skill .ic{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;display:block;vertical-align:0;flex:0 0 auto;
    border:2px solid var(--c-gold);background:var(--c-press);}
  .k-skill .ic img{display:block;width:100%;height:100%;object-fit:cover;}
  .k-skill .ic::after{content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none;
    box-shadow:inset 0 0 0 2px var(--c-panel),inset 0 0 0 3px var(--c-gold-dim);}
  .k-skill .nm{font-size:var(--fs-body);font-weight:700;color:var(--c-text);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .k-skill .st{font-size:var(--fs-note);color:var(--c-sub);line-height:1.1;}
  /* 툴팁 큰 판 — 스킬 설명(이름 14 굵게 · 타입 칩 · 설명 · 계수 칩). 크림 종이 위라 칩은 갈색 선 하나로 */
  #tip.wide{max-width:300px;pointer-events:none;}
  #tip.wide > b{font-size:var(--fs-body);}
  #tip .tip-chips{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0;}
  #tip .tip-desc{font-weight:600;margin:2px 0;}
  #tip .k-chip2{background:transparent;border-color:var(--c-paper-line);color:var(--c-paper-line);min-height:20px;padding:1px 6px;}
  /* ★★ 정수 팝업 v2 — 스킬 줄 (스펙 2026-09-07 B-6 · 사용자 재배치 지시 · `ui/skilltile.js skillRow`)
     `[세로 알약 ACTIVE|PASSIVE 24×72] [스킬 칸 56 아이콘 + 이름] [설명 3줄 clamp + 계수 칩]` 한 줄.
     ⚠️ 「최소화할 건 최소화, 키울 건 키우자」 — 종류(액티브/패시브)는 **글자 넷이면 되는 것**이라
        세로 알약 24px 로 눕히고, 그렇게 아낀 폭을 **설명 원문**이 가져간다(옛 2열 칸은 설명이 아예 없어
        탭하기 전엔 무슨 스킬인지 몰랐다). 알약은 장식이 아니라 **줄의 머리표**다.
     ⚠️ 줄 안의 스킬 칸은 액자(`.k-panel`)를 벗는다 — 줄 자체가 한 덩이라 판이 이중이 된다. */
  .ess-row{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2);min-width:0;}
  .ess-row.dim{opacity:.55;}
  .ess-pill{writing-mode:vertical-rl;text-orientation:mixed;font-size:var(--fs-note);width:24px;height:72px;
    background:var(--c-gold-well);border:1px solid var(--c-gold);border-radius:var(--rad-chip);color:var(--c-goldtxt);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700;letter-spacing:1px;}
  .ess-row .k-skill{flex:0 0 auto;width:72px;padding:0;background:none;border:0;box-shadow:none;}
  .ess-row .k-skill.dim{opacity:1;}   /* 흐리기는 줄(`.ess-row.dim`)이 한 번만 건다 — 겹쳐 걸면 아이콘이 안 보인다 */
  .ess-desc{flex:1 1 auto;min-width:0;}
  .ess-desc .ds{font-size:var(--fs-sub);color:var(--c-sub);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .ess-desc .cf{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:var(--sp-1);}
  /* 스탯·겹침 — 칩 한 줄씩(타일 2장 폐지). 「능력치 지능 +4 · 지혜 +2 / 성격 냉정한 +36 · 충직한 −41」 */
  .ess-stats,.ess-stack{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1);margin-top:var(--sp-2);}
  .ess-lbl{font-size:var(--fs-note);}
  /* 획득처 줄 — 맨 밑 한 줄(44). 탭하면 획득처 팝업(스테이지 · 드랍 확률). flavor 도 그 안이다 */
  .ess-src{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);margin-top:var(--sp-2);
    padding:0 var(--sp-2);border:1px solid var(--c-gold-dim);border-radius:var(--rad-card);background:var(--c-press);cursor:pointer;}
  .ess-src .lb{font-size:var(--fs-note);color:var(--c-sub);flex:0 0 auto;}
  .ess-src b{font-size:var(--fs-body);color:var(--c-goldtxt);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ess-src > :last-child{margin-left:auto;color:var(--c-sub);flex:0 0 auto;display:flex;}
  /* 획득처 팝업 본문 — 몹 한 줄 + 스테이지 줄들(번호 칩 · 장 이름 · 깼나 · 기본 확률 %) + 안내 + flavor */
  .ess-srcmob{display:flex;align-items:baseline;gap:var(--sp-1);margin-bottom:var(--sp-2);}
  .ess-srcrow{display:flex;align-items:center;gap:var(--sp-2);min-height:32px;border-top:1px solid var(--c-line);}
  .ess-srcrow.dim{opacity:.5;}
  .ess-srcrow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-sub);}
  .ess-srcrow .st{flex:0 0 auto;}
  .ess-srcrow .pc{flex:0 0 auto;color:var(--c-goldtxt);font-variant-numeric:tabular-nums;}
  .ess-srcnote{margin-top:var(--sp-2);} .ess-flavor{margin-top:var(--sp-2);}
  .ess-own{margin-top:var(--sp-2);display:flex;flex-direction:column;gap:2px;padding:var(--sp-1) var(--sp-2);}
  /* 캐릭 시트(바닥 시트)는 칸 옮기기·「빼려면」까지 한 화면에 들어야 한다 — 줄 사이를 4 로 조인다(캡처 실측: 8 이면 마지막 줄이 잘렸다) */
  .k-sheet2 .ess-row,.k-sheet2 .ess-stats,.k-sheet2 .ess-stack,.k-sheet2 .ess-src,.k-sheet2 .ess-own{margin-top:var(--sp-1);}
  .k-sheet2 .ess-desc .ds{-webkit-line-clamp:2;}   /* 시트는 밑에 칸 옮기기·「빼려면」이 더 선다 — 설명은 2줄까지 */
  .ess-kv{display:flex;align-items:center;gap:var(--sp-2);min-width:0;} .ess-kv b{white-space:nowrap;}
  .ess-kv .sub:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .k-body,.k2-body{padding:var(--sp-3) 14px;}
  /* 시트 본문만 위아래를 한 치수 줄인다(팝업은 그대로) — 위 max-height 와 같은 이유, 8px 을 더 준다 */
  .k2-body{padding-top:var(--sp-2);padding-bottom:var(--sp-2);}
  /* ★ 맨몸 팝업(kit.popup bare · 2026-09-07 B-1 Task 3) — 머리 없이 본문만. 부대 편성 배치판이 이걸로 뜬다.
     ✕ 는 상자 우상단에 떠 있고(44), 본문 칸은 `.box.tall` 의 height:100% 사슬을 그대로 잇는다(패딩 0). */
  .k-x-float{position:absolute;right:6px;top:6px;z-index:3;min-width:var(--tap);min-height:var(--tap);display:flex;align-items:center;justify-content:center;}
  .k-body.k-bare{flex:1 1 auto;min-height:0;padding:0;display:flex;flex-direction:column;}
  .k-actions,.k2-actions{border-top:1px solid var(--c-gold);margin:0 6px;padding:var(--sp-2) var(--sp-2) calc(var(--sp-3) + env(safe-area-inset-bottom));}
  .k-actions .btn,.k2-actions .btn{min-height:var(--tap);} .k-actions .btn.gold,.k2-actions .btn.gold{flex:1;}
  .tag{font-size:var(--fs-note);}
  .k-band{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--c-panel);border-top:1px solid var(--c-gold);z-index:44;display:flex;flex-direction:column;}
  #frame.tabs .k-band{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  .k-band-grip{height:12px;flex:0 0 12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .k-band-grip::after{content:"";width:36px;height:4px;border-radius:2px;background:var(--c-line);}
  .k-band-row{flex:1;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3) var(--sp-1);}
  .k-band-l{flex:1;min-width:0;font-size:var(--fs-sub);color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-band-r{flex:0 0 auto;}
  /* ⚠️ `position:relative;z-index` 가 있어야 한다 — 성 탭에서는 판(`#estatewrap`)이 **자리를
     안 먹는 absolute** 라, 자리를 잡은(static) 띠는 DOM 순서와 무관하게 판 **밑에** 깔린다
     (2026-09-03 실측: 캡처에 띠가 통째로 안 보였다). 다른 화면에서는 아무 일도 안 한다. */
  .k-fold{flex:0 0 auto;position:relative;z-index:6;background:linear-gradient(180deg,var(--c-press),var(--c-band));border-bottom:1px solid var(--c-gold);}
  .k-fold-line{height:var(--h-top);display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-3);font-size:var(--fs-sub);color:var(--c-goldtxt);cursor:pointer;min-height:var(--tap);}
  /* ★ 2026-09-08(계획 B Task 5) — 첫 줄이 **영지 수지**를 말할 때가 있다(스펙 A-9). 숫자 셋이
     들어가 좁은 폰에서 넘치므로 말줄임을 건다. 색은 기울기가 정한다(쌓이면 경고 · 빠지면 완료). */
  .k-fold-line{overflow:hidden;white-space:nowrap;}
  .k-fold-line>span:first-child{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .k-fold-line.warn{color:var(--c-warn);}
  .k-fold-line.ok{color:var(--c-ok);}
  .k-fold-arrow{transition:transform .16s ease;color:var(--c-sub);}
  .k-fold.open .k-fold-arrow{transform:rotate(180deg);}
  .k-fold-cards{display:flex;flex-direction:column;gap:var(--sp-2);padding:0 var(--sp-3);max-height:0;overflow:hidden;transition:max-height .16s ease;}
  .k-fold.open .k-fold-cards{max-height:260px;padding-bottom:var(--sp-3);}
  .k-fold-card{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad-card);padding:var(--sp-2) var(--sp-3);min-height:64px;}
  .k-fold-card b{font-size:var(--fs-body);color:var(--c-text);}
  .k-sh-t{display:flex;align-items:center;gap:8px;font-size:var(--fs-body);font-weight:700;margin-bottom:6px;}
  .k-sh-t b{flex:1;}
  .k-sh-b{font-size:var(--fs-sub);color:var(--c-sub);line-height:1.6;}
  .k-sh-a{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
  .k-page{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:8px;font-size:var(--fs-sub);color:var(--c-sub);}
  /* ★ 2026-09-08(책장 넘김 결재) — 쪽 단추가 **행동띠 왼쪽 어깨**에 설 때. 제 줄을 안 먹으니
     위 여백이 없고, 왼쪽으로 밀어 행동 단추와 갈라 세운다. 단추 크기는 그대로다(작게 안 만든다). */
  .k-actions>.k-page,.k2-actions>.k-page{margin-right:auto;padding-top:0;}
  .k-grid{display:grid;gap:8px;}
  .k-cell{min-width:0;}
  .k-lock{opacity:.45;filter:grayscale(1);}

  /* ★★ 시트 본문 부품 — 역할 세그먼트 · 줄 · 정수 카드 (2026-09-03 · 계획 4b Task 4)
     ⚠️ 세그먼트는 **조각마다** `.k-seg` 다(묶음이 `.k-segs`) — kit.segment 머리말 참조.
        모양은 시트 탭(`.k2-tab`)과 같은 결로 맞춘다: 고른 칸만 금테, 나머지도 자리를 지킨다. */
  .k-segs{display:flex;gap:var(--sp-1);height:var(--h-seg);flex:0 0 var(--h-seg);margin-bottom:var(--sp-2);}
  .k-seg{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:3px;
    border-radius:var(--rad-btn);background:var(--c-press);border:1px solid var(--c-line);
    color:var(--c-sub);font-size:var(--fs-sub);cursor:pointer;user-select:none;}
  .k-seg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-seg.on{background:var(--c-gold-well);color:var(--c-goldtxt);border-color:var(--c-gold);}
  .k-seg:active{filter:brightness(1.25);}
  /* ★★ 슬롯 줄 6 — 대장간·장비 도감 공용 (2026-09-04 · 4c-6 ruling 9). 칸마다 `.k-slot`(묶음 `.k-slotrow`) */
  .k-slotrow{display:flex;gap:var(--sp-1);height:var(--tap);flex:0 0 var(--tap);margin-bottom:var(--sp-2);}
  .k-slot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border-radius:var(--rad-btn);background:var(--c-press);border:1px solid var(--c-line);
    color:var(--c-sub);cursor:pointer;user-select:none;}
  .k-slot .nm{font-size:var(--fs-note);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-slot.on{background:var(--c-gold-well);color:var(--c-goldtxt);border-color:var(--c-gold);}
  .k-slot:active{filter:brightness(1.25);}
  /* 격자 안의 묶음 머리 — 한 줄을 다 쓴다(kit.grid `{ head }` · 4c-6) */
  .k-cell.wide{grid-column:1/-1;}

  /* ★★ 도감 화면 — 정수·장비 (2026-09-04 · 4c-6 · 목업 C3). 세로 스크롤 없음 — 격자가 쪽을 넘긴다 */
  .cx{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--sp-2) var(--sp-3) 0;}
  .cx-head{flex:0 0 auto;margin-bottom:var(--sp-1);}
  .cx-head b{display:block;font-size:var(--fs-title);font-weight:800;color:var(--c-goldtxt);}
  .cx-head .sub{display:block;font-size:var(--fs-sub);color:var(--c-sub);margin-bottom:var(--sp-2);}
  .cx-body{flex:1;min-height:0;overflow:hidden;}
  .cx-credit{flex:0 0 auto;font-size:var(--fs-note);color:var(--c-sub);text-align:right;padding:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}   /* 스킬 그림 출처(CC BY) — 도감 맨 아래 한 줄 */
  .cx-card{position:relative;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border-radius:var(--rad-card);border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);
    cursor:pointer;overflow:hidden;padding:0 var(--sp-1);}
  .cx-card:active{filter:brightness(1.25);}
  .cx-card .nm{font-size:var(--fs-sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cx-card .ln{font-size:var(--fs-note);color:var(--c-sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cx-card .st{font-size:var(--fs-note);color:var(--c-goldtxt);}
  .cx-card.dim{opacity:.5;}
  /* 4c-6 수정 웨이브 E②(2026-09-05) — cursor:default 를 뺐다. 「?」 카드도 누르면 토스트로 답한다(T1b M2). */
  .cx-card.unk{background:var(--c-band);border-style:dashed;color:var(--c-sub);}
  /* 정수 카드의 종 얼굴 — 실루엣 칸과 같은 지름 40 (4c-6 T1b · M1) */
  .cx-card img{width:40px;height:40px;flex:0 0 auto;border-radius:50%;object-fit:cover;background:var(--c-press);}
  .cx-card .sil{width:40px;height:40px;border-radius:50%;background:var(--c-press);display:flex;align-items:center;
    justify-content:center;font-size:var(--fs-num);font-weight:700;color:var(--c-sub);}
  .cx-card .new{position:absolute;top:2px;right:2px;height:16px;padding:0 5px;border-radius:var(--rad-chip);
    background:var(--c-ok);color:var(--c-text);font-size:var(--fs-note);font-weight:700;display:flex;align-items:center;}
  /* ★★ 명예의 전당 화면 (2026-09-05 · 4c-6 T2 · 목업 D3). 장치 0 — 내 최고 카드 고정 + 직업별 1등 줄(쪽 8). 세로 스크롤 없음 */
  .hl{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--sp-2) var(--sp-3) 0;}
  .hl-head{flex:0 0 auto;margin-bottom:var(--sp-2);}
  .hl-head b{display:block;font-size:var(--fs-title);font-weight:800;color:var(--c-goldtxt);}
  .hl-head .sub{display:block;font-size:var(--fs-sub);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
  .hl-body .k-grid{gap:6px;}
  /* 초상 40 — 세로로 긴 초상화 캔버스를 둥근 40 칸에 맞춰 자른다(얼굴은 위쪽이다) */
  .hl .fc,.hl-srow .fc{flex:0 0 40px;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--c-press);
    display:flex;align-items:flex-start;justify-content:center;color:var(--c-sub);}
  .hl .fc canvas,.hl-srow .fc canvas{display:block;}
  .hl .fc svg,.hl-srow .fc svg{margin-top:0;}
  /* 내 최고 카드 — 금테. 오른쪽은 순위 숫자 대신 「내가 잡은 칸 m/n」 */
  .hl-mine{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);margin-bottom:var(--sp-2);
    border-radius:var(--rad-card);border:1px solid var(--c-gold);background:var(--c-press);color:var(--c-text);cursor:pointer;}
  .hl-mine:active{filter:brightness(1.25);}
  .hl-mine.none{border-color:var(--c-line);border-style:dashed;cursor:default;}
  .hl-mine .fc{border:2px solid var(--c-gold);width:44px;height:44px;flex-basis:44px;}
  .hl-mine.none .fc{border-color:var(--c-line);align-items:center;}
  .hl-mine .mid{flex:1 1 0;min-width:0;}
  .hl-mine .nm{display:block;font-size:var(--fs-body);font-weight:800;color:var(--c-goldtxt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-mine .ds{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-mine .rt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
  .hl-mine .rt .tag{font-size:var(--fs-note);color:var(--c-sub);}
  .hl-mine .rt b{font-size:var(--fs-num);font-weight:800;color:var(--c-goldtxt);}
  /* 직업별 1등 한 줄 — 초상 · 직업 · 이름(굵게) · 영주 『』 Lv · 전투력. 내가 1등이면 금테 */
  .hl-row{display:flex;align-items:center;gap:var(--sp-2);height:48px;padding:0 var(--sp-2);
    border-radius:var(--rad-card);border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);cursor:pointer;}
  .hl-row:active{filter:brightness(1.25);}
  .hl-row.mine{border-color:var(--c-gold);background:var(--c-press);}
  .hl-row.mine .fc{box-shadow:0 0 0 2px var(--c-gold);}
  /* 직업 칸 — 가장 긴 이름이 네 글자(수호기사·원소술사·드루이드)라 52 (실측: 44 면 「수호…」로 잘렸다) */
  .hl-row .cls{flex:0 0 52px;font-size:var(--fs-sub);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-row .mid{flex:1 1 0;min-width:0;}
  .hl-row .nm{display:block;font-size:var(--fs-body);font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-row.mine .nm{color:var(--c-goldtxt);}
  .hl-row .ds{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-row .pw{flex:0 0 auto;font-size:var(--fs-num);font-weight:800;color:var(--c-goldtxt);}
  /* 순위 시트의 줄 — `.k-srow` 위에 초상 칸과 1등 표시만 더한다 */
  .hl-srow.top{border-color:var(--c-gold);}
  .hl-srow .nm .sub{font-size:var(--fs-note);color:var(--c-sub);}
  /* ⚠️ 시트 본문의 줄은 `.k-srow` 다 — `.k-row`(kit.charRow) 를 안 쓴다. 그쪽은 `.item` 과
     함께 달려 모양을 이미 얻고 있어서, 같은 이름에 규칙을 새로 주면 시설 시트의 사람 줄까지
     이번 계획이 모르는 사이에 바뀐다. 새 이름으로 갈라 둔다. */
  /* ⚠️ `position:relative` — 전설 확정 ★(`legendMark`, `.lgmark`)가 절대배치라 기준칸이 없으면
     시트 밖으로 튄다(scr.gear.js: 「부모는 position:relative 여야 한다」). */
  .k-srow{position:relative;display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);
    padding:var(--sp-1) var(--sp-2);border-radius:var(--rad-card);
    border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);
    font-size:var(--fs-sub);cursor:pointer;}
  .k-srow:active{filter:brightness(1.25);}
  .k-srow.dim{opacity:.45;cursor:default;}
  .k-srow .mid{flex:1 1 0;min-width:0;}
  .k-srow .nm{font-size:var(--fs-body);color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-srow .ds{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-srow .mats{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:2px;}
  .k-srow .rt{flex:0 0 auto;font-size:var(--fs-sub);font-weight:700;color:var(--c-goldtxt);}
  .k-srow .rt.take{color:var(--c-warn);}
  /* 정수 카드 3열 — 계열 그림 · 이름 · 계열 이름 · ★ · 「×n」/「만들기」 배지 */
  .k-ecard{position:relative;height:70px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;border-radius:var(--rad-card);border:1px solid var(--c-line);
    background:var(--c-panel);color:var(--c-text);cursor:pointer;overflow:hidden;padding:0 var(--sp-1);}
  .k-ecard:active{filter:brightness(1.25);}
  .k-ecard .nm{font-size:var(--fs-note);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ★ 2026-09-08 — 옛 `.ln`(계열 줄 14px)은 **모서리 글자**가 됐다. 카드 84 → 70 이 되어
     한 쪽에 두 줄이 들고, 60종이 11쪽 → 6쪽이 된다(실측). 왼쪽 위 — 오른쪽 위는 `×n` 배지 자리다. */
  .k-ecard .ln2{position:absolute;left:3px;top:1px;font-size:var(--fs-note);font-weight:800;color:var(--c-goldtxt);}
  .k-ecard .st{font-size:var(--fs-note);color:var(--c-goldtxt);}
  .k-ecard .bd{position:absolute;top:2px;right:2px;height:16px;padding:0 5px;border-radius:var(--rad-chip);
    background:var(--c-press);border:1px solid var(--c-line);color:var(--c-text);
    font-size:var(--fs-note);display:flex;align-items:center;}
  .k-ecard .bd.make{background:var(--c-gold);border-color:var(--c-gold);color:var(--c-bg);font-weight:700;}
  /* 전설(유니크) 정수 — **금테 한 겹**이 「이건 다른 것」을 말한다(A-18-5 결재).
     그림은 재료 정수 것을 물려받으므로(`essArtNo`) 테두리 말고는 몹 정수와 같은 부품을 쓴다.
     ⚠️ 잠긴 카드·줄(`.lock`)은 **눌리지 않는다** — 못 끼우는 칸에서 「할 수 있는 것처럼」 보이면 안 된다. */
  .k-ecard .fc{width:34px;height:34px;border-radius:var(--rad-chip);overflow:hidden;background:var(--c-press);}
  .k-ecard .fc img,.k-ecard .fc canvas{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .k-ecard.uniq,.cd-cell.uniq{border-color:var(--c-gold);}
  .k-essface.uniq,.ess-pic.uniq,.icell.uniq{box-shadow:0 0 0 2px var(--c-gold) inset;}
  /* 잠긴 전설 줄 — **지우지 않고 흐린다**(잠긴 연구 칸과 같은 규율). 아직 못 가진 목표가 보여야 그걸 향해 간다 */
  .k-facrow.lock{opacity:.6;}
  /* 오염 타일이 곧 청소 단추다(2026-09-08) — 누를 수 있다는 것은 **꼬리말**이 말하고, 여기선 손가락 신호만 준다 */
  .k-tile.tap{cursor:pointer;}
  .k-tile.tap:active{filter:brightness(1.25);}
  .k-ecard.lock,.k-srow.lock{opacity:.55;cursor:default;}
  .k-ecard.lock:active,.k-srow.lock:active{filter:none;}
  /* 시트 제목 밑 부제 한 줄 — 「지금 낀 것」·「1번 · 액티브 칸 · 한번 끼면 못 뺀다」.
     ⚠️ **한 줄이다.** 두 줄이 되면 머리(72)가 넘쳐 탭 줄을 밀어낸다 — 넘치면 …로 자른다. */
  .k-shead{font-size:var(--fs-note);color:var(--c-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ⚠️ `.k2-title b` 규칙이 **여기 안의 b 까지** 잡는다(자손 선택자) — 제목 크기·block 을
     그대로 물려받아 부제가 20px 짜리 둘째 줄이 됐다(첫 캡처). 여기서 되돌린다. */
  .k-shead b{display:inline;font-size:var(--fs-note);color:var(--c-goldtxt);font-weight:700;}

  /* ★★ 사람 탭 부품 — groupHead·charCard·groupGrid (2026-09-03 · 사람 탭 계획 4a task-1) */
  .k-groups{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;   /* scroll-ok: 사람 탭의 유일한 세로 스크롤 */
    padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2);}
  /* ★ 4c-5(2026-09-04) — 시트 본문의 **설명 한 줄**(아이콘 + 글). 확인창(`confirmSheet`)·행동 문 넷이 쓴다.
     누르는 줄(.k-srow)이 아니다 — 검사(SHEET_SEL)에 안 걸리게 이름을 따로 둔다. 색은 tone 넷만. */
  .k-line{display:flex;align-items:flex-start;gap:var(--sp-1);padding:3px 0;font-size:var(--fs-sub);line-height:1.45;color:var(--c-text);word-break:keep-all;}
  .k-line > .ic{flex:0 0 auto;margin-top:2px;}
  .k-line > span:last-child{min-width:0;}
  .k-line.ok{color:var(--c-ok);}
  .k-line.warn{color:var(--c-warn);}
  .k-line.sub{color:var(--c-sub);font-size:var(--fs-note);}
  .k-ghead{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:var(--sp-2);}
  .k-ghead.dim{opacity:.45;}
  .k-ghead .title{font-size:var(--fs-body);font-weight:700;color:var(--c-goldtxt);}
  .k-ghead .count{font-size:var(--fs-sub);color:var(--c-sub);}
  /* 묶음 머리의 곁말 — 「왜 여기 없나」 한 마디 (4c-6 T1b · M4). 길면 잘린다(줄은 하나다) */
  .k-ghead .note{min-width:0;font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-ghead::after{content:"";flex:1;height:1px;background:var(--c-line);}
  .k-cards{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:var(--sp-2);}
  .k-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad-card);
    padding:var(--sp-2) var(--sp-1) 6px;touch-action:pan-y;cursor:pointer;}
  .k-card.dim{opacity:.45;}
  /* ⚠️ 수정 라운드 1(리뷰 지적 2) — where 칩(우하단, 높이 24)이 절대배치라 sub/별줄과 겹쳤다.
     where 가 있는 카드는 바닥에 칩 자리를 미리 비워 둔다(내용은 흐름대로, 칩만 그 여백에 앉는다). */
  .k-card.has-where{padding-bottom:30px;}
  /* ★ 2026-09-05 디렉터 「카드 초상 확대」 — 48 → 80(3열 카드 폭 ≈117 에 여백 18). 조 띠(72)보다 조금 크다 */
  .k-card .k-cd-face{width:80px;height:80px;border-radius:var(--rad-card);overflow:hidden;background:var(--c-press);
    box-shadow:inset 0 1px 0 var(--rim);}
  .k-card .k-cd-name{font-size:var(--fs-body);color:var(--c-text);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ⚠️ `word-break:keep-all` — 한글은 기본값이 **음절마다** 끊긴다. 훈련장 픽커의 둘째 줄
     (「법사 Lv.1 · 효율 ×0.83」)이 3열 폭에서 「효 / 율 ×0.83」으로 갈라졌다(실측 캡처).
     낱말 사이(빈칸)에서만 끊게 한다 — 「효율」과 숫자는 U+00A0 으로 묶여 있어 같이 내려간다. */
  .k-card .k-cd-sub{font-size:var(--fs-sub);color:var(--c-sub);word-break:keep-all;text-align:center;}
  /* 별은 `dom.js stars()` 가 그린다(그 규칙은 `.star`) — 카드는 **크기만** 정한다(그림이 1em 이다). */
  .k-card .k-cd-stars{display:flex;gap:1px;font-size:12px;}
  /* ⚠️ 최종 리뷰 M1(2026-09-03) — 글자색은 **토큰만** 쓴다(계획 Task 1 Step 3). 이번 가지가
     새로 들인 `#fff` 리터럴 하나를 `--c-text` 로 돌린다. 경고 배경 위 밝은 잉크라 읽힌다.
     ⚠️ 파일 안의 다른 `#fff` 넷(120·260·343·601)은 이번 가지가 만든 것이 아니라 그대로 둔다. */
  .k-card .bd-tr,.k-card .bd-tl{position:absolute;top:2px;width:18px;height:18px;border-radius:var(--rad-chip);
    background:var(--c-warn);color:var(--c-text);font-size:var(--fs-note);font-weight:700;display:flex;align-items:center;justify-content:center;}
  .k-card .bd-tr{right:2px;}
  /* 🔴 2026-09-07 QA6 ⑩ — 배지 둘째 자리(왼쪽 위). 「부상」과 「전직 가능」이 겹치면 예전엔
     하나만 떴다(카드 배지 한 개 규칙). 사유가 성질이 다르면 **자리도 색도** 갈라야 읽힌다. */
  .k-card .bd-tl{left:2px;}
  /* 배지 색 = 사유의 성질. 좋은 소식(영감·포인트)은 금색, 나쁜 소식(부상)은 붉은색,
     주의(지침·불만·방없음)는 기본 경고색. 같은 빨간 원 하나로 셋을 다 말하지 않는다. */
  .k-card .bd-good{background:var(--c-gold);color:var(--c-bg);}
  .k-card .bd-bad{background:var(--c-warn);color:var(--c-text);}
  .k-card .bd-note{background:var(--c-press);border:1px solid var(--c-gold);color:var(--c-goldtxt);}
  .k-card .bd-br{position:absolute;bottom:2px;right:2px;height:24px;max-width:70%;padding:0 6px;
    border-radius:var(--rad-chip);background:var(--c-press);border:1px solid var(--c-line);color:var(--c-text);
    font-size:var(--fs-note);display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ★★ 사람 탭 — 조 패널 · 칸 · 드래그 유령 (2026-09-03 · 사람 탭 계획 4a task-3)
     ⚠️ 세로 스크롤은 위 `.k-groups` 하나뿐이다 — `.k-people` 은 자리만 나눈다(스크롤 없음). */
  .k-people{flex:1;min-height:0;display:flex;flex-direction:column;}
  .k-squad{flex:0 0 auto;background:var(--c-band);border-bottom:1px solid var(--c-line);
    padding:var(--sp-2) var(--sp-3);}
  /* 머리줄은 **네 칸 고정**이다 — [‹][이름·상태][›][행동]. flex 로 두면 행동 단추의 유무·너비에
     따라 ‹ › 가 좌우로 튀어, 연달아 누르는 자리에서 손가락이 헛나간다(수정 라운드 2 · I6). */
  .k-squad .hd{display:grid;grid-template-columns:var(--tap) minmax(0,1fr) var(--tap) 56px;
    align-items:center;gap:var(--sp-2);}
  .k-squad .hd>.btn{width:100%;padding-left:0;padding-right:0;}
  .k-squad .mid{flex:1 1 0;min-width:0;text-align:center;}
  .k-squad .mid b{display:block;font-size:var(--fs-body);font-weight:700;color:var(--c-goldtxt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-squad .mid span{display:block;font-size:var(--fs-sub);color:var(--c-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-arrow{flex:0 0 auto;width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;
    border-radius:var(--rad-btn);border:1px solid var(--c-line);background:var(--c-panel);
    color:var(--c-goldtxt);font-size:var(--fs-title);cursor:pointer;user-select:none;}
  .k-arrow:active{filter:brightness(1.25);}
  .btn.sm{padding:6px 10px;font-size:var(--fs-sub);}
  .k-slots{display:flex;gap:var(--sp-2);margin-top:var(--sp-2);}
  .k-slot{flex:0 1 48px;height:48px;min-width:0;border-radius:var(--rad-card);
    border:1px dashed var(--c-line);background:var(--c-press);color:var(--c-sub);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    cursor:pointer;touch-action:none;}
  .k-slot.on{border-style:solid;}
  /* 카드를 집으면 넣을 수 있는 칸이 스스로 밝아진다 — 「어디에 놓나」를 글로 설명하지 않는다 */
  .k-slot.hot{border-style:solid;border-color:var(--c-gold);}
  .k-slot.over{border-color:var(--c-gold);background:var(--c-line);}
  .k-card.picked{border-color:var(--c-gold);box-shadow:inset 0 0 0 1px var(--c-gold);}
  .k-drag-ghost{position:fixed;z-index:90;width:48px;height:48px;pointer-events:none;
    border-radius:var(--rad-card);overflow:hidden;border:1px solid var(--c-gold);
    background:var(--c-panel);opacity:.85;transform:translate(-50%,-50%);}

  /* ★★ 캐릭 상세 — **판을 통째로 쓰는 화면** (2026-09-03 · 계획 4b Task 3 · 목업 D1)
     위에서 머리 → 무대(3D 전신 + 좌우 장비 6칸) → 칸 5 → 능력치 2×5 → 상태 한 줄 → 주 단추.
     ⚠️ **세로 스크롤이 없다.** 남는 높이는 전부 무대(.cd-stage-wrap)가 먹는다 — 사람이 커야
        「살아 있다」가 읽힌다(목표 240px 이상, 390×844 에서 실측 290px 안팎).
     ⚠️ 장비 칸은 무대 **위에 얹는다**(자리를 빼앗지 않는다). 캔버스가 좁아지면 직교 카메라의
        가로 시야가 같이 좁아져 긴 무기가 판 밖으로 잘린다(charstage Task 1 보고 ③). */
  .cd{flex:1;min-height:0;display:flex;flex-direction:column;}
  /* ★ 4c-4(2026-09-04) — 머리 **위** 「닫기」 한 줄(28px). 시설·전당·숙소에서 온 사람이 직전 화면으로
     돌아가는 문 — 머리의 ‹ ›(옆 사람)가 「뒤로」로 오독됐다(QA). paint() 가 안 갈아 끼우는 고정 줄. */
  .cd-top{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;height:28px;padding:0 var(--sp-2);}
  .cd-close{display:flex;align-items:center;gap:4px;height:24px;padding:0 var(--sp-2);border-radius:12px;
    color:var(--c-sub);font-size:var(--fs-sub);background:var(--c-press);cursor:pointer;user-select:none;}
  .cd-close:active{filter:brightness(1.25);}
  .cd-headwrap{flex:0 0 auto;padding:var(--sp-1) var(--sp-2) 0;}
  .cd-head{display:grid;grid-template-columns:var(--tap) minmax(0,1fr) var(--tap);
    align-items:center;gap:var(--sp-1);}
  .cd-head .mid{min-width:0;text-align:center;}
  .cd-head .mid b{display:block;font-size:var(--fs-title);font-weight:800;color:var(--c-goldtxt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-head .mid .sub{display:block;font-size:var(--fs-sub);color:var(--c-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-arrow{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;
    border-radius:var(--rad-btn);border:1px solid var(--c-line);background:var(--c-panel);
    color:var(--c-goldtxt);font-size:var(--fs-title);cursor:pointer;user-select:none;}
  .cd-arrow:active{filter:brightness(1.25);}

  /* 무대 — 남는 높이를 다 먹는다 */
  .cd-stage-wrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
    margin:var(--sp-1) var(--sp-2);border-radius:var(--rad-card);border:1px solid var(--c-line);
    background:radial-gradient(ellipse 74% 60% at 50% 62%,var(--c-press) 0%,var(--c-band) 58%,var(--c-bg) 100%);}
  /* 🔴 발밑 단상 — 결재 구도(pitch 0.07)에선 검은 접지 그림자가 검은 판 위에 얹혀 안 읽힌다
     (charstage Task 1 보고 ①). 밝은 타원을 **캔버스 뒤**에 깔아 사람이 바닥에 선 것으로 읽히게 한다.
     자리는 계산값이다 — 발(y=0)은 무대 프레임의 위에서 95.1% 지점이다. */
  .cd-plinth{position:absolute;left:50%;top:95%;width:58%;height:13%;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse at center,var(--c-line) 0%,var(--c-line) 24%,var(--c-press) 50%,transparent 74%);}
  .cd-hint{position:absolute;left:var(--sp-2);bottom:var(--sp-1);font-size:var(--fs-note);
    color:var(--c-sub);pointer-events:none;opacity:.75;}
  .cd-gear{position:absolute;top:var(--sp-2);display:flex;flex-direction:column;gap:var(--sp-2);}
  .cd-gear.l{left:var(--sp-2);} .cd-gear.r{right:var(--sp-2);}
  /* ★ 2026-09-05 디렉터 「초상·아이콘·아이템칸은 크게」 — 56 → 72, 아이콘 24 → 36, +n 은 숫자 단(17). */
  .cd-slot{position:relative;width:72px;height:72px;border-radius:var(--rad-card);
    border:1px dashed var(--c-line);background:var(--c-panel);color:var(--c-sub);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    cursor:pointer;user-select:none;box-shadow:inset 0 1px 0 var(--rim),0 2px 6px var(--shade);}
  .cd-slot.on{border-style:solid;border-color:var(--c-gold);color:var(--c-text);background:var(--c-press);}
  .cd-slot:active{filter:brightness(1.25);}
  .cd-slot .nm{font-size:var(--fs-note);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* +n 은 **오른쪽 위** — 우하단에 두면 슬롯 이름 끝 글자(무「기」·반「지」)를 덮는다(QA). 오른쪽 위의
     「!」(cd-bang)은 빈 칸에만 뜨고 +n 은 찬 칸에만 뜨니 자리가 안 겹친다. */
  .cd-slot .cd-plus{position:absolute;right:4px;top:3px;font-size:var(--fs-num);font-weight:700;
    color:var(--c-goldtxt);text-shadow:0 0 3px #000,0 0 6px #000;line-height:1;}
  .cd-bang{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:var(--rad-chip);
    background:var(--c-warn);color:var(--c-text);font-size:var(--fs-note);font-weight:700;
    display:flex;align-items:center;justify-content:center;}

  /* 칸 5 — 정수 3 + 스킬 2 */
  .cd-cellwrap{flex:0 0 auto;margin:0 var(--sp-2);
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-1);}
  .cd-cell{height:64px;border-radius:var(--rad-card);border:1px solid var(--c-line);
    background:var(--c-panel);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;cursor:pointer;overflow:hidden;color:var(--c-text);}
  .cd-cell.empty{border-style:dashed;color:var(--c-sub);background:transparent;}
  /* 「직업 기술」 칸 — **보여 주기만 하는 칸**이다(전투에 안 나간다). 눌러 보기 전에
     「이건 지금 나가는 게 아니다」가 읽혀야 한다(수정 라운드 1 · m-2). */
  .cd-cell.dim{opacity:.5;}
  .cd-cell:active{filter:brightness(1.25);}
  .cd-cell .fc{width:26px;height:26px;border-radius:var(--rad-chip);overflow:hidden;background:var(--c-press);}
  .cd-cell .fc img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .cd-cell .nm{font-size:var(--fs-note);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-cell .st{font-size:var(--fs-note);color:var(--c-goldtxt);}
  .cd-cell .st.sub{color:var(--c-sub);}

  /* 능력치 2×5 — 가운데가 LV 원 */
  .cd-statwrap{flex:0 0 auto;padding:var(--sp-1) var(--sp-2) 0;}
  .cd-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-1);align-items:center;}
  .cd-stat{position:relative;height:48px;border-radius:var(--rad-card);border:1px solid var(--c-line);
    background:var(--c-panel);display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;overflow:hidden;}
  .cd-stat.flat{cursor:default;}
  .cd-stat.wide{grid-column:span 2;}
  .cd-stat.main{border-color:var(--c-gold);}
  .cd-stat.hot{border-color:var(--c-ok);}
  .cd-stat .k{font-size:var(--fs-note);color:var(--c-sub);}
  .cd-stat .v{font-size:var(--fs-num);font-weight:800;color:var(--c-text);font-variant-numeric:tabular-nums;}
  .cd-stat.main .v{color:var(--c-goldtxt);}
  .cd-stat .pl{margin-left:var(--sp-1);color:var(--c-ok);font-size:var(--fs-body);font-weight:800;}
  .cd-lv{width:56px;height:56px;margin:0 auto;border-radius:50%;border:2px solid var(--c-gold);
    background:var(--c-press);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .cd-lv span{font-size:var(--fs-note);color:var(--c-sub);line-height:1;}
  .cd-lv b{font-size:var(--fs-num);font-weight:800;color:var(--c-goldtxt);line-height:1.1;}

  /* 상태 한 줄 · 주 단추 */
  .cd-linewrap{flex:0 0 auto;padding:var(--sp-1) var(--sp-2) 0;}
  .cd-line{text-align:center;font-size:var(--fs-sub);color:var(--c-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-footwrap{flex:0 0 auto;padding:var(--sp-1) var(--sp-2) var(--sp-2);}
  .cd-foot{display:flex;align-items:center;gap:var(--sp-2);}
  .cd-btn{flex:0 0 auto;height:var(--tap);padding:0 var(--sp-3);border-radius:var(--rad-btn);
    border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);
    font-size:var(--fs-sub);font-weight:700;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;}
  .cd-btn:active{filter:brightness(1.25);}
  .cd-main{flex:1 1 0;min-width:0;height:var(--tap);font-size:var(--fs-body);}
  /* 🔴 수정 라운드 1(m-4) — **짧은 판에서 사람이 너무 작아진다.** 390×640 실측 158.6px.
     ⚠️ `.cd-stage` 에 `min-height` 를 거는 길은 **안 썼다.** 무대 상자는 `overflow:hidden` 이라
        캔버스만 키우면 남는 만큼 **발밑이 잘리고**(위에서부터 놓인다), 발 자리에 맞춰 놓은
        단상(`.cd-plinth`, 상자의 95%)이 사람과 어긋난다 — 작아지는 것보다 나쁘다.
     → 대신 **고정 줄들을 줄여 무대에 자리를 돌려준다.** 짧은 판에서만 돈다. */
  @media (max-height: 720px){
    .cd-stage-wrap{margin:0 var(--sp-2);}
    .cd-head{grid-template-columns:36px minmax(0,1fr) 36px;}
    .cd-arrow{width:36px;height:36px;}
    .cd-headwrap{padding-top:0;}
    /* ⚠️ 칸은 **세 줄**이다(아이콘 20 + 이름 + ★/갈래). 46px 로 조였더니 셋째 줄이 잘렸다
       (실측 캡처가 잡았다) — 줄 간격만 조이고 높이는 세 줄이 들어가는 56 으로 둔다. */
    .cd-cell{height:56px;gap:0;line-height:1;}
    .cd-cell .fc{width:20px;height:20px;}
    .cd-stat{height:34px;}
    .cd-lv{width:44px;height:44px;}
    .cd-linewrap{padding-top:0;}
    .cd-btn,.cd-main{height:38px;}
    .cd-footwrap{padding:2px var(--sp-2) var(--sp-1);}
  }

  /* ── 분류 메뉴 두 단 — 1차(카테고리) · 2차(값) · 3차(정렬) */
  .mbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px;}
  .mbar>.lb{font-size:10px;color:var(--dim);flex:0 0 auto;letter-spacing:.5px;} /* fs-ok */
  /* 한 줄에 편 필터의 칸막이 — 「분류 … │ 값 … │ 정렬 …」 */
  .mbar>.sep{flex:0 0 auto;width:1px;height:15px;background:var(--line);margin:0 3px;}
  .mtab{font-size:12px;font-weight:700;padding:4px 11px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#00000030;color:var(--dim);user-select:none;white-space:nowrap;}
  .mtab.on{background:linear-gradient(var(--gold-hi),var(--gold-lo));border-color:var(--gold-bd);color:var(--gold-ink);}
  .mtab.blue.on{background:linear-gradient(#6a9be8,#3a63ad);border-color:#294a86;color:#f2f7ff;} /* color-ok */
  .mtab.dim{opacity:.38;}
  .mtab .n{font-size:10px;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums;} /* fs-ok */
  .mtab .ar{font-size:9px;margin-left:3px;} /* fs-ok */

  /* ── 컴팩트 목록 한 줄 — 얼굴 / 이름·부제 / 스탯 4칸 / 오른쪽 값 */
  .crow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:4px 8px;cursor:pointer;min-height:0;}
  .crow:active{filter:brightness(1.2);}
  .crow.sel{border-color:var(--gold);background:#241d10;} /* color-ok */
  .crow.off{opacity:.42;}

  /* ★ 초상화 액자 (2026-08-30) — 얼굴이 들어오니 「사진」처럼 보여야 한다.
     금테 한 겹 + 위아래 옅은 명암으로 액자에 끼운 느낌을 낸다. */
  /* 🔴 액자 치수는 **테두리를 더한 값**이다. `*{box-sizing:border-box}` 라서
     width 에 테두리 2px 이 포함된다 — 88px 로 두면 속이 84px 이 되어 92px 캔버스의
     오른쪽·아래가 `overflow:hidden` 에 **4px 씩 잘리고 인물이 한쪽으로 밀린다**
     (mph-qa 가 줄마다 좌21/우17 로 재서 잡았다). 속 92×92 + 테두리 2 = 96×96.
     ⚠️ 2026-08-30 얼굴을 LPC 파츠에서 **우리 종족 아트**로 갈면서 액자가 정사각이 됐다
     (`raceface.gen.js` FACE_BOX 92×92). 속 높이를 88 로 두면 턱이 잘린다.
     ⚠️ 여기 「96 을 넘기면 경험치 막대가 사라진다」고 적혀 있었는데 **그 안전선은 틀렸다.**
        2026-08-30 mph-qa 실측 — 폰(844×390)에서는 **액자가 92 일 때도 이미** 경험치 막대·
        기타 열 아래쪽·시너지 줄이 모달 밖으로 잘려 있었다. 액자 탓이 아니라 **모달이
        폰 세로에 안 맞는 것**이다(별도 항목 · `_기획/00_미반영.md`). 그러니 96 은
        「넘으면 큰일나는 선」이 아니라 **지금 이 액자가 그 값이라는 사실**일 뿐이다.
        바꿀 땐 `tools/bake-raceface.mjs` 의 `BOX` 도 같이 바꿔라(속 = 이 값 − 테두리 4). */

  /* ============================================================
     ★★ 2026-08-30 A+B 개편 — 잘림·스크롤 박멸 부품
     ============================================================ */
  /* ① 폰(가로 390 높이)에서 모달 예산을 넓힌다 — 80% 상자가 전직·캐릭터창을 잘랐다(실측) */
  @media (max-height:480px){

  }
  /* ② 키 큰 팝업 — 부대편성처럼 **판이 남은 높이를 받아야 하는** 팝업. asPopup 이 붙인다.
     높이가 정해져야 안쪽 height:100% 사슬이 살아서 캔버스가 스스로 줄어든다(안 주면 원본
     크기로 넘쳐 스크롤+잘림 — 파티 벤치가 실제로 잘렸다). */
  #modal .box.tall{height:calc(100% - 10px);}
  /* ③ 촘촘한 필터 줄 — 도감처럼 칩이 16개면 보통 크기로는 두 줄이 된다(모달 절반을 먹었다) */
  .mbar.tight{gap:4px;flex-wrap:nowrap;overflow:hidden;}
  .mbar.tight .mtab{font-size:11px;padding:3px 8px;}
  .mbar.tight .lb{font-size:9px;} /* fs-ok */
  /* ④ 커스텀 아이콘(svg) — OS 이모지를 대신한다. 글자 흐름 안에 앉는다 */
  .ic{display:inline-block;vertical-align:-2px;flex:0 0 auto;}
  /* ⑤ 2열 격자 목록 — 세로 한 줄 목록(육성 8명 중 2.5명·상점 6칸 중 2칸)을 접는다 */
  .list.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
  .list.cols2 .item,.list.cols2 .crow{margin:0;min-width:0;}

  /* ⑥ ★ 상점 카드 (2026-09-05 · 사용자 참고 화면「운빨존많겜」상점) — 3열 세로 카드.
     위 이름 → 가운데 큰 아이콘 + 수량 → 아래 가격 띠(전폭). 할인은 왼쪽 위 리본, 남은 수는 칩.
     옛 2열 `.item` 줄은 이름이 「뽑…」「낡은…」으로 잘렸다 — 카드는 이름을 두 줄까지 허용한다.
     치수: 카드 폭 ≈ 117(390 폰 3열) · 아이콘 48 · 가격 띠 36 · 누르는 높이 ≥ 150. 토큰만 쓴다. */
  .shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);}
  .shopgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .shopcard{position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0;
    background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad-card);overflow:hidden;
    cursor:pointer;box-shadow:inset 0 1px 0 var(--rim);}
  .shopcard:active{filter:brightness(1.15);}
  .shopcard.out{opacity:.45;}
  .shopcard .sc-nm{font-size:var(--fs-body);font-weight:700;text-align:center;padding:var(--sp-2) var(--sp-2) var(--sp-1);
    line-height:1.2;min-height:calc(var(--fs-body) * 2.4 + var(--sp-2) + var(--sp-1));
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:keep-all;overflow-wrap:anywhere;}
  .shopcard .sc-ic{position:relative;margin:0 var(--sp-2);height:72px;border-radius:var(--rad-btn);
    background:var(--c-press);border:1px solid var(--c-line);display:flex;align-items:center;justify-content:center;
    font-size:40px;line-height:1;} /* fs-ok */
  .shopcard .sc-ic .ic{vertical-align:0;}
  .shopcard .sc-ic .sc-n{position:absolute;right:5px;bottom:2px;font-size:var(--fs-num);font-weight:700;color:#fff;
    text-shadow:0 0 3px #000,0 0 6px #000,1px 1px 0 #000;font-variant-numeric:tabular-nums;}
  /* 설명은 두 줄까지 — 한 줄 말줄임은 3열 폭에서 6~8자만 남아 정보가 0 이었다(QA) */
  .shopcard .sc-sub{font-size:var(--fs-note);color:var(--c-sub);text-align:center;padding:var(--sp-1) var(--sp-2) 0;
    line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    word-break:keep-all;overflow-wrap:anywhere;}
  .shopcard .sc-pr .lack{font-size:var(--fs-note);font-weight:700;margin-left:2px;}
  .shopcard .sc-st{align-self:center;margin:var(--sp-1) 0 0;font-size:var(--fs-note);padding:1px 8px;border-radius:var(--rad-chip);
    background:var(--c-press);border:1px solid var(--c-line);color:var(--c-sub);white-space:nowrap;}
  .shopcard .sc-st.on{background:var(--c-ok);border-color:var(--c-ok);color:#fff;font-weight:700;}
  .shopcard .sc-pr{margin-top:var(--sp-2);height:36px;display:flex;align-items:center;justify-content:center;gap:var(--sp-1);
    background:linear-gradient(var(--gold-hi),var(--gold-lo));color:var(--gold-ink);font-size:var(--fs-num);font-weight:700;
    font-variant-numeric:tabular-nums;border-top:1px solid var(--gold-bd);}
  .shopcard .sc-pr.dia{background:linear-gradient(#a9e6f4,#5fb3c8);color:#0d2b33;border-top-color:#cdeff7;} /* color-ok */
  .shopcard .sc-pr.free{background:var(--c-ok);color:#fff;border-top-color:#6fd08a;} /* color-ok */
  .shopcard .sc-pr .was{font-size:var(--fs-note);font-weight:400;text-decoration:line-through;opacity:.7;margin-left:2px;}
  /* 리본은 **아이콘 칸의 왼쪽 위**에 앉는다 — 카드 꼭대기에 두면 짧은 이름(「다이아」)을 덮었다(캡처 확인) */
  .shopcard .sc-ic .sc-rb{position:absolute;top:-1px;left:-1px;z-index:1;background:var(--c-warn);color:#fff;
    font-size:var(--fs-note);font-weight:700;padding:2px 8px;border-radius:var(--rad-btn) 0 var(--rad-btn) 0;
    box-shadow:0 1px 2px var(--shade);}
  .shopcard .sc-pr.poor{filter:saturate(0) brightness(.75);}
  /* 섹션 머리판 + 남은 시간 칩 — 참고 화면의 「일일 상품 / 11시간 58분」 */
  .shophead{display:flex;flex-direction:column;align-items:center;gap:var(--sp-1);margin:var(--sp-4) 0 var(--sp-2);}
  .shophead .plate{background:var(--c-band);border:1px solid var(--c-line);border-radius:var(--rad-btn);
    padding:6px 22px;font-size:var(--fs-body);font-weight:700;color:var(--c-goldtxt);letter-spacing:-.2px;}
  .shophead .timer{font-size:var(--fs-sub);color:var(--c-text);background:var(--c-press);border:1px solid var(--c-line);
    border-radius:var(--rad-chip);padding:3px 12px;font-variant-numeric:tabular-nums;}
  .shophead .note{font-size:var(--fs-note);color:var(--c-sub);text-align:center;}
  .shophead:first-child{margin-top:0;}

</style>
