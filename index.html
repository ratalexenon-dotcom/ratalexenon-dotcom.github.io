<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>My Mercenary Hero</title>
<style>
  :root{
    /* ★★ 세로 화면 체계 토큰 (2026-09-02 · _기획/화면체계_세로_설계_20260902.md §3)
       🔴 색·글자·여백·모서리의 원본은 이 블록 하나다. 화면 코드는 var(--…) 만 쓴다.
       이 11색·5단·4단 밖의 값을 화면 코드에 적으면 test:syntax 가 잡는다. */
    /* 색 11 역할 */
    --c-bg:#0f0c14; --c-band:#17121f; --c-panel:#1a1424; --c-press:#241c31; --c-line:#4a3b63;
    --c-gold:#e0a93f; --c-goldtxt:#f3d98c; --c-warn:#e5484d; --c-ok:#3aa655;
    --c-text:#cfc4de; --c-sub:#9a8db0;
    /* 글자 5단 */
    --fs-title:20px; --fs-num:17px; --fs-body:14px; --fs-sub:12px; --fs-note:11px;
    /* 여백 4단 · 모서리 · 누르는 것 · 띠 높이 */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --rad-card:10px; --rad-btn:8px; --rad-chip:999px; --rad-sheet:16px;
    --tap:44px; --h-top:44px; --h-tab:56px; --h-seg:36px;
    /* 주 단추 금 그라데이션 */
    --gold-hi:#f0c15a; --gold-lo:#c48a24; --gold-bd:#f7dc9a; --gold-ink:#221606;
    /* ★ 피부 B(금장 액자, 2026-09-07 결재 #2) — 금의 어두운 두 단. 이 밖의 새 색은 없다 */
    --c-gold-dim:#6b5a2a; --c-gold-well:#3a2c14;
    --c-panel-hi:#221a2e;   /* 피부 B 그라데이션 윗단 — 스펙 B-2 */
    /* ★ 웹툰 크림 — 2026-09-06 결재 ② · 2026-09-07 #13 툴팁·말풍선 통일. 「짧은 말」(인물 방 대사 .rm-bubble ·
       툴팁 #tip · 집사 말풍선 #guide)은 크롬이 아니라 **만화 컷**이라 어두운 판 위에 밝은 종이로 뜬다.
       종이 · 잉크 · 테(갈색) 셋뿐이고 이 밖의 새 색은 없다 — 그림자 투명도는 color-mix 로 만든다 */
    --c-paper:#fff8ea; --c-paper-ink:#2b1d10; --c-paper-line:#3a2718;
    /* 림라이트 — 툰 화풍과 크롬을 잇는 선 */
    --rim:rgba(255,255,255,.09); --rim-strong:rgba(255,255,255,.2); --shade:rgba(0,0,0,.28);
    /* ── 옛 이름 = 새 토큰의 별칭 (옛 화면이 그대로 돌게) — 값을 따로 갖지 않는다 ── */
    --bg:var(--c-bg); --bg2:var(--c-band); --panel:var(--c-panel); --panel2:var(--c-press);
    --well:var(--c-press); --line:var(--c-line); --ink:var(--c-text); --dim:var(--c-sub);
    --gold:var(--c-gold); --gold2:var(--c-goldtxt); --red:var(--c-warn); --green:var(--c-ok);
    --blue:#4a7fd4; --purple:#c04bd0; --cyan:#7fd3e8;   /* 3D 판·옛 화면 전용 — 새 코드에서 쓰지 않는다 */
    --r:var(--rad-card);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#07080c;overflow:hidden; /* color-ok */
    font-family:system-ui,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;color:var(--ink);}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  /* ★ 폰에서 꽉 차게 (2026-08-21) — 전에는 540×960 을 통째로 축소해 얹었다.
     390px 폰이면 배율 0.72 라 글씨가 72% 로 줄고 위아래로 151px 검은 띠가 남았다.
     이제 뷰포트를 그대로 쓴다: 폰 = 화면 전체 · PC = 예전과 같은 540×960 창.
     ⚠️ 100dvh 를 쓴다(100vh 는 모바일 주소창 높이를 빼지 않아 아래가 잘린다). 앞 줄은 구형 폴백. */
  /* ★★ 세로 전용 (2026-09-02 사용자 결재 「세로 모드로 전체 바꿀것임」) — 가로 분기·가림막 폐기.
     폭 상한 430(PC 창) · 높이는 뷰포트 그대로(100dvh — 100vh 는 모바일 주소창을 못 뺀다). */
  #frame{position:relative;background:var(--c-bg);overflow:hidden;box-shadow:0 0 60px #000;
    width:min(100vw,430px);
    height:100vh;
    height:100dvh;}
  .scr{position:absolute;inset:0;display:none;flex-direction:column;}
  .scr.on{display:flex;}

  /* ★★ 성 탭 — **단면도가 판을 통째로 쓴다** (2026-09-03 · 성 단면 Task 4)
     위는 재화띠(--h-top), 아래는 탭바(#frame.tabs .scr 이 이미 그만큼 위에서 끝난다)까지 채운다.
     ⚠️ `position:absolute` 다 — 접힘 띠(.k-fold)가 그 **위에** 얹히지 자리를 빼앗지 않는다.
        띠가 자리를 먹으면 펼칠 때마다 판이 줄었다 늘며 3D 캔버스가 매번 다시 잡힌다.
     ⚠️ 여기 있던 #floors(층단추)·#rail(아이콘 레일)·#strip(영지 스트립) 규칙은 지웠다 —
        셋 다 폐지됐다(탭바 + 접힘 띠 + 거실 시트로 갔다). */
  #estatewrap{position:absolute;left:0;right:0;
    top:calc(var(--h-top) + env(safe-area-inset-top));bottom:0;}

  /* 상단 재화띠 44 (2026-09-02 · 스펙 §2-1) */
  #top{flex:0 0 auto;height:calc(var(--h-top) + env(safe-area-inset-top));display:flex;align-items:center;gap:var(--sp-2);
    padding:env(safe-area-inset-top) var(--sp-3) 0;background:var(--c-band);border-bottom:1px solid var(--c-line);font-size:var(--fs-sub);}
  #top .sp{flex:1;}
  .cur{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-1);background:var(--c-press);border:1px solid var(--c-line);
    border-radius:var(--rad-chip);padding:5px 10px;min-height:28px;font-variant-numeric:tabular-nums;color:var(--c-text);}
  .cur b{font-weight:700;font-size:var(--fs-sub);}
  .cur.stam{cursor:pointer;color:var(--c-goldtxt);}
  .cur .plus{color:var(--c-ok);font-weight:700;margin-left:2px;}

  .body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px;}
  .body::-webkit-scrollbar{width:6px;} .body::-webkit-scrollbar-thumb{background:#39405a;border-radius:3px;} /* color-ok */

  h2.t{margin:0 0 10px;font-size:19px;letter-spacing:-.4px;} /* fs-ok */
  h3.t{margin:14px 0 8px;font-size:15px;color:var(--gold2);} /* fs-ok */
  .sub{color:var(--dim);font-size:12px;line-height:1.5;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 16px;border-radius:var(--r);border:1px solid var(--line);
    background:linear-gradient(var(--panel2),var(--panel));color:var(--ink);
    font-size:14px;font-weight:700;cursor:pointer;user-select:none;
    box-shadow:inset 0 1px 0 var(--rim),0 1px 2px var(--shade);}  /* 림라이트 크롬 */
  .btn:active{transform:translateY(1px);filter:brightness(1.15);}
  .btn.gold{background:linear-gradient(var(--gold-hi),var(--gold-lo));border-color:var(--gold-bd);color:var(--gold-ink);
    box-shadow:inset 0 1px 0 var(--rim-strong),0 1px 3px var(--shade);}
  .btn.green{background:linear-gradient(#63d183,#3d9557);border-color:#2c6b3e;color:#08210f;} /* color-ok */
  .btn.blue{background:linear-gradient(#6a9be8,#3a63ad);border-color:#294a86;color:#f2f7ff;} /* color-ok */
  .btn.ghost{background:#00000030;}
  /* ★ 4c-5(2026-09-04) — 되돌릴 수 없는 조작의 확인 단추(`kit.confirmSheet danger`). 경고색 토큰 하나로 —
     금 단추(할 일)와 한눈에 갈린다. ⚠️ **v2 시트 안으로만** 좁힌다(리뷰 I2 · 컨트롤러 ruling): 옛 `ask()`(v1)도
     kind `danger` 를 쓰는데 상점 결제·자리 바꾸기처럼 되돌릴 수 있는 조작까지 그 kind 라, 전역으로 두면
     그것들이 다 빨개진다. v1 단추는 이전 모습(보통 단추) 그대로다. */
  .k-sheet2 .btn.danger{background:linear-gradient(var(--c-warn),color-mix(in srgb, var(--c-warn) 70%, black));border-color:var(--c-warn);color:#fff;
    box-shadow:inset 0 1px 0 var(--rim-strong),0 1px 3px var(--shade);}
  /* ★★ 2026-08-23 사용자 지시 — 「글자가 들어간 버튼도 **글자 크기에 맞춰서** 해놔」
     `.wide` 는 원래 `width:100%` 였다. 그게 팝업마다 가로로 꽉 찬 슬래브 버튼을 쌓아
     「쓸데없이 칸을 늘려 화면을 채우는」 주범이었다.
     ⚠️ 이제 `.wide` 는 **「제 줄을 차지한다」**는 뜻이고 폭은 글자가 정한다.
        `.btn` 이 inline-flex 라, 나란히 둔 버튼 둘은 저절로 한 줄에 붙는다. */
  .btn.wide{width:auto;}
  .btn+.btn{margin-left:6px;}
  .btn[disabled]{opacity:.42;pointer-events:none;}
  .row{display:flex;gap:8px;align-items:center;}
  .row.wrap{flex-wrap:wrap;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;
    box-shadow:inset 0 1px 0 var(--rim);}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;} /* fs-ok */
  .kv span:first-child{color:var(--dim);flex:0 0 auto;white-space:nowrap;}
  /* ⚠️ overflow-wrap:anywhere 로 뒀더니 **이름 한가운데서** 줄이 바뀌었다(「크레지/린」).
     구분자(·) 앞뒤 공백에서만 접히게 keep-all + break-word 로 바꾼다. */
  .kv b{font-variant-numeric:tabular-nums;min-width:0;text-align:right;
    word-break:keep-all;overflow-wrap:break-word;}

  /* 홈 메뉴 타일 */
  /* ⚠️ repeat(3,1fr) 는 칸이 내용보다 못 작아진다(1fr = minmax(auto,1fr)).
     390px 폰에서 3열이 컨테이너를 넘쳐 오른쪽이 잘렸다 → minmax(0,1fr) 로 바닥을 연다. */
  #menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .tile{position:relative;aspect-ratio:1/1;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(160deg,#2b3146,#1a1e2b);display:flex;flex-direction:column; /* color-ok */
    align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;}
  .tile:active{filter:brightness(1.2);}
  .tile canvas{width:64px;height:64px;image-rendering:pixelated;}
  .tile .nm{font-size:15px;font-weight:800;letter-spacing:-.3px;max-width:100%; /* fs-ok */
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .ds{font-size:10px;color:var(--dim);max-width:100%; /* fs-ok */
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .badge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;
    border-radius:999px;font-size:10px;font-weight:800;padding:1px 6px;} /* fs-ok */
  .tile.big{grid-column:span 3;aspect-ratio:auto;padding:16px;flex-direction:row;justify-content:flex-start;gap:14px;
    background:linear-gradient(100deg,#4a3a1c,#2a2415);border-color:#6d5320;} /* color-ok */
  .tile.big .nm{font-size:20px;} .tile.big .txt{display:flex;flex-direction:column;align-items:flex-start;}

  /* 목록 */
  .list{display:flex;flex-direction:column;gap:8px;}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:9px 11px;cursor:pointer;}
  .item:active{filter:brightness(1.2);}
  .item.locked{opacity:.4;pointer-events:none;}
  .item .fc{width:42px;height:42px;border-radius:8px;background:var(--well);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;}
  .item .fc img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .item .mid{flex:1;min-width:0;}
  .item .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .ds{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .rt{text-align:right;font-size:12px;flex:0 0 auto;}
  /* 🔴 2026-09-07 QA6 ⑮ 후속(사용자 실측) — 별이 **글자에서 그림(SVG)으로** 바뀌었다.
     옛 판은 온별 `★`(U+2605)·반별 `☆`(U+2606) 두 글자를 섞어 썼는데 **폰트 기준선이 달라**
     「꽉 찬 별 셋 옆의 빈 별 하나만 떠 보인다」가 났다(글자 두 종류의 세로 정렬은 CSS 로 못 맞춘다).
     이제 한 가지 그림만 쓰고 반쪽은 **왼쪽 절반만 내보내** 만든다 — 기준선이 있을 수 없다.
     ⚠️ 크기는 `1em`(= 둘러싼 글자 크기)이다. 자리마다 px 를 박지 마라 — 캐릭 상세(--fs-title)와
        카드(12px)가 이미 다르고, 그 차이를 글자 크기 하나로 물려받는 것이 이 규칙의 요점이다.
     ⚠️ `.off`(옅은 자리) 이름은 그대로 뒀다 — `#scr-char` 의 `.cd-stars .off` 같은 옛 덧칠이 산다. */
  .star{display:inline-flex;align-items:center;gap:1px;line-height:1;color:var(--gold2);vertical-align:middle;}
  .star .s{position:relative;display:block;flex:0 0 auto;width:1em;height:1em;line-height:1;text-align:center;}
  .star .s > i{position:absolute;left:0;top:0;width:1em;height:1em;overflow:hidden;line-height:0;font-style:normal;}
  .star .s > i.h{width:.5em;}          /* 반쪽 — 같은 그림의 왼쪽 절반만 */
  .star .off{color:#4a5064;} /* color-ok */
  /* kit.js matChip() 이 찍는 재료칩 — 여태 규칙이 없어 맨몸으로 그려졌다(2026-09-03 · fix round 5).
     `--fs-s` 는 :root 에 없어 가장 가까운 `--fs-note`(11px), 999px 대신 `--rad-chip` 을 쓴다.
     `.k-chip` 은 selftest CLICK_SEL 에 든 **누르는** 부품이라 cursor 를 준다.
     `.short`(모자람)는 kit.js 가 붙이는데 규칙이 없으면 충분/모자람이 똑같이 보인다. */
  /* ★ 2026-09-05 「크게」 — 칩 높이 28, 아이콘 20, 글자 보조 단(12), 숫자는 굵게. */
  .k-chip{display:inline-flex;align-items:center;gap:var(--sp-1);padding:3px 10px 3px 6px;min-height:28px;border-radius:var(--rad-chip);
    border:1px solid var(--c-line);background:var(--c-press);color:var(--c-text);font-size:var(--fs-sub);
    white-space:nowrap;cursor:pointer;}
  .k-chip b{font-weight:700;font-variant-numeric:tabular-nums;}
  .k-chip.short{border-color:var(--red);color:var(--red);}
  /* 재료 카드 — 대장간 머리·창고·사냥 보고처럼 **재료가 주인공**인 자리(칩은 조리법 줄 안 인라인용).
     상점 카드(.shopcard)와 같은 문법: 위 이름 · 가운데 큰 아이콘 · 아래 수량. 5종이라 5열. */
  .matgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-2);}
  .matcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--sp-2) var(--sp-1);
    border-radius:var(--rad-card);border:1px solid var(--c-line);background:var(--c-panel);cursor:pointer;min-width:0;
    box-shadow:inset 0 1px 0 var(--rim);}
  .matcard:active{filter:brightness(1.2);}
  .matcard .mc-ic{width:44px;height:44px;border-radius:var(--rad-btn);background:var(--c-press);border:1px solid var(--c-line);
    display:flex;align-items:center;justify-content:center;color:var(--c-text);}
  .matcard .mc-ic .ic{vertical-align:0;}
  .matcard .mc-nm{font-size:var(--fs-sub);font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .matcard .mc-n{font-size:var(--fs-num);font-weight:700;font-variant-numeric:tabular-nums;color:var(--c-goldtxt);line-height:1.1;}
  .matcard .mc-need{font-size:var(--fs-note);color:var(--c-sub);}
  .matcard.short{border-color:var(--c-warn);} .matcard.short .mc-n{color:var(--c-warn);}
  .matcard.zero .mc-n{color:var(--c-sub);}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--well); /* fs-ok */
    border:1px solid var(--line);color:var(--dim);margin-right:4px;}
  .chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-bd);font-weight:700;}
  /* 대행 — 앉을 수는 있지만 실력이 깎이는 후보(A-13 · `PROXY_K`). 고를 수 있으니 **죽이지 않고 표시만** 한다 */
  .chip.warn{border-color:var(--c-warn);color:var(--c-warn);}
  /* 전설 확정 — 이름이 붙기 전(+5 미만)에도 이 칩 하나로 알아본다 */
  .chip.lg{background:linear-gradient(160deg,#ffe9b0,#d9a53c);color:#3a2a06; /* color-ok */
    border-color:#7a5410;font-weight:800;box-shadow:0 0 8px #e0a93f66;} /* color-ok */
  /* 칩이 안 들어가는 좁은 자리(캐릭터 창 장비칸)용 — 같은 금색으로 아이콘 칸 모서리에 ★ */
  .lgmark{position:absolute;top:-5px;left:-5px;width:15px;height:15px;border-radius:99px;
    background:linear-gradient(160deg,#ffe9b0,#d9a53c);color:#3a2a06;border:1px solid #7a5410; /* color-ok */
    font-size:9px;line-height:13px;text-align:center;font-weight:900;box-shadow:0 0 6px #e0a93f88; /* fs-ok */
    pointer-events:none;z-index:1;}

  /* 도감 격자 */
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
  .cell{aspect-ratio:1/1;border-radius:8px;background:var(--well);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .cell img{width:80%;height:80%;object-fit:contain;image-rendering:pixelated;}
  .cell.un img{filter:brightness(0) opacity(.45);}
  .cell .no{position:absolute;top:2px;left:4px;font-size:9px;color:var(--dim);} /* fs-ok */
  .cell .nm2{position:absolute;bottom:0;left:0;right:0;font-size:9px;text-align:center; /* fs-ok */
    background:#000a;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} /* color-ok */

  /* ★ 스테이지 격자 — 12칸이 두 줄로 다 들어온다 (스크롤 0) */
  #stggrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;}
  .stg{position:relative;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
  .stg:active{filter:brightness(1.2);}
  .stg.lock{opacity:.42;}
  .stg.done{border-color:#2c6b3e;} /* color-ok */
  .stg .no2{font-size:11px;font-weight:800;white-space:nowrap;}
  .stg .fc2{width:46px;height:46px;border-radius:8px;background:var(--well);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .stg .fc2 img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .stg .ds2{font-size:10px;color:var(--dim);white-space:nowrap;} /* fs-ok */
  .stg .ok2{position:absolute;top:3px;left:4px;font-size:9px;color:var(--green);font-weight:800;} /* fs-ok */
  .stg .go2{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:999px;
    background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;}

  /* ★ 정수 3칸 — 「빈칸 세 개 + 그 밑에 패시브·액티브 아이콘」 (2026-08-21) */
  .escell{flex:1;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--well);
    padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
  .escell:active{filter:brightness(1.25);}
  .escell.empty{border-style:dashed;opacity:.6;justify-content:center;min-height:96px;}
  .escell .plus{font-size:20px;color:#5b6577;} /* color-ok */
  .escell .lb2{font-size:10px;color:var(--dim);} /* fs-ok */
  .escell .esface{width:34px;height:34px;border-radius:7px;overflow:hidden;background:#151926; /* color-ok */
    display:flex;align-items:center;justify-content:center;}
  .escell .esface img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .escell .esname{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden; /* fs-ok */
    text-overflow:ellipsis;max-width:100%;}
  .escell .esstar{font-size:10px;color:var(--gold2);letter-spacing:-1px;line-height:1;} /* fs-ok */
  .escell .esup{font-size:9px;color:var(--green);text-align:center;line-height:1.25;} /* fs-ok */
  .escell .esicons{display:grid;grid-template-columns:auto 1fr;gap:1px 3px;margin-top:2px;width:100%;
    align-items:center;}
  .escell .ei{font-size:10px;text-align:center;} /* fs-ok */
  .escell .eit{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} /* fs-ok */

  /* ============================================================
     ★ 캐릭터 창 「전투」 탭 — **3열이 같은 아래 선에서 끝난다** (2026-08-21 사용자 지시)
       「얼굴 사진 밑에 이름 … 그 옆에 str 20 이렇게 스탯이 위에서 아래로 …
        스탯 옆에 착용장비 세 칸 … 이 세 카테고리가 사진과 이름이 끝나는 선에 맞춰서 끝남」
     ⚠️ `align-items:stretch` 가 그 「끝나는 선」을 만든다. 열마다 높이가 다르면
        대충 얹어 놓은 화면으로 읽힌다.
     ============================================================ */
  .cmtop{display:grid;grid-template-columns:88px 1fr 106px;gap:8px;align-items:stretch;}
  .cmtop>div{display:flex;flex-direction:column;justify-content:flex-start;min-width:0;}
  .cmface{align-items:center;gap:2px;}
  .cmface .fc{background:var(--well);border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;}
  .cmface .fc img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .cmname{font-size:14px;font-weight:800;margin-top:3px;text-align:center;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ⚠️ 「세 카테고리가 사진과 이름이 끝나는 선에 맞춰서 끝남」 — 마지막 버튼을 **바닥에 붙인다.**
     안 붙이면 열마다 내용 길이가 달라 끝선이 들쭉날쭉해진다(실측으로 잡았다). */
  .cmtop>div>.btn:last-child{margin-top:auto;}
  .cmstat{gap:1px;}
  .cmstat .srow{display:flex;align-items:center;gap:6px;padding:1px 6px;border-radius:5px;}
  .cmstat .srow:nth-child(odd){background:#ffffff08;}
  .cmstat .sname{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.4px;width:34px;flex:0 0 auto;}
  .cmstat .sval{font-size:14px;font-variant-numeric:tabular-nums;flex:1;}
  .cmstat .splus{font-size:11px;font-weight:800;color:var(--gold-ink);background:var(--gold);
    border-radius:5px;padding:0 6px;cursor:pointer;}

  .cmgear{gap:4px;}
  .cmgear .gslot{flex:1;min-height:0;border-radius:8px;border:1px solid var(--line);background:var(--well);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:3px 2px;cursor:pointer;}
  .cmgear .gslot.on{border-color:#6d5320;background:#1d1a12;} /* color-ok */
  .cmgear .gslot:active{filter:brightness(1.3);}
  .cmgear .gi{font-size:14px;line-height:1;}
  .cmgear .gn{font-size:9px;color:var(--dim);max-width:100%;white-space:nowrap; /* fs-ok */
    overflow:hidden;text-overflow:ellipsis;}
  .cmgear .gslot.on .gn{color:var(--gold2);}

  /* 하단 고정 바 */
  .foot{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:#151926;display:flex;gap:8px;} /* color-ok */

  /* ★★ 하단 탭바 (2026-09-02 · 스펙 §2-2·§3-6) — 56 + 안전영역. 화면(.scr)은 그만큼 위에서 끝난다 */
  #tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h-tab) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);display:none;background:var(--c-band);border-top:1px solid var(--c-line);z-index:45;}
  #frame.tabs #tabbar{display:flex;}
  #frame.tabs .scr{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  #frame.tabs #guide{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  #tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--c-sub);font-size:var(--fs-note);cursor:pointer;position:relative;min-height:var(--tap);}
  #tabbar .tb .ic{display:block;color:inherit;}
  #tabbar .tb.on{color:var(--c-gold);}
  /* 🔴 QA5 B-12(2026-09-07) — 아직 안 만든 칸(투기장). 누르기 **전에** 보이게 흐리게 둔다 —
     다섯 칸이 똑같이 생겨 신규 플레이어가 한 칸을 눌러 보고서야 「준비 중」을 알았다. */
  #tabbar .tb.soon{opacity:.45;}
  #tabbar .tb.soon .lb:after{content:" 🔒";font-size:.85em;}
  #tabbar .tb .bd{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:var(--rad-chip);
    background:var(--c-warn);color:#fff;font-size:var(--fs-note);font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* ★ 탐험 탭 — 3D 던전 지도 (2026-09-03) */
  .ex3d-head{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--c-band);border-bottom:1px solid var(--c-line);flex-wrap:wrap;}
  .ex3d-head .btn{min-height:var(--tap);padding:0 var(--sp-3);}
  .ex3d-title{flex:1;display:flex;flex-direction:column;align-items:center;}
  .ex3d-title b{font-size:var(--fs-body);color:var(--c-goldtxt);}
  .ex3d-title .sub{font-size:var(--fs-note);}
  .ex3d-modes{flex:0 0 100%;display:flex;gap:var(--sp-1);height:var(--h-seg);}
  .ex3d-modes .seg{flex:1;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sub);border-radius:var(--rad-btn);background:var(--c-press);border:1px solid var(--c-line);color:var(--c-sub);}
  .ex3d-modes .seg.on{background:var(--c-gold-well);color:var(--c-goldtxt);border-color:var(--c-gold);}
  .ex3d-modes .seg.lock{opacity:.55;}
  #ex3d canvas#bcv3{position:absolute;inset:0;width:100%;height:100%;}

  /* 대화(가이드) */
  /* ★ 2026-09-03(성 단면 Task 4) — 집사 대화는 **탭바 바로 위 고정 띠**다(스펙 §4-4).
     폭 100% · 판(성 단면)을 반쪽 넘게 덮지 않는다.
     🔴 4c-5 QA #2(2026-09-04) — 자르는 규칙이 **두 겹**이었다: 여기 `max-height:140px;
        overflow:hidden` 과 `.gt` 의 `-webkit-line-clamp:2`. 안쪽만 풀면 대사가 제 높이로 그려진
        채 **이 상자 밖으로 흘러 탭바 밑으로 들어간다**(실측: 360x780 대사1 힌트끝 795 vs 탭바 724).
        상한은 **한 곳에서만** 건다 — `.gt` 의 `max-height`(아래) 하나다. 이 상자는 내용만큼
        커지고(위로 자란다) 아무것도 안 자른다. 이름줄·힌트줄이 잘리던 것도 여기서 온 것이다. */
  /* 🔴 QA5 B-2(2026-09-07) — 바탕이 `#0009→#000e`(60~93%) 라 **뒤 글자가 비쳤다**: 캐릭 상세의
     능력치 여섯 자리·홈의 「⚔ 1-1 탐험」 단추가 대사 위로 겹쳐 읽혀 둘 다 안 읽혔다(실측 캡처).
     안내는 읽히는 게 전부다 — 바탕을 **불투명**으로 둔다(위쪽만 살짝 옅어 상자가 떠 보이게). */
  /* ★ 웹툰 크림(2026-09-07 B-1 #13) — 인물 방 말풍선(room2d .rm-bubble)과 같은 종이·잉크·갈색 테.
     옛 남색 유리(#12161e 그라데이션 + 금테)는 「크롬」이었고 이건 「말」이다 — 짧은 말 셋(#tip·#guide·.rm-bubble)이
     한 피부를 쓴다. 불투명(QA5 B-2)은 종이색이 그대로 지킨다. 만화 두께 그림자는 `.rm-bubble` 과 같은 `0 4px 0`. */
  #guide{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:var(--c-paper);color:var(--c-paper-ink);
    border-top:2.5px solid var(--c-paper-line);
    box-shadow:0 4px 0 color-mix(in srgb, var(--c-paper-line) 67%, transparent),0 8px 18px var(--shade);z-index:40;display:none;}
  #guide.on{display:block;overflow:visible;}
  /* ★ 튜토리얼 순서(2026-09-05) — `.up` 은 말풍선을 **재화띠 바로 밑**에 붙인다. 홈(포탈)에서
     「아래 단추 하나」를 가리키는 장이 그 단추를 제 몸으로 덮었다(실측 390x844).
     ⚠️ 2026-09-08 — 그 단추(`.home-hero-cta`)는 **없어졌다**(사용자 결재). 지금 첫날이 가리키는 곳은
        **탭바의 탐험 탭**이고 그건 판의 맨 아래라 `.up` 이 더 필요한 자리다 — 규칙은 그대로 산다.
     ⚠️ `#frame.tabs #guide` 가 bottom 을 다시 정하므로 그보다 특정도가 같거나 높게 적는다. */
  /* ★ 2026-09-06 사용자 「어느 경우에든 집사 사진이 대화창 위에」 — .up 일 때도 집사(.ga 140px)가 상자 **위**에
     서도록 상자를 집사 키만큼 내린다(재화띠 밑 + 140px). 옛 판은 상자를 띠 바로 밑에 붙이고 집사를 상자 밑에
     매달았는데(top:100%) 상반신이 잘려 어색했다(캡처 `_기획/화면체계_집사안내창_목업_20260906/`).
     .up 은 대상이 판 아래 절반일 때만 켜지므로(tutorial.js) 상자가 140px 내려와도 가리키는 곳을 안 덮는다. */
  /* 🔴 QA5 B-1 2차(2026-09-07) — 흉상이 상자 위쪽 32px 에 걸치게 내려앉았으므로(`.ga` 참조),
     상자가 흉상에게 내줘야 할 높이도 그만큼 준다: 116 − 32 = **84**. 흉상의 **화면 위 자리는
     그대로**고(실측 `.ga` top 52px 유지) 상자만 32px 올라간다 = 가리키는 곳을 덜 덮는다.
     ⚠️ `.ga` 의 걸침(32px)과 이 값은 한 몸이다 — 하나를 바꾸면 둘 다 바꾼다. */
  #frame.tabs #guide.up, #guide.up{bottom:auto;top:calc(var(--h-top) + env(safe-area-inset-top) + 84px);
    border-top:0;border-bottom:2.5px solid var(--c-paper-line);background:var(--c-paper);}
  /* 🔴 QA5 B-1 2차(2026-09-07 팀장 결재 「더 줄이지 말고 자리를 옮겨라」) — 이름줄은 흉상이
     내려앉은 32px 띠 안에 있다. 여기만 초상 폭(124px)+여백을 비켜 준다 — `.gt`(대사)는 그 아래라
     여백 0 그대로다(옛 4c-5 의 「초상 폭+16」 규칙은 초상이 **상자 안**에 있을 때 얘기다).
     ⚠️ 흉상이 **왼쪽**이므로 여백도 왼쪽이다(`.ga` 주석 참조) — 둘의 방향은 늘 같이 바꾼다. */
  #guide .gn{color:var(--c-paper-line);font-weight:800;font-size:var(--fs-body);margin-bottom:5px;padding-left:132px;}
  /* ⚠️ 오른쪽 초상화(.ga)가 얹혀 있다 — 비켜 두지 않으면 긴 대사가 얼굴 밑으로 감긴다
     🔴 mph-qa 중③(2026-09-03 · 6705a5b) — 대사 칸이 화면의 24% 를 먹어 마당 가격표를 가려
        `-webkit-line-clamp:2` 로 잘랐다. 「두 줄에 안 담기는 대사는 잘못 쓰인 것」이라 적어 두고
        **아무도 안 지켰다** — 4c-5 QA 실측: 일곱 마디 중 여섯이 잘렸고(한 마디가 45px 칸에
        157~330px), 영감·소탕·주사위 설명은 게임 어디에서도 못 읽는다.
     🔴 4c-5 QA #2(2026-09-04) — **자르는 쪽이 틀렸다.** 안 보이는 규칙 설명은 화면을 좀 가리는
        것보다 나쁘다(튜토리얼이 뜻을 잃는다). clamp 를 풀고 상한만 둔다.
        48vh 는 실측 최대(360x780 대사6 = 336px · 43vh)보다 넉넉하다 — 지금 일곱 마디는
        **한 마디도 안 넘친다.** 넘침 규칙은 대사가 더 길어질 날의 안전망이다. */
  #guide .gt{font-size:var(--fs-body);line-height:1.6;padding-right:0;color:var(--c-paper-ink);
    max-height:48vh;overflow-y:auto;}  /* scroll-ok — 넘칠 때만 도는 안전망(위 주석) */
  /* 대사 속 강조(<b>탐험</b>)는 밝은 종이 위라 금색이 안 읽힌다 — 테와 같은 갈색으로 */
  #guide .gt b{color:var(--c-paper-line);}
  /* 🔴 4c-5(2026-09-04) — padding-right 80px. 오른쪽 끝에 붙는 힌트인데 집사 흉상(.ga, 오른쪽
     12px · 폭 64px)이 그 자리에 겹쳐 「▼ 눌러서 계속」이 얼굴 밑에 숨었다. .gt 와 같은 여백을 준다.
     ⚠️ 80 은 12(right) + 64(폭) + 4(틈) 다 — .ga 의 폭이 바뀌면 여기도 같이 바꾼다.
        폭은 `app.js nextLine()` 의 `charShot(GUIDE_CH, 64, 'head')` 가 **인라인으로** 정한다
        (인라인이 이 규칙을 이긴다). 그 인자가 96 이던 동안 이 여백은 16px 모자랐다. */
  #guide .gh{text-align:right;color:var(--c-paper-line);font-size:var(--fs-note);margin-top:4px;padding-right:0;}
  /* 집사는 3D 흉상(charshot 캔버스)이다 — 도트 보간 금지 설정을 걸지 않는다
     🔴 88 → 64 (같은 이유 — 얼굴이 대사보다 크면 띠가 얼굴 높이에 끌려 올라간다) */
  /* ★ 2026-09-05 밤 — 집사는 배경을 딴 2D 인물(asset/npc/butler_muk.png 알파). **상자 밖**이다: 흉상이 상자
     윗변 위에서 시작하고(bottom:100%) 상자 안에는 글만 들어간다(사용자 「박스 위에서 흉상이 시작되게 · 박스 안에는
     글만」). 그래서 .gt/.gh 의 오른쪽 여백은 0 — 4c-5 T2 의 「초상 폭+16」 규칙은 초상이 상자 안에 있을 때 얘기다.
     위 배치(.up)에서도 상자 **위**에 선다 — 상자가 그만큼 내려온다(위 .up 규칙 · 2026-09-06). 키만 140 으로 줄인다. */
  /* 🔴 QA5 B-1(2026-09-07) — 168px 흉상이 상자 위 오른쪽에 서서 **화면 오른쪽 1/3을 상시로
     가렸다**: 뽑기 결과 셋째 칸의 전투력·별, 캐릭 상세의 반지칸, 상단 토스트 글자까지 덮었다
     (실브라우저 실측). 「집사는 대화창 위」(2026-09-06 사용자 확정)는 그대로 두고 **키만** 줄인다
     — 168→124(가리는 넓이 ≈ 절반). `.up` 은 상자를 흉상 키만큼 내리므로 위 `top:…116px` 과
     한 몸이다: 여기 키를 바꾸면 거기도 같이 바꿔야 한다.
     ⚠️ 값 치른 아트다 — 더 줄이거나 자리를 옮기는 것은 디렉터 결재 사항(반영대장에 물음 남김). */
  /* 🔴 QA5 B-1 2차(2026-09-07 · 팀장 결재) — **키는 124px 에서 더 안 줄인다**(값 치른 아트라
     계속 깎으면 값이 깎인다). 대신 **자리를 내린다**: `bottom:100%`(전부 상자 위) → 상자 위쪽
     32px 에 걸치게 해서 콘텐츠를 침범하는 높이를 124→92px 로 줄인다. 뽑기 결과 셋째 칸의
     보조직업 칩·별에 닿던 것이 이만큼이면 떨어진다(실측).
     그리고 **왼쪽 끝으로 옮긴다**(팀장 결재 「왼쪽/아래로」). 오른쪽이 문제였던 이유는 이 게임의
     카드·모달이 **오른쪽에 값을 몰아 두기** 때문이다: 카드의 전투력·별·보조직업 칩도, 모달의 주
     단추(뽑기 결과 「확인」)도 전부 오른쪽 끝이다. 실측(430×729) — 옮기기 전 흉상 l=590·rt=714 가
     「확인」(l=614·rt=673)을 덮었고, 옮긴 뒤 rt=416 이라 **카드·단추 어느 것과도 안 겹친다**
     (카드 바닥 t=445 < 흉상 top 474 · 단추 l=614 > 흉상 rt=416).
     ⚠️ 그림은 `butler_faceLeft.png`(얼굴이 왼쪽을 본다) — 왼쪽에 서면 제 대사를 등지는 셈이라
        엄밀히는 오른쪽 보는 판이 맞다. 실물로는 시선이 거의 정면이라 어색하지 않아 그대로 뒀다.
        뒤집기가 필요하면 `transform:scaleX(-1)` 한 줄이지만 가슴의 사자 문장·쟁반 든 손이 같이
        뒤집힌다 — **디렉터 결재 사항**으로 남긴다(반영대장).
     ⚠️ 32 는 `#guide` 위 여백(10) + `.gn` 이름줄(≈22) 이다 — 걸치는 띠가 **이름줄까지**라
        위 `.gn` 의 `padding-left` 하나로 글이 안 감긴다. 이 값을 키우면 대사줄(`.gt`)까지
        걸려 거기도 여백을 줘야 한다(= 대사 칸이 좁아진다). 둘은 한 몸이다. */
  #guide .ga{position:absolute;left:4px;bottom:calc(100% - 32px);width:auto;height:124px;opacity:1;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.75));pointer-events:none;}
  #guide.up .ga{height:108px;}
  /* 🔴 2026-09-07 QA6 ⑯ — 흉상은 말풍선의 **자식**이라 z 로는 못 비킨다: 상자 위로 92px 튀어나온
     왼쪽 아래 124×124 가 그 밑의 글을 덮는다. 키는 더 안 줄인다(값 치른 아트 · QA5 B-1 2차 결재)
     — 대신 **글을 밀어낸다.** `#frame.guiding` 은 말풍선이 떠 있는 동안만 붙는다(app.js markGuiding).
     ⚠️ 132 = left(4) + 흉상 폭(124) + 틈(4). `.ga` 의 left·height 를 바꾸면 여기도 같이 바꾼다.
     ⚠️ 바닥에 붙는 글만 비킨다 — 위쪽 내용은 흉상에 안 닿는다. */
  #frame.guiding .k-sheet .k-sh-b{padding-left:132px;}
  #frame.guiding .guide-shy{padding-left:132px;}
  /* 말풍선이 **위**로 올라간 장(`#guide.up`)에서는 흉상이 판 왼쪽 위에 선다 — 그때 덮이는 것은
     캐릭 상세의 이름·성격 줄이다(390×844 실측 `_화면/세로/튜토리얼/p1_grow_stat`).
     ⚠️ `#guide` 가 `.scr` 보다 DOM 뒤라 형제 선택자로는 못 고른다 — 표는 `tutorial.js setUp()`
        이 판(`#frame.guide-up`)에 붙인다. */
     ⚠️ 132 을 다 주면 이름이 통째로 밀려 사라진다(실측) — 흉상과 겹치지 않을 만큼만(100) 민다.
        더 밀지 않는 대신 이름이 `…` 로 줄게 한다(아래 `.nmrow b`). 흉상 자리를 옮기는 것은
        디렉터 결재 사항으로 남긴다(`.ga` 주석 · 값 치른 아트). */
  #frame.guiding.guide-up .cd-headwrap{padding-left:100px;}

  /* ★★ 튜토리얼 손잡기 마스크 (2026-09-05 P1 Task 2 · 커리큘럼 §1-1)
     「지금 눌러야 할 곳」 **한 곳만** 뚫고 나머지를 덮는다. 구멍은 `clip-path` 의 evenodd 로
     판다 — 잘려 나간 자리는 hit-test 도 안 받으므로 **구멍 밑 요소가 그대로 눌린다**(별도 배선 없음).
     🔴 2026-09-05 P1 픽스 웨이브(C1) — **z80 → z65**. 팝업(#modal z60)보다는 위, 시트(.k-sheet z70 ·
        .k-sh-bg z69)보다는 **아래**다. z80 이던 시절엔 마스크가 시트를 통째로 덮어, 손가락이 가리킨
        단추를 눌러서 **연** 시트(장착 목록 `.k-srow`·정수 시트·시설 고르기)가 그 자리에서 안 눌렸다 —
        `first.equip`·`first.ess`·`grow.train`·`craft2.cook` 이 전부 갇힘이었다(최종 리뷰 C1).
        이제 시트는 마스크 위라 통째로 살아 있고, 팝업 안 손잡이는 여전히 `spotlight()` 가 구멍을 판다.
     ⚠️ 대상이 시트 **안**이면 링(마스크 자식)이 시트에 가려 안 보인다 — 허용한다. 눌리는 게 먼저다.
     ⚠️ 말풍선(#guide.tut z85)은 그대로 마스크 위다.
     ⚠️ `data-block` = 봇 금지 표시(말풍선과 같은 규율) — 훑기 도구가 여길 누르지 않게 한다. */
  #tutmask{position:absolute;inset:0;z-index:65;display:none;background:rgba(0,0,0,.55);pointer-events:auto;}
  #tutmask.on{display:block;}
  #tutmask .ring{position:absolute;border:2px solid var(--gold);border-radius:12px;
    box-shadow:0 0 0 4px #e0a93f44, 0 0 18px #e0a93f88;pointer-events:none;animation:tutpulse 1.1s ease-in-out infinite;}
  @keyframes tutpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  /* 말풍선은 마스크보다 위다 — 안 그러면 「무엇을 하라」는 글이 어둠에 깔린다 */
  #guide.tut{z-index:85;}
  /* 구멍 **밖**을 눌렀을 때 — 막지만 말고 「여기요」라고 흔든다(갇힌 느낌을 줄인다) */
  #guide.shake{animation:tutshake .3s ease-in-out;}
  @keyframes tutshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* 팝업 */
  #modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;}
  #modal.on{display:flex;}
  /* ⚠️ 2026-08-23 — `width:100%` 였다. 내용이 두 줄이어도 상자가 440 을 꽉 채워서
     「빈 칸을 늘려 화면을 채우는」 것처럼 보였다. 이제 **내용이 폭을 정한다.** */
  #modal .box{width:auto;min-width:min(320px,90vw);max-height:80%;overflow:auto;}

     「팝업으로 반투명한 말풍선에 글씨있는 그런 느낌」 */
  /* ★ 웹툰 크림(2026-09-07 B-1 #13) — 「반투명 남색 유리」였던 것을 인물 방 말풍선(.rm-bubble)·집사 말풍선(#guide)과
     같은 종이·잉크·갈색 테로. 꼬리는 45° 정사각 18(테 두 변) — 툴팁은 앵커 **위**에 뜨므로 꼬리가 **아래**다
     (`app.js showTip` 이 위가 좁아 아래로 뒤집으면 `.below` 를 붙이고 꼬리가 위로 간다).
     `--ax` = 앵커 가운데의 툴팁 안 x(px) — 꼬리와 팝 애니의 원점이 같이 따라간다. */
  .tipdot{border-bottom:1px dashed var(--c-sub);cursor:pointer;}
  #tip{position:absolute;z-index:75;max-width:250px;padding:10px 14px;border-radius:18px;
    background:var(--c-paper);color:var(--c-paper-ink);border:2.5px solid var(--c-paper-line);
    box-shadow:0 4px 0 color-mix(in srgb, var(--c-paper-line) 67%, transparent),0 8px 18px var(--shade);
    font-size:var(--fs-sub);line-height:1.5;font-weight:700;
    transform-origin:var(--ax,50%) 100%;animation:tipin .22s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none;}
  #tip > b{color:var(--c-paper-line);display:block;margin-bottom:3px;font-size:var(--fs-sub);font-weight:800;}
  #tip span b{color:var(--c-paper-line);}   /* 본문 속 강조 — 제목처럼 줄을 바꾸지 않는다 */
  #tip:after{content:"";position:absolute;left:var(--ax,50%);bottom:-11px;margin-left:-9px;width:18px;height:18px;
    background:var(--c-paper);border-right:2.5px solid var(--c-paper-line);border-bottom:2.5px solid var(--c-paper-line);
    border-bottom-right-radius:3px;transform:rotate(45deg);}
  #tip.below{transform-origin:var(--ax,50%) 0;}
  #tip.below:after{bottom:auto;top:-11px;border-right:0;border-bottom:0;border-bottom-right-radius:0;
    border-left:2.5px solid var(--c-paper-line);border-top:2.5px solid var(--c-paper-line);border-top-left-radius:3px;}
  @keyframes tipin{0%{opacity:0;transform:scale(.85);}60%{transform:scale(1.04);}100%{opacity:1;transform:none;}}

  /* 토스트

     ⚠️ 집사 말풍선(#guide, 아래에서 자란다)과 자리가 겹치면 그 위에 얹힌다 — z70 > z40 이라
