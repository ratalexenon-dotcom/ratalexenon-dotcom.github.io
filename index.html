<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>My Mercenary Hero</title>
<style>
  :root{
    /* ★★ 세로 화면 체계 토큰 (2026-09-02 · _기획/화면체계_세로_설계_20260902.md §3)
       🔴 색·글자·여백·모서리의 원본은 이 블록 하나다. 화면 코드는 var(--…) 만 쓴다.
       이 11색·5단·4단 밖의 값을 화면 코드에 적으면 test:syntax 가 잡는다. */
    /* 색 11 역할 */
    --c-bg:#0f0c14; --c-band:#17121f; --c-panel:#1a1424; --c-press:#241c31; --c-line:#4a3b63;
    --c-gold:#e0a93f; --c-goldtxt:#f3d98c; --c-warn:#e5484d; --c-ok:#3aa655;
    --c-text:#cfc4de; --c-sub:#9a8db0;
    /* 글자 5단 */
    --fs-title:20px; --fs-num:17px; --fs-body:14px; --fs-sub:12px; --fs-note:11px;
    /* 여백 4단 · 모서리 · 누르는 것 · 띠 높이 */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --rad-card:10px; --rad-btn:8px; --rad-chip:999px; --rad-sheet:16px;
    --tap:44px; --h-top:44px; --h-tab:56px; --h-seg:36px;
    /* 주 단추 금 그라데이션 */
    --gold-hi:#f0c15a; --gold-lo:#c48a24; --gold-bd:#f7dc9a; --gold-ink:#221606;
    /* 림라이트 — 툰 화풍과 크롬을 잇는 선 */
    --rim:rgba(255,255,255,.09); --rim-strong:rgba(255,255,255,.2); --shade:rgba(0,0,0,.28);
    /* ── 옛 이름 = 새 토큰의 별칭 (옛 화면이 그대로 돌게) — 값을 따로 갖지 않는다 ── */
    --bg:var(--c-bg); --bg2:var(--c-band); --panel:var(--c-panel); --panel2:var(--c-press);
    --well:var(--c-press); --line:var(--c-line); --ink:var(--c-text); --dim:var(--c-sub);
    --gold:var(--c-gold); --gold2:var(--c-goldtxt); --red:var(--c-warn); --green:var(--c-ok);
    --blue:#4a7fd4; --purple:#c04bd0; --cyan:#7fd3e8;   /* 3D 판·옛 화면 전용 — 새 코드에서 쓰지 않는다 */
    --r:var(--rad-card);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#07080c;overflow:hidden;
    font-family:system-ui,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;color:var(--ink);}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  /* ★ 폰에서 꽉 차게 (2026-08-21) — 전에는 540×960 을 통째로 축소해 얹었다.
     390px 폰이면 배율 0.72 라 글씨가 72% 로 줄고 위아래로 151px 검은 띠가 남았다.
     이제 뷰포트를 그대로 쓴다: 폰 = 화면 전체 · PC = 예전과 같은 540×960 창.
     ⚠️ 100dvh 를 쓴다(100vh 는 모바일 주소창 높이를 빼지 않아 아래가 잘린다). 앞 줄은 구형 폴백. */
  /* ★★ 세로 전용 (2026-09-02 사용자 결재 「세로 모드로 전체 바꿀것임」) — 가로 분기·가림막 폐기.
     폭 상한 430(PC 창) · 높이는 뷰포트 그대로(100dvh — 100vh 는 모바일 주소창을 못 뺀다). */
  #frame{position:relative;background:var(--c-bg);overflow:hidden;box-shadow:0 0 60px #000;
    width:min(100vw,430px);
    height:100vh;
    height:100dvh;}
  .scr{position:absolute;inset:0;display:none;flex-direction:column;}
  .scr.on{display:flex;}

  /* ★★ 성 탭 — **단면도가 판을 통째로 쓴다** (2026-09-03 · 성 단면 Task 4)
     위는 재화띠(--h-top), 아래는 탭바(#frame.tabs .scr 이 이미 그만큼 위에서 끝난다)까지 채운다.
     ⚠️ `position:absolute` 다 — 접힘 띠(.k-fold)가 그 **위에** 얹히지 자리를 빼앗지 않는다.
        띠가 자리를 먹으면 펼칠 때마다 판이 줄었다 늘며 3D 캔버스가 매번 다시 잡힌다.
     ⚠️ 여기 있던 #floors(층단추)·#rail(아이콘 레일)·#strip(영지 스트립) 규칙은 지웠다 —
        셋 다 폐지됐다(탭바 + 접힘 띠 + 거실 시트로 갔다). */
  #estatewrap{position:absolute;left:0;right:0;
    top:calc(var(--h-top) + env(safe-area-inset-top));bottom:0;}

  /* 상단 재화띠 44 (2026-09-02 · 스펙 §2-1) */
  #top{flex:0 0 auto;height:calc(var(--h-top) + env(safe-area-inset-top));display:flex;align-items:center;gap:var(--sp-2);
    padding:env(safe-area-inset-top) var(--sp-3) 0;background:var(--c-band);border-bottom:1px solid var(--c-line);font-size:var(--fs-sub);}
  #top .sp{flex:1;}
  .cur{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-1);background:var(--c-press);border:1px solid var(--c-line);
    border-radius:var(--rad-chip);padding:5px 10px;min-height:28px;font-variant-numeric:tabular-nums;color:var(--c-text);}
  .cur b{font-weight:700;font-size:var(--fs-sub);}
  .cur.stam{cursor:pointer;color:var(--c-goldtxt);}
  .cur .plus{color:var(--c-ok);font-weight:700;margin-left:2px;}

  .body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px;}
  .body::-webkit-scrollbar{width:6px;} .body::-webkit-scrollbar-thumb{background:#39405a;border-radius:3px;}

  h2.t{margin:0 0 10px;font-size:19px;letter-spacing:-.4px;}
  h3.t{margin:14px 0 8px;font-size:15px;color:var(--gold2);}
  .sub{color:var(--dim);font-size:12px;line-height:1.5;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 16px;border-radius:var(--r);border:1px solid var(--line);
    background:linear-gradient(var(--panel2),var(--panel));color:var(--ink);
    font-size:14px;font-weight:700;cursor:pointer;user-select:none;
    box-shadow:inset 0 1px 0 var(--rim),0 1px 2px var(--shade);}  /* 림라이트 크롬 */
  .btn:active{transform:translateY(1px);filter:brightness(1.15);}
  .btn.gold{background:linear-gradient(var(--gold-hi),var(--gold-lo));border-color:var(--gold-bd);color:var(--gold-ink);
    box-shadow:inset 0 1px 0 var(--rim-strong),0 1px 3px var(--shade);}
  .btn.green{background:linear-gradient(#63d183,#3d9557);border-color:#2c6b3e;color:#08210f;}
  .btn.blue{background:linear-gradient(#6a9be8,#3a63ad);border-color:#294a86;color:#f2f7ff;}
  .btn.ghost{background:#00000030;}
  /* ★ 4c-5(2026-09-04) — 되돌릴 수 없는 조작의 확인 단추(`kit.confirmSheet danger`). 경고색 토큰 하나로 —
     금 단추(할 일)와 한눈에 갈린다. ⚠️ **v2 시트 안으로만** 좁힌다(리뷰 I2 · 컨트롤러 ruling): 옛 `ask()`(v1)도
     kind `danger` 를 쓰는데 상점 결제·자리 바꾸기처럼 되돌릴 수 있는 조작까지 그 kind 라, 전역으로 두면
     그것들이 다 빨개진다. v1 단추는 이전 모습(보통 단추) 그대로다. */
  .k-sheet2 .btn.danger{background:linear-gradient(var(--c-warn),#a8262b);border-color:var(--c-warn);color:#fff;
    box-shadow:inset 0 1px 0 var(--rim-strong),0 1px 3px var(--shade);}
  /* ★★ 2026-08-23 사용자 지시 — 「글자가 들어간 버튼도 **글자 크기에 맞춰서** 해놔」
     `.wide` 는 원래 `width:100%` 였다. 그게 팝업마다 가로로 꽉 찬 슬래브 버튼을 쌓아
     「쓸데없이 칸을 늘려 화면을 채우는」 주범이었다.
     ⚠️ 이제 `.wide` 는 **「제 줄을 차지한다」**는 뜻이고 폭은 글자가 정한다.
        `.btn` 이 inline-flex 라, 나란히 둔 버튼 둘은 저절로 한 줄에 붙는다. */
  .btn.wide{width:auto;}
  .btn+.btn{margin-left:6px;}
  .btn[disabled]{opacity:.42;pointer-events:none;}
  .row{display:flex;gap:8px;align-items:center;}
  .row.wrap{flex-wrap:wrap;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;
    box-shadow:inset 0 1px 0 var(--rim);}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;}
  .kv span:first-child{color:var(--dim);flex:0 0 auto;white-space:nowrap;}
  /* ⚠️ overflow-wrap:anywhere 로 뒀더니 **이름 한가운데서** 줄이 바뀌었다(「크레지/린」).
     구분자(·) 앞뒤 공백에서만 접히게 keep-all + break-word 로 바꾼다. */
  .kv b{font-variant-numeric:tabular-nums;min-width:0;text-align:right;
    word-break:keep-all;overflow-wrap:break-word;}

  /* 홈 메뉴 타일 */
  /* ⚠️ repeat(3,1fr) 는 칸이 내용보다 못 작아진다(1fr = minmax(auto,1fr)).
     390px 폰에서 3열이 컨테이너를 넘쳐 오른쪽이 잘렸다 → minmax(0,1fr) 로 바닥을 연다. */
  #menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  .tile{position:relative;aspect-ratio:1/1;border-radius:14px;border:1px solid var(--line);
    background:linear-gradient(160deg,#2b3146,#1a1e2b);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;cursor:pointer;overflow:hidden;}
  .tile:active{filter:brightness(1.2);}
  .tile canvas{width:64px;height:64px;image-rendering:pixelated;}
  .tile .nm{font-size:15px;font-weight:800;letter-spacing:-.3px;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .ds{font-size:10px;color:var(--dim);max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .badge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;
    border-radius:999px;font-size:10px;font-weight:800;padding:1px 6px;}
  .tile.big{grid-column:span 3;aspect-ratio:auto;padding:16px;flex-direction:row;justify-content:flex-start;gap:14px;
    background:linear-gradient(100deg,#4a3a1c,#2a2415);border-color:#6d5320;}
  .tile.big .nm{font-size:20px;} .tile.big .txt{display:flex;flex-direction:column;align-items:flex-start;}

  /* 목록 */
  .list{display:flex;flex-direction:column;gap:8px;}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:9px 11px;cursor:pointer;}
  .item:active{filter:brightness(1.2);}
  .item.locked{opacity:.4;pointer-events:none;}
  .item .fc{width:42px;height:42px;border-radius:8px;background:var(--well);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;}
  .item .fc img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .item .mid{flex:1;min-width:0;}
  .item .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .ds{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .rt{text-align:right;font-size:12px;flex:0 0 auto;}
  .star{color:var(--gold2);letter-spacing:-1px;}
  .star .off{color:#4a5064;}
  /* kit.js matChip() 이 찍는 재료칩 — 여태 규칙이 없어 맨몸으로 그려졌다(2026-09-03 · fix round 5).
     `--fs-s` 는 :root 에 없어 가장 가까운 `--fs-note`(11px), 999px 대신 `--rad-chip` 을 쓴다.
     `.k-chip` 은 selftest CLICK_SEL 에 든 **누르는** 부품이라 cursor 를 준다.
     `.short`(모자람)는 kit.js 가 붙이는데 규칙이 없으면 충분/모자람이 똑같이 보인다. */
  .k-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--rad-chip);
    border:1px solid var(--c-line);color:var(--c-text);font-size:var(--fs-note);
    white-space:nowrap;cursor:pointer;}
  .k-chip.short{border-color:var(--red);color:var(--red);}
  .chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--well);
    border:1px solid var(--line);color:var(--dim);margin-right:4px;}
  .chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-bd);font-weight:700;}
  /* 전설 확정 — 이름이 붙기 전(+5 미만)에도 이 칩 하나로 알아본다 */
  .chip.lg{background:linear-gradient(160deg,#ffe9b0,#d9a53c);color:#3a2a06;
    border-color:#7a5410;font-weight:800;box-shadow:0 0 8px #e0a93f66;}
  /* 칩이 안 들어가는 좁은 자리(캐릭터 창 장비칸)용 — 같은 금색으로 아이콘 칸 모서리에 ★ */
  .lgmark{position:absolute;top:-5px;left:-5px;width:15px;height:15px;border-radius:99px;
    background:linear-gradient(160deg,#ffe9b0,#d9a53c);color:#3a2a06;border:1px solid #7a5410;
    font-size:9px;line-height:13px;text-align:center;font-weight:900;box-shadow:0 0 6px #e0a93f88;
    pointer-events:none;z-index:1;}

  /* 도감 격자 */
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
  .cell{aspect-ratio:1/1;border-radius:8px;background:var(--well);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .cell img{width:80%;height:80%;object-fit:contain;image-rendering:pixelated;}
  .cell.un img{filter:brightness(0) opacity(.45);}
  .cell .no{position:absolute;top:2px;left:4px;font-size:9px;color:var(--dim);}
  .cell .nm2{position:absolute;bottom:0;left:0;right:0;font-size:9px;text-align:center;
    background:#000a;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ★ 스테이지 격자 — 12칸이 두 줄로 다 들어온다 (스크롤 0) */
  #stggrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;}
  .stg{position:relative;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
  .stg:active{filter:brightness(1.2);}
  .stg.lock{opacity:.42;}
  .stg.done{border-color:#2c6b3e;}
  .stg .no2{font-size:11px;font-weight:800;white-space:nowrap;}
  .stg .fc2{width:46px;height:46px;border-radius:8px;background:var(--well);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .stg .fc2 img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .stg .ds2{font-size:10px;color:var(--dim);white-space:nowrap;}
  .stg .ok2{position:absolute;top:3px;left:4px;font-size:9px;color:var(--green);font-weight:800;}
  .stg .go2{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:999px;
    background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;}

  /* ★ 정수 3칸 — 「빈칸 세 개 + 그 밑에 패시브·액티브 아이콘」 (2026-08-21) */
  .escell{flex:1;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--well);
    padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
  .escell:active{filter:brightness(1.25);}
  .escell.empty{border-style:dashed;opacity:.6;justify-content:center;min-height:96px;}
  .escell .plus{font-size:20px;color:#5b6577;}
  .escell .lb2{font-size:10px;color:var(--dim);}
  .escell .esface{width:34px;height:34px;border-radius:7px;overflow:hidden;background:#151926;
    display:flex;align-items:center;justify-content:center;}
  .escell .esface img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .escell .esname{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%;}
  .escell .esstar{font-size:10px;color:var(--gold2);letter-spacing:-1px;line-height:1;}
  .escell .esup{font-size:9px;color:var(--green);text-align:center;line-height:1.25;}
  .escell .esicons{display:grid;grid-template-columns:auto 1fr;gap:1px 3px;margin-top:2px;width:100%;
    align-items:center;}
  .escell .ei{font-size:10px;text-align:center;}
  .escell .eit{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ============================================================
     ★ 캐릭터 창 「전투」 탭 — **3열이 같은 아래 선에서 끝난다** (2026-08-21 사용자 지시)
       「얼굴 사진 밑에 이름 … 그 옆에 str 20 이렇게 스탯이 위에서 아래로 …
        스탯 옆에 착용장비 세 칸 … 이 세 카테고리가 사진과 이름이 끝나는 선에 맞춰서 끝남」
     ⚠️ `align-items:stretch` 가 그 「끝나는 선」을 만든다. 열마다 높이가 다르면
        대충 얹어 놓은 화면으로 읽힌다.
     ============================================================ */
  .cmtop{display:grid;grid-template-columns:88px 1fr 106px;gap:8px;align-items:stretch;}
  .cmtop>div{display:flex;flex-direction:column;justify-content:flex-start;min-width:0;}
  .cmface{align-items:center;gap:2px;}
  .cmface .fc{background:var(--well);border:1px solid var(--line);display:flex;
    align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;}
  .cmface .fc img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .cmname{font-size:14px;font-weight:800;margin-top:3px;text-align:center;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ⚠️ 「세 카테고리가 사진과 이름이 끝나는 선에 맞춰서 끝남」 — 마지막 버튼을 **바닥에 붙인다.**
     안 붙이면 열마다 내용 길이가 달라 끝선이 들쭉날쭉해진다(실측으로 잡았다). */
  .cmtop>div>.btn:last-child{margin-top:auto;}
  .cmstat{gap:1px;}
  .cmstat .srow{display:flex;align-items:center;gap:6px;padding:1px 6px;border-radius:5px;}
  .cmstat .srow:nth-child(odd){background:#ffffff08;}
  .cmstat .sname{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.4px;width:34px;flex:0 0 auto;}
  .cmstat .sval{font-size:14px;font-variant-numeric:tabular-nums;flex:1;}
  .cmstat .splus{font-size:11px;font-weight:800;color:var(--gold-ink);background:var(--gold);
    border-radius:5px;padding:0 6px;cursor:pointer;}

  .cmgear{gap:4px;}
  .cmgear .gslot{flex:1;min-height:0;border-radius:8px;border:1px solid var(--line);background:var(--well);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:3px 2px;cursor:pointer;}
  .cmgear .gslot.on{border-color:#6d5320;background:#1d1a12;}
  .cmgear .gslot:active{filter:brightness(1.3);}
  .cmgear .gi{font-size:14px;line-height:1;}
  .cmgear .gn{font-size:9px;color:var(--dim);max-width:100%;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .cmgear .gslot.on .gn{color:var(--gold2);}

  /* 하단 고정 바 */
  .foot{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:#151926;display:flex;gap:8px;}

  /* ★★ 하단 탭바 (2026-09-02 · 스펙 §2-2·§3-6) — 56 + 안전영역. 화면(.scr)은 그만큼 위에서 끝난다 */
  #tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--h-tab) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);display:none;background:var(--c-band);border-top:1px solid var(--c-line);z-index:45;}
  #frame.tabs #tabbar{display:flex;}
  #frame.tabs .scr{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  #frame.tabs #guide{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  #tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--c-sub);font-size:var(--fs-note);cursor:pointer;position:relative;min-height:var(--tap);}
  #tabbar .tb .ic{display:block;color:inherit;}
  #tabbar .tb.on{color:var(--c-gold);}
  #tabbar .tb .bd{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:var(--rad-chip);
    background:var(--c-warn);color:#fff;font-size:var(--fs-note);font-weight:700;display:flex;align-items:center;justify-content:center;}

  /* ★ 탐험 탭 — 3D 던전 지도 (2026-09-03) */
  .ex3d-head{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);background:var(--c-band);border-bottom:1px solid var(--c-line);flex-wrap:wrap;}
  .ex3d-head .btn{min-height:var(--tap);padding:0 var(--sp-3);}
  .ex3d-title{flex:1;display:flex;flex-direction:column;align-items:center;}
  .ex3d-title b{font-size:var(--fs-body);color:var(--c-goldtxt);}
  .ex3d-title .sub{font-size:var(--fs-note);}
  .ex3d-modes{flex:0 0 100%;display:flex;gap:var(--sp-1);height:var(--h-seg);}
  .ex3d-modes .seg{flex:1;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sub);border-radius:var(--rad-btn);background:var(--c-press);border:1px solid var(--c-line);color:var(--c-sub);}
  .ex3d-modes .seg.on{background:#3a2c14;color:var(--c-goldtxt);border-color:var(--c-gold);}
  .ex3d-modes .seg.lock{opacity:.55;}
  #ex3d canvas#bcv3{position:absolute;inset:0;width:100%;height:100%;}

  /* 대화(가이드) */
  /* ★ 2026-09-03(성 단면 Task 4) — 집사 대화는 **탭바 바로 위 고정 띠**다(스펙 §4-4).
     폭 100% · 판(성 단면)을 반쪽 넘게 덮지 않는다.
     🔴 4c-5 QA #2(2026-09-04) — 자르는 규칙이 **두 겹**이었다: 여기 `max-height:140px;
        overflow:hidden` 과 `.gt` 의 `-webkit-line-clamp:2`. 안쪽만 풀면 대사가 제 높이로 그려진
        채 **이 상자 밖으로 흘러 탭바 밑으로 들어간다**(실측: 360x780 대사1 힌트끝 795 vs 탭바 724).
        상한은 **한 곳에서만** 건다 — `.gt` 의 `max-height`(아래) 하나다. 이 상자는 내용만큼
        커지고(위로 자란다) 아무것도 안 자른다. 이름줄·힌트줄이 잘리던 것도 여기서 온 것이다. */
  #guide{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(#0009,#000e);
    border-top:2px solid var(--gold);z-index:40;display:none;}
  #guide.on{display:block;}
  #guide .gn{color:var(--gold2);font-weight:800;font-size:14px;margin-bottom:5px;}
  /* ⚠️ 오른쪽 초상화(.ga)가 얹혀 있다 — 비켜 두지 않으면 긴 대사가 얼굴 밑으로 감긴다
     🔴 mph-qa 중③(2026-09-03 · 6705a5b) — 대사 칸이 화면의 24% 를 먹어 마당 가격표를 가려
        `-webkit-line-clamp:2` 로 잘랐다. 「두 줄에 안 담기는 대사는 잘못 쓰인 것」이라 적어 두고
        **아무도 안 지켰다** — 4c-5 QA 실측: 일곱 마디 중 여섯이 잘렸고(한 마디가 45px 칸에
        157~330px), 영감·소탕·주사위 설명은 게임 어디에서도 못 읽는다.
     🔴 4c-5 QA #2(2026-09-04) — **자르는 쪽이 틀렸다.** 안 보이는 규칙 설명은 화면을 좀 가리는
        것보다 나쁘다(튜토리얼이 뜻을 잃는다). clamp 를 풀고 상한만 둔다.
        48vh 는 실측 최대(360x780 대사6 = 336px · 43vh)보다 넉넉하다 — 지금 일곱 마디는
        **한 마디도 안 넘친다.** 넘침 규칙은 대사가 더 길어질 날의 안전망이다. */
  #guide .gt{font-size:14px;line-height:1.6;padding-right:80px;
    max-height:48vh;overflow-y:auto;}  /* scroll-ok — 넘칠 때만 도는 안전망(위 주석) */
  /* 🔴 4c-5(2026-09-04) — padding-right 80px. 오른쪽 끝에 붙는 힌트인데 집사 흉상(.ga, 오른쪽
     12px · 폭 64px)이 그 자리에 겹쳐 「▼ 눌러서 계속」이 얼굴 밑에 숨었다. .gt 와 같은 여백을 준다.
     ⚠️ 80 은 12(right) + 64(폭) + 4(틈) 다 — .ga 의 폭이 바뀌면 여기도 같이 바꾼다.
        폭은 `app.js nextLine()` 의 `charShot(GUIDE_CH, 64, 'head')` 가 **인라인으로** 정한다
        (인라인이 이 규칙을 이긴다). 그 인자가 96 이던 동안 이 여백은 16px 모자랐다. */
  #guide .gh{text-align:right;color:var(--dim);font-size:11px;margin-top:4px;padding-right:80px;}
  /* 집사는 3D 흉상(charshot 캔버스)이다 — 도트 보간 금지 설정을 걸지 않는다
     🔴 88 → 64 (같은 이유 — 얼굴이 대사보다 크면 띠가 얼굴 높이에 끌려 올라간다) */
  #guide .ga{position:absolute;right:12px;bottom:10px;width:64px;height:64px;opacity:.95;
    background:var(--well);border:1px solid var(--line);border-radius:8px;}

  /* 팝업 */
  #modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #modal.on{display:flex;}
  /* ⚠️ 2026-08-23 — `width:100%` 였다. 내용이 두 줄이어도 상자가 440 을 꽉 채워서
     「빈 칸을 늘려 화면을 채우는」 것처럼 보였다. 이제 **내용이 폭을 정한다.** */
  #modal .box{width:auto;min-width:min(320px,90vw);max-width:440px;max-height:80%;overflow:auto;background:var(--bg2);
    border:1px solid var(--line);border-radius:14px;padding:16px;}
  /* ★★ 2026-09-02 — 이 셋은 원래 위(캐스케이드 앞자리)에 있어서 위 일반 규칙에 졌다.
     같은 선택자 뒤 규칙이 이긴다 — 여기 일반 규칙 바로 뒤로 옮긴다(텍스트는 그대로). */
  #modal{padding:4px;}
  /* ★ 탭바가 있으면 팝업도 그 위에 앉는다 — 안 그러면 탭바가 팝업 아래 깔려 가려진다(사람 탭 팝업 실측) */
  #frame.tabs #modal{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  #modal .box.tall{padding:6px 6px calc(4px + env(safe-area-inset-bottom));max-width:none;width:100%;}

  /* ★ 설명 말풍선 — 이름을 누르면 뜬다 (2026-08-21 사용자 지시)
     「팝업으로 반투명한 말풍선에 글씨있는 그런 느낌」 */
  .tipdot{border-bottom:1px dashed #6b7686;cursor:pointer;}
  #tip{position:absolute;z-index:75;max-width:250px;padding:9px 12px;border-radius:10px;
    background:#0d1018e8;border:1px solid #4a5570;box-shadow:0 6px 22px #000a;
    backdrop-filter:blur(3px);font-size:12px;line-height:1.55;color:#e8eef7;
    animation:tipin .14s ease;pointer-events:none;}
  #tip b{color:#e0a93f;display:block;margin-bottom:3px;font-size:13px;}
  #tip:after{content:"";position:absolute;left:var(--ax,50%);bottom:-6px;margin-left:-6px;
    border:6px solid transparent;border-top-color:#4a5570;border-bottom:0;}
  @keyframes tipin{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* 토스트 */
  #toast{position:absolute;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;
    gap:6px;z-index:70;pointer-events:none;}
  #toast div{background:#000d;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;
    animation:tin .25s ease;}
  @keyframes tin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

  /* 전투 화면 */
  /* 그리기 좌표계가 540×960 고정이라 늘리면 찌그러진다 → 비율 유지 */
  #bcv{width:100%;height:100%;display:block;background:#0b0e15;object-fit:contain;}
  /* ⚠️ min-height:0 이 없으면 flex 아이템이 캔버스의 **고유 높이**(폭 844 기준 369px) 밑으로
     안 줄어들어 폰(390 높이)에서 프레임을 뚫는다 — 하단 칩이 화면 밖으로 잘리던 원인(실측). */
  #bwrap{position:relative;flex:1;min-height:0;}
  /* ★ 단추는 **아래 가운데** — 좌우 구석은 아군·적 패널(2026-09-02 확대)이 끝까지 쓴다 */
  #bhud{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;display:flex;gap:14px;align-items:center;
    justify-content:center;pointer-events:none;background:linear-gradient(#0000,#000c);}
  #bhud .btn{pointer-events:auto;}
  #bhud .sp{flex:0 0 120px;}
  /* ★★ 2026-09-02 — 위(캐스케이드 앞자리)에 있어서 위 일반 #bhud 규칙에 졌다. 뒤로 옮긴다(텍스트 그대로). */
  #bhud{padding-bottom:calc(8px + env(safe-area-inset-bottom));}

  /* 타이틀 */
  #titleui{position:absolute;left:0;right:0;bottom:0;padding:28px;text-align:center;z-index:5;}
  #titleui .tap{font-size:16px;color:#fff;text-shadow:0 2px 8px #000;animation:blink 1.4s infinite;}
  @keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* ★ 전설 주사위 이벤트 — 「영감 → 주사위 → 확정」 (설계 §10-1-보강2)
     ⚠️ 카지노풍 슬롯머신이 아니다. 대장장이의 영감이 먼저고 주사위는 그 뒤의 관문이다. */
  #lgev{position:absolute;inset:0;z-index:78;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 16px;
    background:radial-gradient(ellipse at 50% 42%,#3a2c0ccc,#000000ee 62%);
    animation:lgfade .18s ease;}
  #lgev .anvil{font-size:52px;line-height:1;filter:drop-shadow(0 0 14px #e0a93f);
    animation:lgspark .55s ease infinite alternate;}
  /* 영감의 파문 — 모루 위에 겹쳐 퍼진다(장식이라 흐름에서 뺐다) */
  #lgev .ring{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-78px 0 0 -48px;
    border-radius:50%;border:2px solid #ffd77a;animation:lgring 1.1s ease-out infinite;}
  #lgev .die{width:88px;height:88px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:700;color:#1a1206;background:linear-gradient(160deg,#ffe9b0,#d9a53c);
    border:2px solid #7a5410;box-shadow:0 8px 26px #000b, inset 0 2px 0 #fff8;}
  #lgev .die.roll{animation:lgtumble .12s linear infinite;}
  #lgev .die.lose{background:linear-gradient(160deg,#8d94a3,#4c5361);color:#1b1f27;border-color:#333a46;box-shadow:0 6px 18px #0009;}
  #lgev .cap{font-size:16px;color:#ffe2a3;text-shadow:0 2px 8px #000;letter-spacing:.5px;}
  #lgev .cap.dim{color:#98a1b2;}
  #lgev .nm{font-size:20px;font-weight:700;color:#ffd77a;text-shadow:0 0 16px #e0a93f88;animation:lgpop .3s ease;}
  #lgev .tap{font-size:11px;color:#7f8798;}
  @keyframes lgfade{from{opacity:0;}to{opacity:1;}}
  @keyframes lgspark{from{transform:scale(1) rotate(-6deg);}to{transform:scale(1.1) rotate(6deg);}}
  @keyframes lgring{from{transform:scale(.4);opacity:.9;}to{transform:scale(1.7);opacity:0;}}
  @keyframes lgtumble{0%{transform:rotate(-9deg) scale(.96);}50%{transform:rotate(8deg) scale(1.04);}100%{transform:rotate(-9deg) scale(.96);}}
  @keyframes lgpop{from{transform:scale(.7);opacity:0;}to{transform:none;opacity:1;}}
  input[type=text]{width:100%;padding:12px;border-radius:var(--r);border:1px solid var(--line);
    background:var(--well);color:var(--ink);font-size:16px;font-family:inherit;}
  .bar{height:7px;border-radius:99px;background:var(--well);border:1px solid var(--line);overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));}
  .bar.hp i{background:linear-gradient(90deg,#3d9557,#63d183);}
  .bar.exp i{background:linear-gradient(90deg,#3a63ad,#6a9be8);}
  .bar.thin{height:4px;}
  .bar.slim{height:5px;width:110px;flex:0 0 auto;}

  /* ============================================================
     ★★ 2026-08-23 대개편 — **컴팩트 원칙** (사용자 지시)
       「모든 화면구성을 이렇게 컴팩트하게 하자. 쓸데없이 칸 크게 하지말고.」
       「굳이 경험치를 가로에 꽉차게 해서 한명한명 나열했는데, 이렇게 할거면
        가운데 쯤에 스탯을 기재하던지, 다른 유용한 정보를 꽉 채워 넣라.」
     ⚠️ 그래서 목록 한 줄은 **정보를 꽉 채우고 높이는 낮다.** 가로로 늘어진 게이지는 없앤다.
     ⚠️ 그리고 **거의 모든 것이 팝업**이다 — 화면을 갈아엎지 않고 그 자리에서 끝낸다.
     ============================================================ */

  /* ── 넓은 팝업 — 「어차피 팝업으로 띄울거 가로로 더 넓어도 되는거 아닌가」 */
  #modal .box.wide{max-width:900px;}
  #modal .box.xwide{max-width:960px;max-height:92%;}
  #modal .box.pad0{padding:12px;}

  /* ★★ 화면 규격(2026-08-24) — 4단 뼈대 · 시트 · 격자 */
  /* ⚠️ 리뷰 지적(라운드1) — 여기서 overflow:hidden 을 줬었다. `.box`는 옛 openModal 도
     쓰는 **같은 요소**라 안전망(overflow:auto, game.html:261)이 사라지면 무리게이트·
     「없는 동안」처럼 목록+버튼이 긴 화면에서 **행동 버튼이 화면 밖으로 잘려 안 눌린다.**
     세로 스크롤 금지는 §2 규격상 `.k-body` 안쪽 얘기지 `.box` 자체의 안전망을 걷으란 뜻이 아니다.
     → overflow 는 손대지 않는다(261행의 auto 가 계속 산다). display:flex 만 남긴다. */
  #modal .box{display:flex;flex-direction:column;}
  .k-title{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .k-title b{font-size:19px;letter-spacing:-.4px;flex:1;}
  .k-back,.k-x{background:none;border:0;color:var(--fg2);font-size:19px;cursor:pointer;padding:0 4px;}
  .k-status{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 0;font-size:12px;color:var(--fg2);
    border-bottom:1px solid var(--line);}
  .k-body{padding:10px 0;overflow:hidden;}          /* ⚠️ 세로 스크롤 금지 — 넘치면 grid() 로 나눈다 */
  /* ⚠️ 규격 §2가 금지한 세로 스크롤의 예외. 2026-08-25 사용자 결재: 도감은 훑어보는
     화면이라 쪽 넘김이 목적을 해친다. 스크롤바는 숨기고 밀어서 넘긴다. */
  #modal .box.k-scroll-popup{overflow:hidden;}
  .k-body.k-body-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;}
  .k-body.k-body-scroll::-webkit-scrollbar{display:none;}
  /* ⚠️ 2026-08-30(mph-qa U5) — 스크롤바를 숨겼으니 **더 있다는 신호**가 없으면 잘린 화면으로
     읽힌다(캐릭터창 실측). 바닥을 살짝 바래게 해서 「아래가 더 있다」를 말한다. */
  .k-body.k-body-scroll{-webkit-mask-image:linear-gradient(#000 calc(100% - 16px),transparent);
    mask-image:linear-gradient(#000 calc(100% - 16px),transparent);}
  .k-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:10px;border-top:1px solid var(--line);}
  /* ⚠️ 수정 라운드 1(리뷰 지적 c) — 시트에 진짜 닫는 길(바깥 탭·✕)이 생겼다. 그 전엔 「닫기」가
     행동버튼 자리 하나를 먹어서, 세 번째 선택지가 12px 밑줄 글자로 밀려났다(가장 나쁜 예:
     strainGate 의 「그래도 보낸다」). 이제 각 시트는 진짜 버튼 2개만 갖는다. */
  .k-sh-bg{position:absolute;inset:0;z-index:69;background:transparent;}
  .k-sheet{position:absolute;left:0;right:0;bottom:0;z-index:70;background:var(--bg2);
    border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px 16px 16px;
    box-shadow:0 -8px 26px #000a;animation:shup .16s ease;}
  /* 🔴 2026-09-03(계획 4b Task 4) — 시트 v1 도 **탭바 위**에 앉는다. v2 는 처음부터 그랬는데
     v1 에만 이 줄이 없어서, 탭이 있는 화면에서 시트가 탭바를 덮고 제 행동 버튼(「닫기」)이
     탭 이름(「영주」) 위에 겹쳐 찍혔다(캐릭 상세 스킬 시트 실측 캡처). 같은 자로 맞춘다. */
  #frame.tabs .k-sheet{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  @keyframes shup{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}

  /* ★★ 바닥 시트 v2 · 하단 띠 · 접힘 띠 (2026-09-02 · 스펙 §3-6) */
  .k-sheet2{padding:0;max-height:calc(100% - var(--h-top) - 24px);display:flex;flex-direction:column;
    border-radius:var(--rad-sheet) var(--rad-sheet) 0 0;background:var(--c-panel);border-top:1px solid var(--c-gold);
    transition:transform .16s ease;}
  #frame.tabs .k-sheet2{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  .k2-head{height:72px;flex:0 0 72px;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3);border-bottom:1px solid var(--c-line);}
  .k2-ico{width:56px;height:56px;border-radius:var(--rad-card);background:var(--c-press);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;}
  /* 제목 + 그 아래 부제 한 줄(`head`) — 둘이 한 칸을 세로로 나눠 쓴다(kit.sheetPanel 머리말) */
  .k2-title{flex:1 1 0;min-width:0;}
  .k2-title b{display:block;font-size:var(--fs-title);color:var(--c-goldtxt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k2-head .k-x{margin-left:auto;min-width:var(--tap);min-height:var(--tap);}
  .k2-tabs{height:var(--h-seg);flex:0 0 var(--h-seg);display:flex;gap:var(--sp-1);padding:0 var(--sp-3);align-items:center;border-bottom:1px solid var(--c-line);}
  .k2-tab{flex:1;text-align:center;font-size:var(--fs-sub);padding:6px 0;border-radius:var(--rad-btn);background:var(--c-press);color:var(--c-sub);border:1px solid var(--c-line);cursor:pointer;}
  .k2-tab.on{background:#3a2c14;color:var(--c-goldtxt);border-color:var(--c-gold);}
  .k2-body{flex:1;min-height:0;overflow:hidden;padding:var(--sp-3);}
  .k2-actions{flex:0 0 auto;display:flex;gap:var(--sp-2);justify-content:flex-end;padding:var(--sp-2) var(--sp-3) calc(var(--sp-3) + env(safe-area-inset-bottom));border-top:1px solid var(--c-line);}
  .k2-actions .btn{min-height:var(--tap);}
  .k-band{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--c-panel);border-top:1px solid var(--c-gold);z-index:44;display:flex;flex-direction:column;}
  #frame.tabs .k-band{bottom:calc(var(--h-tab) + env(safe-area-inset-bottom));}
  .k-band-grip{height:12px;flex:0 0 12px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .k-band-grip::after{content:"";width:36px;height:4px;border-radius:2px;background:var(--c-line);}
  .k-band-row{flex:1;display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-3) var(--sp-1);}
  .k-band-l{flex:1;min-width:0;font-size:var(--fs-sub);color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-band-r{flex:0 0 auto;}
  /* ⚠️ `position:relative;z-index` 가 있어야 한다 — 성 탭에서는 판(`#estatewrap`)이 **자리를
     안 먹는 absolute** 라, 자리를 잡은(static) 띠는 DOM 순서와 무관하게 판 **밑에** 깔린다
     (2026-09-03 실측: 캡처에 띠가 통째로 안 보였다). 다른 화면에서는 아무 일도 안 한다. */
  .k-fold{flex:0 0 auto;position:relative;z-index:6;background:linear-gradient(180deg,var(--c-press),var(--c-band));border-bottom:1px solid var(--c-gold);}
  .k-fold-line{height:var(--h-top);display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-3);font-size:var(--fs-sub);color:var(--c-goldtxt);cursor:pointer;min-height:var(--tap);}
  .k-fold-arrow{transition:transform .16s ease;color:var(--c-sub);}
  .k-fold.open .k-fold-arrow{transform:rotate(180deg);}
  .k-fold-cards{display:flex;flex-direction:column;gap:var(--sp-2);padding:0 var(--sp-3);max-height:0;overflow:hidden;transition:max-height .16s ease;}
  .k-fold.open .k-fold-cards{max-height:260px;padding-bottom:var(--sp-3);}
  .k-fold-card{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad-card);padding:var(--sp-2) var(--sp-3);min-height:64px;}
  .k-fold-card b{font-size:var(--fs-body);color:var(--c-text);}
  .k-sh-t{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;margin-bottom:6px;}
  .k-sh-t b{flex:1;}
  .k-sh-b{font-size:13px;color:var(--fg2);line-height:1.6;}
  .k-sh-a{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
  .k-page{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:8px;font-size:13px;color:var(--fg2);}
  .k-grid{display:grid;gap:8px;}
  .k-cell{min-width:0;}
  .k-lock{opacity:.45;filter:grayscale(1);}

  /* ★★ 시트 본문 부품 — 역할 세그먼트 · 줄 · 정수 카드 (2026-09-03 · 계획 4b Task 4)
     ⚠️ 세그먼트는 **조각마다** `.k-seg` 다(묶음이 `.k-segs`) — kit.segment 머리말 참조.
        모양은 시트 탭(`.k2-tab`)과 같은 결로 맞춘다: 고른 칸만 금테, 나머지도 자리를 지킨다. */
  .k-segs{display:flex;gap:var(--sp-1);height:var(--h-seg);flex:0 0 var(--h-seg);margin-bottom:var(--sp-2);}
  .k-seg{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:3px;
    border-radius:var(--rad-btn);background:var(--c-press);border:1px solid var(--c-line);
    color:var(--c-sub);font-size:var(--fs-sub);cursor:pointer;user-select:none;}
  .k-seg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-seg.on{background:#3a2c14;color:var(--c-goldtxt);border-color:var(--c-gold);}
  .k-seg:active{filter:brightness(1.25);}
  /* ★★ 슬롯 줄 6 — 대장간·장비 도감 공용 (2026-09-04 · 4c-6 ruling 9). 칸마다 `.k-slot`(묶음 `.k-slotrow`) */
  .k-slotrow{display:flex;gap:var(--sp-1);height:var(--tap);flex:0 0 var(--tap);margin-bottom:var(--sp-2);}
  .k-slot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border-radius:var(--rad-btn);background:var(--c-press);border:1px solid var(--c-line);
    color:var(--c-sub);cursor:pointer;user-select:none;}
  .k-slot .nm{font-size:var(--fs-note);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-slot.on{background:#3a2c14;color:var(--c-goldtxt);border-color:var(--c-gold);}
  .k-slot:active{filter:brightness(1.25);}
  /* 격자 안의 묶음 머리 — 한 줄을 다 쓴다(kit.grid `{ head }` · 4c-6) */
  .k-cell.wide{grid-column:1/-1;}

  /* ★★ 도감 화면 — 정수·장비 (2026-09-04 · 4c-6 · 목업 C3). 세로 스크롤 없음 — 격자가 쪽을 넘긴다 */
  .cx{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--sp-2) var(--sp-3) 0;}
  .cx-head{flex:0 0 auto;margin-bottom:var(--sp-1);}
  .cx-head b{display:block;font-size:var(--fs-title);font-weight:800;color:var(--c-goldtxt);}
  .cx-head .sub{display:block;font-size:var(--fs-sub);color:var(--c-sub);margin-bottom:var(--sp-2);}
  .cx-body{flex:1;min-height:0;overflow:hidden;}
  .cx-card{position:relative;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border-radius:var(--rad-card);border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);
    cursor:pointer;overflow:hidden;padding:0 var(--sp-1);}
  .cx-card:active{filter:brightness(1.25);}
  .cx-card .nm{font-size:var(--fs-sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cx-card .ln{font-size:var(--fs-note);color:var(--c-sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cx-card .st{font-size:var(--fs-note);color:var(--c-goldtxt);}
  .cx-card.dim{opacity:.5;}
  .cx-card.unk{background:var(--c-band);border-style:dashed;color:var(--c-sub);cursor:default;}
  /* 정수 카드의 종 얼굴 — 실루엣 칸과 같은 지름 40 (4c-6 T1b · M1) */
  .cx-card img{width:40px;height:40px;flex:0 0 auto;border-radius:50%;object-fit:cover;background:var(--c-press);}
  .cx-card .sil{width:40px;height:40px;border-radius:50%;background:var(--c-press);display:flex;align-items:center;
    justify-content:center;font-size:var(--fs-num);font-weight:700;color:var(--c-sub);}
  .cx-card .new{position:absolute;top:2px;right:2px;height:16px;padding:0 5px;border-radius:var(--rad-chip);
    background:var(--c-ok);color:var(--c-text);font-size:var(--fs-note);font-weight:700;display:flex;align-items:center;}
  /* ★★ 명예의 전당 화면 (2026-09-05 · 4c-6 T2 · 목업 D3). 장치 0 — 내 최고 카드 고정 + 직업별 1등 줄(쪽 8). 세로 스크롤 없음 */
  .hl{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--sp-2) var(--sp-3) 0;}
  .hl-head{flex:0 0 auto;margin-bottom:var(--sp-2);}
  .hl-head b{display:block;font-size:var(--fs-title);font-weight:800;color:var(--c-goldtxt);}
  .hl-head .sub{display:block;font-size:var(--fs-sub);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
  .hl-body .k-grid{gap:6px;}
  /* 초상 40 — 세로로 긴 초상화 캔버스를 둥근 40 칸에 맞춰 자른다(얼굴은 위쪽이다) */
  .hl .fc,.hl-srow .fc{flex:0 0 40px;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--c-press);
    display:flex;align-items:flex-start;justify-content:center;color:var(--c-sub);}
  .hl .fc canvas,.hl-srow .fc canvas{display:block;}
  .hl .fc svg,.hl-srow .fc svg{margin-top:0;}
  /* 내 최고 카드 — 금테. 오른쪽은 순위 숫자 대신 「내가 잡은 칸 m/n」 */
  .hl-mine{flex:0 0 auto;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2);margin-bottom:var(--sp-2);
    border-radius:var(--rad-card);border:1px solid var(--c-gold);background:var(--c-press);color:var(--c-text);cursor:pointer;}
  .hl-mine:active{filter:brightness(1.25);}
  .hl-mine.none{border-color:var(--c-line);border-style:dashed;cursor:default;}
  .hl-mine .fc{border:2px solid var(--c-gold);width:44px;height:44px;flex-basis:44px;}
  .hl-mine.none .fc{border-color:var(--c-line);align-items:center;}
  .hl-mine .mid{flex:1 1 0;min-width:0;}
  .hl-mine .nm{display:block;font-size:var(--fs-body);font-weight:800;color:var(--c-goldtxt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-mine .ds{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-mine .rt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
  .hl-mine .rt .tag{font-size:var(--fs-note);color:var(--c-sub);}
  .hl-mine .rt b{font-size:var(--fs-num);font-weight:800;color:var(--c-goldtxt);}
  /* 직업별 1등 한 줄 — 초상 · 직업 · 이름(굵게) · 영주 『』 Lv · 전투력. 내가 1등이면 금테 */
  .hl-row{display:flex;align-items:center;gap:var(--sp-2);height:48px;padding:0 var(--sp-2);
    border-radius:var(--rad-card);border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);cursor:pointer;}
  .hl-row:active{filter:brightness(1.25);}
  .hl-row.mine{border-color:var(--c-gold);background:var(--c-press);}
  .hl-row.mine .fc{box-shadow:0 0 0 2px var(--c-gold);}
  /* 직업 칸 — 가장 긴 이름이 네 글자(수호기사·원소술사·드루이드)라 52 (실측: 44 면 「수호…」로 잘렸다) */
  .hl-row .cls{flex:0 0 52px;font-size:var(--fs-sub);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-row .mid{flex:1 1 0;min-width:0;}
  .hl-row .nm{display:block;font-size:var(--fs-body);font-weight:700;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-row.mine .nm{color:var(--c-goldtxt);}
  .hl-row .ds{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hl-row .pw{flex:0 0 auto;font-size:var(--fs-num);font-weight:800;color:var(--c-goldtxt);}
  /* 순위 시트의 줄 — `.k-srow` 위에 초상 칸과 1등 표시만 더한다 */
  .hl-srow.top{border-color:var(--c-gold);}
  .hl-srow .nm .sub{font-size:var(--fs-note);color:var(--c-sub);}
  /* ⚠️ 시트 본문의 줄은 `.k-srow` 다 — `.k-row`(kit.charRow) 를 안 쓴다. 그쪽은 `.item` 과
     함께 달려 모양을 이미 얻고 있어서, 같은 이름에 규칙을 새로 주면 시설 시트의 사람 줄까지
     이번 계획이 모르는 사이에 바뀐다. 새 이름으로 갈라 둔다. */
  /* ⚠️ `position:relative` — 전설 확정 ★(`legendMark`, `.lgmark`)가 절대배치라 기준칸이 없으면
     시트 밖으로 튄다(scr.gear.js: 「부모는 position:relative 여야 한다」). */
  .k-srow{position:relative;display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);
    padding:var(--sp-1) var(--sp-2);border-radius:var(--rad-card);
    border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);
    font-size:var(--fs-sub);cursor:pointer;}
  .k-srow:active{filter:brightness(1.25);}
  .k-srow.dim{opacity:.45;cursor:default;}
  .k-srow .mid{flex:1 1 0;min-width:0;}
  .k-srow .nm{font-size:var(--fs-body);color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-srow .ds{font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-srow .mats{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin-top:2px;}
  .k-srow .rt{flex:0 0 auto;font-size:var(--fs-sub);font-weight:700;color:var(--c-goldtxt);}
  .k-srow .rt.take{color:var(--c-warn);}
  /* 정수 카드 3열 — 계열 그림 · 이름 · 계열 이름 · ★ · 「×n」/「만들기」 배지 */
  .k-ecard{position:relative;height:84px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;border-radius:var(--rad-card);border:1px solid var(--c-line);
    background:var(--c-panel);color:var(--c-text);cursor:pointer;overflow:hidden;padding:0 var(--sp-1);}
  .k-ecard:active{filter:brightness(1.25);}
  .k-ecard .nm{font-size:var(--fs-note);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-ecard .ln{font-size:var(--fs-note);color:var(--c-sub);}
  .k-ecard .st{font-size:var(--fs-note);color:var(--c-goldtxt);}
  .k-ecard .bd{position:absolute;top:2px;right:2px;height:16px;padding:0 5px;border-radius:var(--rad-chip);
    background:var(--c-press);border:1px solid var(--c-line);color:var(--c-text);
    font-size:var(--fs-note);display:flex;align-items:center;}
  .k-ecard .bd.make{background:var(--c-gold);border-color:var(--c-gold);color:var(--c-bg);font-weight:700;}
  /* 시트 제목 밑 부제 한 줄 — 「지금 낀 것」·「1번 · 액티브 칸 · 한번 끼면 못 뺀다」.
     ⚠️ **한 줄이다.** 두 줄이 되면 머리(72)가 넘쳐 탭 줄을 밀어낸다 — 넘치면 …로 자른다. */
  .k-shead{font-size:var(--fs-note);color:var(--c-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ⚠️ `.k2-title b` 규칙이 **여기 안의 b 까지** 잡는다(자손 선택자) — 제목 크기·block 을
     그대로 물려받아 부제가 20px 짜리 둘째 줄이 됐다(첫 캡처). 여기서 되돌린다. */
  .k-shead b{display:inline;font-size:var(--fs-note);color:var(--c-goldtxt);font-weight:700;}

  /* ★★ 사람 탭 부품 — groupHead·charCard·groupGrid (2026-09-03 · 사람 탭 계획 4a task-1) */
  .k-groups{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;   /* scroll-ok: 사람 탭의 유일한 세로 스크롤 */
    padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2);}
  /* ★ 4c-5(2026-09-04) — 시트 본문의 **설명 한 줄**(아이콘 + 글). 확인창(`confirmSheet`)·행동 문 넷이 쓴다.
     누르는 줄(.k-srow)이 아니다 — 검사(SHEET_SEL)에 안 걸리게 이름을 따로 둔다. 색은 tone 넷만. */
  .k-line{display:flex;align-items:flex-start;gap:var(--sp-1);padding:3px 0;font-size:var(--fs-sub);line-height:1.45;color:var(--c-text);word-break:keep-all;}
  .k-line > .ic{flex:0 0 auto;margin-top:2px;}
  .k-line > span:last-child{min-width:0;}
  .k-line.ok{color:var(--c-ok);}
  .k-line.warn{color:var(--c-warn);}
  .k-line.sub{color:var(--c-sub);font-size:var(--fs-note);}
  .k-ghead{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:var(--sp-2);}
  .k-ghead.dim{opacity:.45;}
  .k-ghead .title{font-size:var(--fs-body);font-weight:700;color:var(--c-goldtxt);}
  .k-ghead .count{font-size:var(--fs-sub);color:var(--c-sub);}
  /* 묶음 머리의 곁말 — 「왜 여기 없나」 한 마디 (4c-6 T1b · M4). 길면 잘린다(줄은 하나다) */
  .k-ghead .note{min-width:0;font-size:var(--fs-note);color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-ghead::after{content:"";flex:1;height:1px;background:var(--c-line);}
  .k-cards{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:var(--sp-2);}
  .k-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--c-panel);border:1px solid var(--c-line);border-radius:var(--rad-card);
    padding:var(--sp-2) var(--sp-1) 6px;touch-action:pan-y;cursor:pointer;}
  .k-card.dim{opacity:.45;}
  /* ⚠️ 수정 라운드 1(리뷰 지적 2) — where 칩(우하단, 높이 24)이 절대배치라 sub/별줄과 겹쳤다.
     where 가 있는 카드는 바닥에 칩 자리를 미리 비워 둔다(내용은 흐름대로, 칩만 그 여백에 앉는다). */
  .k-card.has-where{padding-bottom:30px;}
  .k-card .k-cd-face{width:48px;height:48px;border-radius:var(--rad-card);overflow:hidden;background:var(--c-press);}
  .k-card .k-cd-name{font-size:var(--fs-body);color:var(--c-text);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* ⚠️ `word-break:keep-all` — 한글은 기본값이 **음절마다** 끊긴다. 훈련장 픽커의 둘째 줄
     (「법사 Lv.1 · 효율 ×0.83」)이 3열 폭에서 「효 / 율 ×0.83」으로 갈라졌다(실측 캡처).
     낱말 사이(빈칸)에서만 끊게 한다 — 「효율」과 숫자는 U+00A0 으로 묶여 있어 같이 내려간다. */
  .k-card .k-cd-sub{font-size:var(--fs-sub);color:var(--c-sub);word-break:keep-all;text-align:center;}
  .k-card .k-cd-stars{display:flex;gap:1px;}
  /* ⚠️ 최종 리뷰 M1(2026-09-03) — 글자색은 **토큰만** 쓴다(계획 Task 1 Step 3). 이번 가지가
     새로 들인 `#fff` 리터럴 하나를 `--c-text` 로 돌린다. 경고 배경 위 밝은 잉크라 읽힌다.
     ⚠️ 파일 안의 다른 `#fff` 넷(120·260·343·601)은 이번 가지가 만든 것이 아니라 그대로 둔다. */
  .k-card .bd-tr{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:var(--rad-chip);
    background:var(--c-warn);color:var(--c-text);font-size:var(--fs-note);font-weight:700;display:flex;align-items:center;justify-content:center;}
  .k-card .bd-br{position:absolute;bottom:2px;right:2px;height:24px;max-width:70%;padding:0 6px;
    border-radius:var(--rad-chip);background:var(--c-press);border:1px solid var(--c-line);color:var(--c-text);
    font-size:var(--fs-note);display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ★★ 사람 탭 — 조 패널 · 칸 · 드래그 유령 (2026-09-03 · 사람 탭 계획 4a task-3)
     ⚠️ 세로 스크롤은 위 `.k-groups` 하나뿐이다 — `.k-people` 은 자리만 나눈다(스크롤 없음). */
  .k-people{flex:1;min-height:0;display:flex;flex-direction:column;}
  .k-squad{flex:0 0 auto;background:var(--c-band);border-bottom:1px solid var(--c-line);
    padding:var(--sp-2) var(--sp-3);}
  /* 머리줄은 **네 칸 고정**이다 — [‹][이름·상태][›][행동]. flex 로 두면 행동 단추의 유무·너비에
     따라 ‹ › 가 좌우로 튀어, 연달아 누르는 자리에서 손가락이 헛나간다(수정 라운드 2 · I6). */
  .k-squad .hd{display:grid;grid-template-columns:var(--tap) minmax(0,1fr) var(--tap) 56px;
    align-items:center;gap:var(--sp-2);}
  .k-squad .hd>.btn{width:100%;padding-left:0;padding-right:0;}
  .k-squad .mid{flex:1 1 0;min-width:0;text-align:center;}
  .k-squad .mid b{display:block;font-size:var(--fs-body);font-weight:700;color:var(--c-goldtxt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-squad .mid span{display:block;font-size:var(--fs-sub);color:var(--c-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .k-arrow{flex:0 0 auto;width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;
    border-radius:var(--rad-btn);border:1px solid var(--c-line);background:var(--c-panel);
    color:var(--c-goldtxt);font-size:var(--fs-title);cursor:pointer;user-select:none;}
  .k-arrow:active{filter:brightness(1.25);}
  .btn.sm{padding:6px 10px;font-size:var(--fs-sub);}
  .k-slots{display:flex;gap:var(--sp-2);margin-top:var(--sp-2);}
  .k-slot{flex:0 1 48px;height:48px;min-width:0;border-radius:var(--rad-card);
    border:1px dashed var(--c-line);background:var(--c-press);color:var(--c-sub);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    cursor:pointer;touch-action:none;}
  .k-slot.on{border-style:solid;}
  /* 카드를 집으면 넣을 수 있는 칸이 스스로 밝아진다 — 「어디에 놓나」를 글로 설명하지 않는다 */
  .k-slot.hot{border-style:solid;border-color:var(--c-gold);}
  .k-slot.over{border-color:var(--c-gold);background:var(--c-line);}
  .k-card.picked{border-color:var(--c-gold);box-shadow:inset 0 0 0 1px var(--c-gold);}
  .k-drag-ghost{position:fixed;z-index:90;width:48px;height:48px;pointer-events:none;
    border-radius:var(--rad-card);overflow:hidden;border:1px solid var(--c-gold);
    background:var(--c-panel);opacity:.85;transform:translate(-50%,-50%);}

  /* ★★ 캐릭 상세 — **판을 통째로 쓰는 화면** (2026-09-03 · 계획 4b Task 3 · 목업 D1)
     위에서 머리 → 무대(3D 전신 + 좌우 장비 6칸) → 칸 5 → 능력치 2×5 → 상태 한 줄 → 주 단추.
     ⚠️ **세로 스크롤이 없다.** 남는 높이는 전부 무대(.cd-stage-wrap)가 먹는다 — 사람이 커야
        「살아 있다」가 읽힌다(목표 240px 이상, 390×844 에서 실측 290px 안팎).
     ⚠️ 장비 칸은 무대 **위에 얹는다**(자리를 빼앗지 않는다). 캔버스가 좁아지면 직교 카메라의
        가로 시야가 같이 좁아져 긴 무기가 판 밖으로 잘린다(charstage Task 1 보고 ③). */
  .cd{flex:1;min-height:0;display:flex;flex-direction:column;}
  /* ★ 4c-4(2026-09-04) — 머리 **위** 「닫기」 한 줄(28px). 시설·전당·숙소에서 온 사람이 직전 화면으로
     돌아가는 문 — 머리의 ‹ ›(옆 사람)가 「뒤로」로 오독됐다(QA). paint() 가 안 갈아 끼우는 고정 줄. */
  .cd-top{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center;height:28px;padding:0 var(--sp-2);}
  .cd-close{display:flex;align-items:center;gap:4px;height:24px;padding:0 var(--sp-2);border-radius:12px;
    color:var(--c-sub);font-size:var(--fs-sub);background:var(--c-press);cursor:pointer;user-select:none;}
  .cd-close:active{filter:brightness(1.25);}
  .cd-headwrap{flex:0 0 auto;padding:var(--sp-1) var(--sp-2) 0;}
  .cd-head{display:grid;grid-template-columns:var(--tap) minmax(0,1fr) var(--tap);
    align-items:center;gap:var(--sp-1);}
  .cd-head .mid{min-width:0;text-align:center;}
  .cd-head .mid b{display:block;font-size:var(--fs-title);font-weight:800;color:var(--c-goldtxt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-head .mid .sub{display:block;font-size:var(--fs-sub);color:var(--c-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-arrow{width:var(--tap);height:var(--tap);display:flex;align-items:center;justify-content:center;
    border-radius:var(--rad-btn);border:1px solid var(--c-line);background:var(--c-panel);
    color:var(--c-goldtxt);font-size:var(--fs-title);cursor:pointer;user-select:none;}
  .cd-arrow:active{filter:brightness(1.25);}

  /* 무대 — 남는 높이를 다 먹는다 */
  .cd-stage-wrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
    margin:var(--sp-1) var(--sp-2);border-radius:var(--rad-card);border:1px solid var(--c-line);
    background:radial-gradient(ellipse 74% 60% at 50% 62%,var(--c-press) 0%,var(--c-band) 58%,var(--c-bg) 100%);}
  /* 🔴 발밑 단상 — 결재 구도(pitch 0.07)에선 검은 접지 그림자가 검은 판 위에 얹혀 안 읽힌다
     (charstage Task 1 보고 ①). 밝은 타원을 **캔버스 뒤**에 깔아 사람이 바닥에 선 것으로 읽히게 한다.
     자리는 계산값이다 — 발(y=0)은 무대 프레임의 위에서 95.1% 지점이다. */
  .cd-plinth{position:absolute;left:50%;top:95%;width:58%;height:13%;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse at center,var(--c-line) 0%,var(--c-line) 24%,var(--c-press) 50%,transparent 74%);}
  .cd-hint{position:absolute;left:var(--sp-2);bottom:var(--sp-1);font-size:var(--fs-note);
    color:var(--c-sub);pointer-events:none;opacity:.75;}
  .cd-gear{position:absolute;top:var(--sp-2);display:flex;flex-direction:column;gap:var(--sp-2);}
  .cd-gear.l{left:var(--sp-2);} .cd-gear.r{right:var(--sp-2);}
  .cd-slot{position:relative;width:56px;height:56px;border-radius:var(--rad-card);
    border:1px dashed var(--c-line);background:var(--c-panel);color:var(--c-sub);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    cursor:pointer;user-select:none;}
  .cd-slot.on{border-style:solid;border-color:var(--c-gold);color:var(--c-text);background:var(--c-press);}
  .cd-slot:active{filter:brightness(1.25);}
  .cd-slot .nm{font-size:var(--fs-note);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-slot .cd-plus{position:absolute;right:2px;bottom:2px;font-size:var(--fs-note);font-weight:700;
    color:var(--c-goldtxt);}
  .cd-bang{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:var(--rad-chip);
    background:var(--c-warn);color:var(--c-text);font-size:var(--fs-note);font-weight:700;
    display:flex;align-items:center;justify-content:center;}

  /* 칸 5 — 정수 3 + 스킬 2 */
  .cd-cellwrap{flex:0 0 auto;margin:0 var(--sp-2);
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-1);}
  .cd-cell{height:64px;border-radius:var(--rad-card);border:1px solid var(--c-line);
    background:var(--c-panel);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;cursor:pointer;overflow:hidden;color:var(--c-text);}
  .cd-cell.empty{border-style:dashed;color:var(--c-sub);background:transparent;}
  /* 「직업 기술」 칸 — **보여 주기만 하는 칸**이다(전투에 안 나간다). 눌러 보기 전에
     「이건 지금 나가는 게 아니다」가 읽혀야 한다(수정 라운드 1 · m-2). */
  .cd-cell.dim{opacity:.5;}
  .cd-cell:active{filter:brightness(1.25);}
  .cd-cell .fc{width:26px;height:26px;border-radius:var(--rad-chip);overflow:hidden;background:var(--c-press);}
  .cd-cell .fc img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .cd-cell .nm{font-size:var(--fs-note);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-cell .st{font-size:var(--fs-note);color:var(--c-goldtxt);}
  .cd-cell .st.sub{color:var(--c-sub);}

  /* 능력치 2×5 — 가운데가 LV 원 */
  .cd-statwrap{flex:0 0 auto;padding:var(--sp-1) var(--sp-2) 0;}
  .cd-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-1);align-items:center;}
  .cd-stat{position:relative;height:48px;border-radius:var(--rad-card);border:1px solid var(--c-line);
    background:var(--c-panel);display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;overflow:hidden;}
  .cd-stat.flat{cursor:default;}
  .cd-stat.wide{grid-column:span 2;}
  .cd-stat.main{border-color:var(--c-gold);}
  .cd-stat.hot{border-color:var(--c-ok);}
  .cd-stat .k{font-size:var(--fs-note);color:var(--c-sub);}
  .cd-stat .v{font-size:var(--fs-num);font-weight:800;color:var(--c-text);font-variant-numeric:tabular-nums;}
  .cd-stat.main .v{color:var(--c-goldtxt);}
  .cd-stat .pl{margin-left:var(--sp-1);color:var(--c-ok);font-size:var(--fs-body);font-weight:800;}
  .cd-lv{width:56px;height:56px;margin:0 auto;border-radius:50%;border:2px solid var(--c-gold);
    background:var(--c-press);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .cd-lv span{font-size:var(--fs-note);color:var(--c-sub);line-height:1;}
  .cd-lv b{font-size:var(--fs-num);font-weight:800;color:var(--c-goldtxt);line-height:1.1;}

  /* 상태 한 줄 · 주 단추 */
  .cd-linewrap{flex:0 0 auto;padding:var(--sp-1) var(--sp-2) 0;}
  .cd-line{text-align:center;font-size:var(--fs-sub);color:var(--c-sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cd-footwrap{flex:0 0 auto;padding:var(--sp-1) var(--sp-2) var(--sp-2);}
  .cd-foot{display:flex;align-items:center;gap:var(--sp-2);}
  .cd-btn{flex:0 0 auto;height:var(--tap);padding:0 var(--sp-3);border-radius:var(--rad-btn);
    border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-text);
    font-size:var(--fs-sub);font-weight:700;display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;}
  .cd-btn:active{filter:brightness(1.25);}
  .cd-main{flex:1 1 0;min-width:0;height:var(--tap);font-size:var(--fs-body);}
  /* 🔴 수정 라운드 1(m-4) — **짧은 판에서 사람이 너무 작아진다.** 390×640 실측 158.6px.
     ⚠️ `.cd-stage` 에 `min-height` 를 거는 길은 **안 썼다.** 무대 상자는 `overflow:hidden` 이라
        캔버스만 키우면 남는 만큼 **발밑이 잘리고**(위에서부터 놓인다), 발 자리에 맞춰 놓은
        단상(`.cd-plinth`, 상자의 95%)이 사람과 어긋난다 — 작아지는 것보다 나쁘다.
     → 대신 **고정 줄들을 줄여 무대에 자리를 돌려준다.** 짧은 판에서만 돈다. */
  @media (max-height: 720px){
    .cd-stage-wrap{margin:0 var(--sp-2);}
    .cd-head{grid-template-columns:36px minmax(0,1fr) 36px;}
    .cd-arrow{width:36px;height:36px;}
    .cd-headwrap{padding-top:0;}
    /* ⚠️ 칸은 **세 줄**이다(아이콘 20 + 이름 + ★/갈래). 46px 로 조였더니 셋째 줄이 잘렸다
       (실측 캡처가 잡았다) — 줄 간격만 조이고 높이는 세 줄이 들어가는 56 으로 둔다. */
    .cd-cell{height:56px;gap:0;line-height:1;}
    .cd-cell .fc{width:20px;height:20px;}
    .cd-stat{height:34px;}
    .cd-lv{width:44px;height:44px;}
    .cd-linewrap{padding-top:0;}
    .cd-btn,.cd-main{height:38px;}
    .cd-footwrap{padding:2px var(--sp-2) var(--sp-1);}
  }

  /* ── 분류 메뉴 두 단 — 1차(카테고리) · 2차(값) · 3차(정렬) */
  .mbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px;}
  .mbar>.lb{font-size:10px;color:var(--dim);flex:0 0 auto;letter-spacing:.5px;}
  /* 한 줄에 편 필터의 칸막이 — 「분류 … │ 값 … │ 정렬 …」 */
  .mbar>.sep{flex:0 0 auto;width:1px;height:15px;background:var(--line);margin:0 3px;}
  .mtab{font-size:12px;font-weight:700;padding:4px 11px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#00000030;color:var(--dim);user-select:none;white-space:nowrap;}
  .mtab.on{background:linear-gradient(var(--gold-hi),var(--gold-lo));border-color:var(--gold-bd);color:var(--gold-ink);}
  .mtab.blue.on{background:linear-gradient(#6a9be8,#3a63ad);border-color:#294a86;color:#f2f7ff;}
  .mtab.dim{opacity:.38;}
  .mtab .n{font-size:10px;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums;}
  .mtab .ar{font-size:9px;margin-left:3px;}

  /* ── 컴팩트 목록 한 줄 — 얼굴 / 이름·부제 / 스탯 4칸 / 오른쪽 값 */
  .crow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:4px 8px;cursor:pointer;min-height:0;}
  .crow:active{filter:brightness(1.2);}
  .crow.sel{border-color:var(--gold);background:#241d10;}
  .crow.off{opacity:.42;}
  .crow .fc{width:34px;height:34px;border-radius:6px;background:var(--well);border:1px solid var(--line);
    overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .crow .fc img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .crow .mid{flex:1 1 0;min-width:0;}
  .crow .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;}
  .crow .ds{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;}
  /* 스탯 띠 — 「가운데 쯤에 스탯을 기재하던지」 */
  /* 목록 한 줄의 셋째 단 — 가로로 늘어지던 경험치 바를 대신한다(2026-08-23) */
  .minfo{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:10px;color:var(--dim);
    font-variant-numeric:tabular-nums;}
  .minfo .gdot{opacity:.28;filter:grayscale(1);font-size:11px;line-height:1;}
  .minfo .gdot.on{opacity:1;filter:none;}
  .minfo .sep2{width:1px;height:9px;background:var(--line);}
  .sbar{display:flex;gap:0;flex:0 0 auto;}
  .sbar .sc{width:34px;text-align:center;line-height:1.1;}
  .sbar .sk{font-size:8px;color:#6b7686;letter-spacing:.3px;}
  .sbar .sv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;}
  .sbar .sc.hi .sv{color:var(--gold2);}
  .crow .rt{flex:0 0 auto;text-align:right;line-height:1.2;}
  .crow .rt .pw{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
  .crow .rt .st{font-size:10px;}
  .tag{display:inline-block;font-size:9px;padding:0 5px;border-radius:4px;background:var(--well);
    border:1px solid var(--line);color:var(--dim);margin-right:3px;vertical-align:1px;}
  .tag.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold-bd);font-weight:800;}
  .tag.red{background:#3a1919;color:#e04b4b;border-color:#6d2020;}
  .tag.warn{background:#3a2419;color:#e0a93f;border-color:#6d4a20;}
  .tag.cy{background:#122a33;color:var(--cyan);border-color:#2b5766;}

  /* ── 챕터 카드 5장 (원정 첫 화면) */
  /* ⚠️ 다섯 장이 **프레임을 꽉 채워야** 「여기가 원정의 전부」로 읽힌다.
     처음엔 카드 높이를 내용에 맡겼더니 위쪽 띠만 쓰고 아래가 통째로 비었다(실측). */
  #chaps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;height:calc(100% - 52px);min-height:380px;}
  .chap{position:relative;border-radius:12px;border:1px solid var(--line);overflow:hidden;cursor:pointer;
    background:linear-gradient(165deg,#2b3146,#161a26);display:flex;flex-direction:column;}
  .chap:active{filter:brightness(1.2);}
  .chap.lock{opacity:.45;}
  .chap .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--well);}
  .chap .art img,.chap .art canvas{width:70%;max-width:150px;height:auto;object-fit:contain;image-rendering:pixelated;}
  .chap .ttl{font-size:13px;font-weight:800;padding:6px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chap .tn{font-size:9.5px;color:var(--dim);padding:1px 8px 0;height:24px;line-height:1.25;overflow:hidden;}
  .chap .pg{padding:5px 8px 7px;font-size:10px;color:var(--dim);}
  .chap .no{position:absolute;top:5px;left:6px;font-size:10px;font-weight:900;color:var(--gold-ink);
    background:var(--gold);border-radius:5px;padding:0 6px;}
  .chap .bossck{position:absolute;top:5px;right:6px;font-size:12px;}

  /* 난이도 아이콘 3개 */
  #modes{display:flex;gap:6px;align-items:center;}
  .mode{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:#00000040;font-size:12px;font-weight:700;color:var(--dim);}
  .mode .ic{font-size:14px;}
  .mode.on{color:#fff;}
  .mode.lock{opacity:.4;}

  /* ── 스테이지 지도 (챕터 팝업) — 길로 이어진 12칸 */
  .stmap{position:relative;padding:6px 2px 2px;}
  .stmap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .stmap .rowz{display:flex;justify-content:space-between;gap:6px;position:relative;z-index:1;margin-bottom:14px;}
  .snode{width:74px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    padding:4px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;}
  .snode:active{filter:brightness(1.25);}
  .snode.lock{opacity:.4;}
  .snode.done{border-color:#2c6b3e;background:#16241b;}
  .snode.boss{border-color:#6d2020;background:#241416;}
  .snode.elite{border-color:#6d5320;}
  .snode .n{font-size:11px;font-weight:800;line-height:1;}
  .snode .p{width:42px;height:42px;border-radius:7px;overflow:hidden;background:var(--well);
    display:flex;align-items:center;justify-content:center;}
  .snode .p img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .snode .c{font-size:9px;color:var(--dim);line-height:1;}
  .snode .ok{position:absolute;top:2px;right:4px;font-size:9px;color:var(--green);font-weight:900;}
  .snode .go{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:99px;
    background:var(--gold);color:var(--gold-ink);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;}

  /* ── 아이콘 격자 (창고·도감·정수·재료) */
  .igrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;}
  .igrid.w8{grid-template-columns:repeat(8,minmax(0,1fr));}
  .igrid.w6{grid-template-columns:repeat(6,minmax(0,1fr));}
  .icell{position:relative;aspect-ratio:1/1;border-radius:8px;background:var(--well);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
  .icell:active{filter:brightness(1.3);}
  .icell img{width:84%;height:84%;object-fit:contain;image-rendering:pixelated;}
  .icell .em{font-size:22px;}
  .icell .qty{position:absolute;right:2px;bottom:1px;font-size:10px;font-weight:800;color:#fff;
    text-shadow:0 0 3px #000,0 0 3px #000;font-variant-numeric:tabular-nums;}
  .icell .gr{position:absolute;left:2px;top:1px;font-size:8px;color:var(--gold2);font-weight:800;}
  .icell.un{opacity:.35;}
  .icell.un img{filter:brightness(0);}
  .icap{font-size:9px;color:var(--dim);text-align:center;margin-top:2px;line-height:1.1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ── 빈 칸 ⊕ (부대·정수·장비) */
  .plusdot{width:26px;height:26px;border-radius:99px;border:1.5px dashed #5b6577;color:#7d879a;
    display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;}
  .plusdot:active{border-color:var(--gold);color:var(--gold2);}

  /* ── 상태창(넓은 팝업) 3단 */
  .cm3{display:grid;grid-template-columns:186px 1fr 250px;gap:10px;align-items:start;}
  .cmhead{display:flex;gap:10px;align-items:flex-start;}
  .cmportrait{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;
    background:var(--well);border:1px solid var(--line);flex:0 0 auto;}
  .cmportrait img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  /* ★ 초상화 액자 (2026-08-30) — 얼굴이 들어오니 「사진」처럼 보여야 한다.
     금테 한 겹 + 위아래 옅은 명암으로 액자에 끼운 느낌을 낸다. */
  /* 🔴 액자 치수는 **테두리를 더한 값**이다. `*{box-sizing:border-box}` 라서
     width 에 테두리 2px 이 포함된다 — 88px 로 두면 속이 84px 이 되어 92px 캔버스의
     오른쪽·아래가 `overflow:hidden` 에 **4px 씩 잘리고 인물이 한쪽으로 밀린다**
     (mph-qa 가 줄마다 좌21/우17 로 재서 잡았다). 속 92×92 + 테두리 2 = 96×96.
     ⚠️ 2026-08-30 얼굴을 LPC 파츠에서 **우리 종족 아트**로 갈면서 액자가 정사각이 됐다
     (`raceface.gen.js` FACE_BOX 92×92). 속 높이를 88 로 두면 턱이 잘린다.
     ⚠️ 여기 「96 을 넘기면 경험치 막대가 사라진다」고 적혀 있었는데 **그 안전선은 틀렸다.**
        2026-08-30 mph-qa 실측 — 폰(844×390)에서는 **액자가 92 일 때도 이미** 경험치 막대·
        기타 열 아래쪽·시너지 줄이 모달 밖으로 잘려 있었다. 액자 탓이 아니라 **모달이
        폰 세로에 안 맞는 것**이다(별도 항목 · `_기획/00_미반영.md`). 그러니 96 은
        「넘으면 큰일나는 선」이 아니라 **지금 이 액자가 그 값이라는 사실**일 뿐이다.
        바꿀 땐 `tools/bake-raceface.mjs` 의 `BOX` 도 같이 바꿔라(속 = 이 값 − 테두리 4). */
  .cmportrait.framed{width:96px;height:96px;border:2px solid var(--gold);border-radius:8px;
    background:linear-gradient(#20293a,#141926);box-shadow:inset 0 0 0 1px #0008,0 2px 6px #0007;}
  .cmportrait.framed canvas{display:block;}
  .cmportrait .ovstar{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:12px;
    background:linear-gradient(#0000,#000c);padding:2px 0 1px;letter-spacing:-1px;}
  /* 이름은 사진 아래 한 줄 — 열 폭(186px)을 다 쓰고 넘치면 … (감기지 않는다) */
  .cmtitle{font-size:19px;font-weight:900;letter-spacing:-.5px;line-height:1.2;color:#fff;margin-top:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cmid .lv{font-size:13px;font-weight:700;color:var(--gold2);}
  .cmid .cls{font-size:13px;font-weight:700;color:#cdd8e6;}
  .cmid .rc{font-size:11px;color:var(--dim);}
  .statrow{display:flex;align-items:center;gap:6px;padding:2px 6px;border-radius:5px;}
  .statrow:nth-child(odd){background:#ffffff08;}
  .statrow .k{font-size:11px;color:var(--dim);font-weight:800;letter-spacing:.5px;width:32px;flex:0 0 auto;}
  .statrow .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;width:34px;text-align:right;}
  .statrow .g{flex:1;height:5px;border-radius:99px;background:var(--well);overflow:hidden;}
  .statrow .g i{display:block;height:100%;background:linear-gradient(90deg,#3a63ad,#6a9be8);}
  .statrow .pl{font-size:11px;font-weight:900;color:var(--gold-ink);background:var(--gold);border-radius:4px;
    padding:0 6px;cursor:pointer;flex:0 0 auto;}
  .secttl{font-size:11px;font-weight:800;color:var(--gold2);letter-spacing:.5px;margin:0 0 4px;}

  /* 장비 3칸 (세로) */
  .gearcol{display:flex;flex-direction:column;gap:5px;}
  .gearslot{position:relative;display:flex;align-items:center;gap:7px;border-radius:8px;padding:5px 7px;
    border:1px solid var(--line);background:var(--well);cursor:pointer;}
  .gearslot:active{filter:brightness(1.3);}
  .gearslot.on{border-color:#6d5320;background:#1d1a12;}
  .gearslot .gi{width:30px;height:30px;border-radius:6px;background:#151926;display:flex;
    align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;}
  .gearslot .gt{flex:1;min-width:0;}
  .gearslot .gn{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gearslot .gs{font-size:9.5px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gearslot.on .gn{color:var(--gold2);}
  .gearslot.lg{border-color:#b98a2c;box-shadow:0 0 8px #e0a93f33;}
  .gearslot.lg .gi{background:linear-gradient(160deg,#ffe9b0,#d9a53c);box-shadow:0 0 8px #e0a93f66;}
  .bang{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:99px;background:var(--red);
    color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}

  /* 정수 3칸 + 스킬 아이콘 */
  .essrow{display:flex;gap:6px;align-items:stretch;}
  .esbox{flex:1;min-width:0;border-radius:9px;border:1px solid var(--line);background:var(--well);
    padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;}
  .esbox:active{filter:brightness(1.25);}
  .esbox.empty{border-style:dashed;opacity:.7;justify-content:center;min-height:78px;}
  .esbox .ef{width:30px;height:30px;border-radius:6px;overflow:hidden;background:#151926;}
  .esbox .ef img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .esbox .en{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .esbox .es{font-size:9px;color:var(--gold2);letter-spacing:-1px;line-height:1;}
  .esbox .eu{font-size:9px;color:var(--green);text-align:center;line-height:1.2;}
  .skico{display:flex;gap:4px;justify-content:center;margin-top:3px;}
  .skb{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#151926;
    display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;position:relative;}
  .skb.act{border-color:#6d5320;background:#241d10;}
  .skb.pas{border-color:#2b5766;background:#10222a;}
  .skb:active{filter:brightness(1.4);}

  /* ── 시설 팝업 */
  .facline{display:flex;align-items:center;gap:8px;font-size:12px;}
  .facline b{font-variant-numeric:tabular-nums;}
  .slotgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
  .tslot{border-radius:9px;border:1px solid var(--line);background:var(--well);padding:5px;
    display:flex;flex-direction:column;align-items:center;gap:3px;min-height:84px;justify-content:center;cursor:pointer;}
  .tslot.empty{border-style:dashed;}
  .tslot .tf{width:34px;height:34px;border-radius:6px;overflow:hidden;background:#151926;}
  .tslot .tf img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;}
  .tslot .tn{font-size:10.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tslot .tt{font-size:9px;color:var(--cyan);}
  .tslot.drop{border-color:var(--gold);background:#241d10;}

  /* ── 대장간 제작 줄 */
  .rec{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:7px 9px;
    display:flex;gap:9px;align-items:center;}
  .rec.no{opacity:.5;}
  .rec .ri2{width:38px;height:38px;border-radius:7px;background:var(--well);display:flex;align-items:center;
    justify-content:center;font-size:19px;flex:0 0 auto;}
  .rec .mid{flex:1;min-width:0;}
  .matchip{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 7px;border-radius:99px;
    background:var(--well);border:1px solid var(--line);cursor:pointer;margin:2px 3px 0 0;}
  .matchip.lack{border-color:#6d2020;color:#e88;}
  .matchip.ok{border-color:#2c6b3e;color:#9fd8b0;}

  /* ★ 트랙 A ⑥ — 보석 소켓 칸. 빈 칸 = 점선 테두리(＋) · 찬 칸 = 실선 테두리 + 색 점. */
  .gemcell{width:34px;height:34px;border-radius:8px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .gemcell.on{border-style:solid;}
  .gemdot{width:16px;height:16px;border-radius:50%;display:inline-block;}

  /* ============================================================
     ★★ 2026-08-30 A+B 개편 — 잘림·스크롤 박멸 부품
     ============================================================ */
  /* ① 폰(가로 390 높이)에서 모달 예산을 넓힌다 — 80% 상자가 전직·캐릭터창을 잘랐다(실측) */
  @media (max-height:480px){
    #modal{padding:8px;}
    #modal .box{max-height:calc(100% - 10px);}
  }
  /* ② 키 큰 팝업 — 부대편성처럼 **판이 남은 높이를 받아야 하는** 팝업. asPopup 이 붙인다.
     높이가 정해져야 안쪽 height:100% 사슬이 살아서 캔버스가 스스로 줄어든다(안 주면 원본
     크기로 넘쳐 스크롤+잘림 — 파티 벤치가 실제로 잘렸다). */
  #modal .box.tall{height:calc(100% - 10px);}
  /* ③ 촘촘한 필터 줄 — 도감처럼 칩이 16개면 보통 크기로는 두 줄이 된다(모달 절반을 먹었다) */
  .mbar.tight{gap:4px;flex-wrap:nowrap;overflow:hidden;}
  .mbar.tight .mtab{font-size:11px;padding:3px 8px;}
  .mbar.tight .lb{font-size:9px;}
  /* ④ 커스텀 아이콘(svg) — OS 이모지를 대신한다. 글자 흐름 안에 앉는다 */
  .ic{display:inline-block;vertical-align:-2px;flex:0 0 auto;}
  /* ⑤ 2열 격자 목록 — 세로 한 줄 목록(육성 8명 중 2.5명·상점 6칸 중 2칸)을 접는다 */
  .list.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
  .list.cols2 .item,.list.cols2 .crow{margin:0;min-width:0;}

</style>
  <script type="module" crossorigin src="/game.js"></script>
</head>
